<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMART CAFE MANAGEMENT</title>
<style>
:root{--bg:#f6f0e6;--card:#fff;--tx:#2b1d14;--mu:#7a6a5c;--pr:#6f4e37;--prt:#fff;--ac:#dfeedd;--bd:#e3d8c8;--rd:#b3261e;--ok:#2e7d32;--wn:#b26a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1612;--card:#2a211b;--tx:#f1e7da;--mu:#b5a597;--pr:#c69c72;--prt:#1d1612;--ac:#2c3b2b;--bd:#43372d;--rd:#ff8a80;--ok:#81c784;--wn:#ffb74d;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pr);color:var(--prt);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:16px}header small{opacity:.85}
nav{display:flex;overflow-x:auto;gap:4px;padding:6px 8px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{white-space:nowrap;border:0;background:none;color:var(--tx);padding:9px 12px;border-radius:8px;font-size:14px;cursor:pointer}
nav button.on{background:var(--pr);color:var(--prt)}
main{padding:12px;max-width:1300px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.kpi{background:var(--ac);border-radius:10px;padding:10px}.kpi small{color:var(--mu);display:block}.kpi b{font-size:19px}
button,.btn,select,input,textarea{font:inherit}
.btn{background:var(--pr);color:var(--prt);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px}
.btn.s{background:var(--ac);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--rd);color:var(--bg)}.btn.sm{padding:5px 9px;min-height:30px;font-size:13px}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;max-width:100%}
.pos{display:grid;grid-template-columns:1fr 360px;gap:12px}@media(max-width:850px){.pos{grid-template-columns:1fr}}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:left;color:var(--tx);cursor:pointer;min-height:76px}
.pi b{display:block}.pi span{color:var(--pr);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.chips button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 12px;cursor:pointer}.chips button.on{background:var(--pr);color:var(--prt)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);vertical-align:top}
.tw{overflow-x:auto}.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:var(--ac)}.bad{color:var(--rd)}.good{color:var(--ok)}.warn{color:var(--wn)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.bar{display:flex;align-items:flex-end;gap:6px;height:130px}.bar div{flex:1;background:var(--pr);border-radius:4px 4px 0 0;min-height:2px;position:relative}.bar i{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;font-style:normal;color:var(--mu)}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;max-width:min(520px,94vw);width:100%}dialog::backdrop{background:#0008}
.tot{font-size:22px;font-weight:700;color:var(--pr)}label{display:block;margin:6px 0 2px;color:var(--mu);font-size:13px}
#toast{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:99;max-width:90vw}
</style></head><body>
<header><b>☕ <span id="shop">SMART CAFE</span></b><small id="mode">Bản cục bộ · dữ liệu lưu trên trình duyệt này</small></header>
<nav id="nav"></nav><main id="main"></main><div id="toast"></div><dialog id="dlg"></dialog>
<script>
const K='scm_v1',$=s=>document.querySelector(s),fm=n=>Math.round(n||0).toLocaleString('vi-VN')+'đ',
esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
dk=t=>new Date(t).toLocaleDateString('sv'),hm=t=>new Date(t).toLocaleString('vi-VN');
let D,view='dash',cart=[],cat='all',disc=0,discT='amt',rng='today',oq='',ost='';
const TOP=[['Trân châu',7000],['Thạch',5000],['Thêm shot cafe',10000]];
const NAV=[['dash','Tổng quan'],['pos','Bán hàng POS'],['orders','Đơn hàng'],['brew','Pha chế'],['menu','Thực đơn'],['stock','Kho nguyên liệu'],['report','Báo cáo'],['logs','Nhật ký'],['set','Cấu hình / Backup']];
function seed(){const P=(id,n,c,s,m,l,cost,r)=>({id,name:n,cat:c,prices:{S:s,M:m,L:l},cost,active:true,recipe:r});
return{seq:1,sample:true,cfg:{name:'SMART CAFE'},cats:['Cafe','Trà','Trà sữa','Sinh tố & Nước ép','Bánh'],
ings:[['cafe','Cafe hạt','g',2000,500,250],['sdac','Sữa đặc','ml',3000,500,60],['stuoi','Sữa tươi','ml',5000,1000,30],['tra','Trà','g',800,200,300],['syrup','Syrup','ml',2000,300,100],['duong','Đường','g',3000,500,22],['ly','Ly','cái',200,50,900],['nap','Nắp','cái',200,50,300],['ong','Ống hút','cái',200,50,200]].map(a=>({id:a[0],name:a[1],unit:a[2],stock:a[3],min:a[4],cost:a[5]})),
products:[P('p1','Cafe đen','Cafe',20000,25000,29000,6000,{cafe:20,duong:5,ly:1,nap:1,ong:1}),P('p2','Cafe sữa','Cafe',25000,30000,35000,8000,{cafe:20,sdac:30,ly:1,nap:1,ong:1}),P('p3','Bạc xỉu','Cafe',29000,35000,39000,10000,{cafe:12,sdac:30,stuoi:60,ly:1,nap:1,ong:1}),P('p4','Latte','Cafe',39000,45000,49000,14000,{cafe:18,stuoi:150,ly:1,nap:1,ong:1}),P('p5','Cappuccino','Cafe',39000,45000,49000,14000,{cafe:18,stuoi:120,ly:1,nap:1,ong:1}),P('p6','Trà đào','Trà',29000,35000,39000,10000,{tra:5,syrup:30,duong:10,ly:1,nap:1,ong:1}),P('p7','Trà chanh','Trà',22000,27000,32000,7000,{tra:5,syrup:20,ly:1,nap:1,ong:1}),P('p8','Trà sữa','Trà sữa',30000,35000,40000,11000,{tra:6,stuoi:100,duong:15,ly:1,nap:1,ong:1}),P('p9','Sinh tố bơ','Sinh tố & Nước ép',35000,42000,48000,16000,{sdac:30,stuoi:80,ly:1,nap:1,ong:1}),P('p10','Nước ép cam','Sinh tố & Nước ép',32000,38000,44000,15000,{duong:10,ly:1,nap:1,ong:1}),P('p11','Bánh croissant','Bánh',25000,25000,25000,12000,{}),P('p12','Bánh tiramisu','Bánh',35000,35000,35000,17000,{})],orders:[],logs:[]}}
function load(){try{D=JSON.parse(localStorage.getItem(K))}catch(e){D=null}if(!D){D=seed();save()}}
function save(){try{const s=JSON.stringify(D);localStorage.setItem(K,s);return localStorage.getItem(K)===s}catch(e){return false}}
function log(type,detail){D.logs.unshift({t:Date.now(),type,detail});D.logs=D.logs.slice(0,1000)}
function tx(fn){const snap=JSON.stringify(D);try{fn();if(!save())throw Error('Không lưu được dữ liệu (trình duyệt chặn bộ nhớ?)')}catch(e){D=JSON.parse(snap);toast('Lỗi: '+e.message);return false}return true}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
function dlg(html){const d=$('#dlg');d.innerHTML=html;d.showModal()}function closeD(){$('#dlg').close()}
function show(title,text){dlg(`<h3>${esc(title)}</h3><textarea id="xt" rows="12" style="width:100%" readonly>${esc(text)}</textarea><div class="row" style="margin-top:8px"><button class="btn" onclick="$('#xt').select();document.execCommand('copy');toast('Đã sao chép')">Sao chép</button><button class="btn s" onclick="closeD()">Đóng</button></div><small style="color:var(--mu)">Lưu nội dung này vào file .${/^\{/.test(text)?'json':'csv'} trên máy của bạn.</small>`)}
const pById=id=>D.products.find(p=>p.id==id);
function go(v){view=v;render()}
function render(){$('#shop').textContent=D.cfg.name;$('#nav').innerHTML=NAV.map(n=>`<button class="${n[0]==view?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');$('#main').innerHTML=V[view]()}
function inR(t){const n=new Date(),d=dk(t),td=dk(n);if(rng=='today')return d==td;if(rng=='7')return t>=n-6*864e5-(n%864e5)&&t<=+n;if(rng=='month')return d.slice(0,7)==td.slice(0,7);return true}
const RS=()=>`<select onchange="rng=this.value;render()">${[['today','Hôm nay'],['7','7 ngày'],['month','Tháng này'],['all','Tất cả']].map(o=>`<option value="${o[0]}" ${rng==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
function stats(){const os=D.orders.filter(o=>inR(o.time));const paid=os.filter(o=>o.payStatus=='paid'),ref=os.filter(o=>o.payStatus=='refunded');
const rev=paid.reduce((a,o)=>a+o.total,0),cups=paid.reduce((a,o)=>a+o.items.reduce((b,i)=>b+i.qty,0),0),cost=paid.reduce((a,o)=>a+o.items.reduce((b,i)=>b+i.cost*i.qty,0),0);
const top={},byPay={},day={};paid.forEach(o=>{byPay[o.method]=(byPay[o.method]||0)+o.total;day[dk(o.time)]=(day[dk(o.time)]||0)+o.total;o.items.forEach(i=>top[i.name]=(top[i.name]||0)+i.qty)});
return{os,paid,rev,cups,cost,n:paid.length,avg:paid.length?rev/paid.length:0,refund:ref.reduce((a,o)=>a+o.total,0),nref:ref.length,cancel:os.filter(o=>o.status=='Đã hủy'&&o.payStatus=='unpaid').length,disc:paid.reduce((a,o)=>a+o.disc,0),top:Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,10),byPay,day,unpaid:os.filter(o=>o.payStatus=='unpaid'&&o.status!='Đã hủy').length,brewing:os.filter(o=>o.status!='Đã hủy'&&['Chờ pha chế','Đang thực hiện'].includes(o.brew)).length}}
const PM={cash:'Tiền mặt',bank:'Chuyển khoản (NV xác nhận)',qr:'QR (NV xác nhận)'};
const V={
dash(){const s=stats(),low=D.ings.filter(i=>i.stock<=i.min);return`${D.sample?'<div class="card warn">⚠ Đang dùng <b>dữ liệu mẫu</b>. Vào Cấu hình để Factory Reset khi bắt đầu kinh doanh thật.</div>':''}
<div class="row sp"><h3 style="margin:0">Tổng quan</h3>${RS()}</div><div class="grid" style="margin:10px 0">${[['Doanh thu thực thu',fm(s.rev)],['Số đơn đã thanh toán',s.n],['Số ly/món đã bán',s.cups],['Hóa đơn trung bình',fm(s.avg)],['Đang pha chế',s.brewing],['Chờ thanh toán',s.unpaid],['Hoàn tiền',fm(s.refund)],['Lãi gộp ước tính',fm(s.rev-s.cost)]].map(k=>`<div class="kpi"><small>${k[0]}</small><b>${k[1]}</b></div>`).join('')}</div>
<div class="card"><b>Doanh thu theo ngày</b>${bars(s.day)}</div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="card"><b>Top sản phẩm bán chạy</b>${s.top.length?s.top.map(t=>`<div class="row sp"><span>${esc(t[0])}</span><b>${t[1]}</b></div>`).join(''):'<p>Chưa có dữ liệu.</p>'}</div>
<div class="card"><b>Nguyên liệu sắp hết</b>${low.length?low.map(i=>`<div class="row sp"><span>${esc(i.name)}</span><b class="${i.stock<=0?'bad':'warn'}">${i.stock} ${i.unit}</b></div>`).join(''):'<p class="good">Tồn kho ổn.</p>'}</div></div>`},
pos(){const ps=D.products.filter(p=>p.active&&(cat=='all'||p.cat==cat)&&p.name.toLowerCase().includes(q.toLowerCase()));const sub=csub(),d=cdisc(sub);
return`<div class="pos"><div><input id="sq" placeholder="🔍 Tìm món..." value="${esc(q)}" oninput="q=this.value;pgrid()" style="width:100%"><div class="chips">${['all',...D.cats].map(c=>`<button class="${cat==c?'on':''}" onclick="cat='${esc(c)}';render()">${c=='all'?'Tất cả':esc(c)}</button>`).join('')}</div><div class="pg" id="pg">${pcards(ps)}</div></div>
<div class="card"><b>Đơn hiện tại</b><div id="cart">${cartH()}</div><hr style="border-color:var(--bd)">
<div class="row sp"><span>Tạm tính</span><b>${fm(sub)}</b></div>
<div class="row"><span>Giảm giá</span><input type="number" min="0" value="${disc}" style="width:90px" onchange="disc=Math.max(0,+this.value||0);render()"><select onchange="discT=this.value;render()"><option value="amt" ${discT=='amt'?'selected':''}>đ</option><option value="pct" ${discT=='pct'?'selected':''}>%</option></select><b>-${fm(d)}</b></div>
<div class="row sp"><span>Tổng thanh toán</span><span class="tot">${fm(sub-d)}</span></div>
<label>Phương thức</label><select id="pm" onchange="pmch()">${Object.entries(PM).map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>
<div id="cashbox"><label>Tiền khách đưa</label><input id="paid" type="number" min="0" oninput="chg()" style="width:100%"><div>Tiền thừa: <b id="chg">0đ</b></div></div>
<div class="row" style="margin-top:10px"><button class="btn" onclick="mkOrder(true)">💵 Thanh toán</button><button class="btn s" onclick="mkOrder(false)">Lưu đơn (chưa TT)</button><button class="btn d sm" onclick="cart=[];disc=0;render()">Xóa</button></div></div></div>`},
orders(){let os=D.orders.filter(o=>(!oq||o.code.toLowerCase().includes(oq.toLowerCase()))&&(!ost||(ost=='paid'?o.payStatus=='paid':ost=='unpaid'?o.payStatus=='unpaid'&&o.status!='Đã hủy':o.status=='Đã hủy')));
return`<div class="row"><h3 style="margin:0">Đơn hàng</h3><input placeholder="Mã đơn" value="${esc(oq)}" onchange="oq=this.value;render()"><select onchange="ost=this.value;render()">${[['','Tất cả'],['paid','Đã thanh toán'],['unpaid','Chờ thanh toán'],['x','Đã hủy/hoàn']].map(o=>`<option value="${o[0]}" ${ost==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div><div class="card tw"><table><tr><th>Mã</th><th>Giờ</th><th>Tổng</th><th>Thanh toán</th><th>Trạng thái</th><th></th></tr>${os.map(o=>`<tr><td>${o.code}</td><td>${hm(o.time)}</td><td>${fm(o.total)}</td><td>${o.payStatus=='paid'?'<span class="good">Đã TT · '+PM[o.method].split(' ')[0]+'</span>':o.payStatus=='refunded'?'<span class="bad">Đã hoàn tiền</span>':'Chưa TT'}</td><td>${o.status}<br><small>${o.brew}</small></td><td class="row"><button class="btn s sm" onclick="detail('${o.id}')">Xem</button>${o.payStatus=='unpaid'&&o.status!='Đã hủy'?`<button class="btn sm" onclick="payOrd('${o.id}')">Thu tiền</button>`:''}${o.status!='Đã hủy'?`<button class="btn d sm" onclick="cancelOrd('${o.id}')">${o.payStatus=='paid'?'Hoàn tiền':'Hủy'}</button>`:''}</td></tr>`).join('')||'<tr><td colspan=6>Chưa có đơn.</td></tr>'}</table></div>`},
brew(){const os=D.orders.filter(o=>o.status!='Đã hủy'&&o.brew!='Đã giao').reverse(),nx={'Chờ pha chế':'Nhận đơn','Đang thực hiện':'Hoàn thành','Hoàn thành':'Đã giao'};
return`<h3>Màn hình pha chế</h3><small>Chỉ chia sẻ dữ liệu trên thiết bị này.</small><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:8px">${os.map(o=>`<div class="card"><div class="row sp"><b>${o.code}</b><span class="tag">${o.brew}</span></div><small class="${(Date.now()-o.time)>6e5?'bad':''}">Chờ ${Math.floor((Date.now()-o.time)/6e4)} phút</small>${o.items.map(i=>`<div>• ${i.qty}× ${esc(i.name)} (${i.size})<br><small>${esc(i.opts.join(', '))} ${esc(i.note)}</small></div>`).join('')}<button class="btn" style="margin-top:8px;width:100%" onclick="setBrew('${o.id}')">${nx[o.brew]}</button></div>`).join('')||'<p>Không có đơn cần pha.</p>'}</div>`},
menu(){return`<div class="row sp"><h3 style="margin:0">Thực đơn</h3><div class="row"><button class="btn" onclick="editP()">+ Thêm món</button><button class="btn s" onclick="editCats()">Danh mục</button></div></div><div class="card tw"><table><tr><th>Món</th><th>Danh mục</th><th>S / M / L</th><th>Giá vốn</th><th>Bán</th><th></th></tr>${D.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td>${[p.prices.S,p.prices.M,p.prices.L].map(x=>fm(x)).join(' / ')}</td><td>${fm(p.cost)}</td><td>${p.active?'✔':'Ẩn'}</td><td class="row"><button class="btn s sm" onclick="editP('${p.id}')">Sửa</button><button class="btn s sm" onclick="dupP('${p.id}')">Nhân bản</button></td></tr>`).join('')}</table></div>`},
stock(){return`<div class="row sp"><h3 style="margin:0">Kho nguyên liệu</h3><button class="btn" onclick="editI()">+ Nguyên liệu</button></div><div class="card tw"><table><tr><th>Tên</th><th>Tồn</th><th>Tối thiểu</th><th>Giá nhập/đv</th><th>Giá trị</th><th></th></tr>${D.ings.map(i=>`<tr><td>${esc(i.name)}</td><td class="${i.stock<=0?'bad':i.stock<=i.min?'warn':''}"><b>${+i.stock.toFixed(2)}</b> ${i.unit}</td><td>${i.min}</td><td>${fm(i.cost)}</td><td>${fm(i.stock*i.cost)}</td><td class="row"><button class="btn sm" onclick="stIn('${i.id}')">Nhập</button><button class="btn s sm" onclick="stAdj('${i.id}')">Kiểm kê</button></td></tr>`).join('')}</table></div><small>Tồn kho tự trừ theo công thức khi đơn được thanh toán (mỗi đơn chỉ trừ một lần).</small>`},
report(){const s=stats();return`<div class="row sp"><h3 style="margin:0">Báo cáo</h3><div class="row">${RS()}<button class="btn s" onclick="csvOrders()">Xuất CSV đơn</button></div></div><div class="grid" style="margin:10px 0">${[['Doanh số (đã TT)',fm(s.rev)],['Giảm giá đã áp',fm(s.disc)],['Hoàn tiền ('+s.nref+' đơn)',fm(s.refund)],['Đơn hủy chưa TT',s.cancel],['Giá vốn ước tính',fm(s.cost)],['Lãi gộp ước tính',fm(s.rev-s.cost)],['Tỷ lệ lãi gộp',s.rev?Math.round((s.rev-s.cost)/s.rev*100)+'%':'—']].map(k=>`<div class="kpi"><small>${k[0]}</small><b>${k[1]}</b></div>`).join('')}</div><div class="card"><b>Theo phương thức</b>${Object.entries(s.byPay).map(p=>`<div class="row sp"><span>${PM[p[0]]}</span><b>${fm(p[1])}</b></div>`).join('')||'<p>Chưa có.</p>'}</div><div class="card"><b>Doanh thu theo ngày</b>${bars(s.day)}</div><small>Đây là lãi gộp ước tính (chưa trừ thuê mặt bằng, lương, điện nước), không phải lợi nhuận ròng. Đơn chưa thanh toán không tính vào tiền thực thu.</small>`},
logs(){return`<h3>Nhật ký hoạt động</h3><div class="card tw"><table>${D.logs.slice(0,200).map(l=>`<tr><td>${hm(l.t)}</td><td>${esc(l.type)}</td><td>${esc(l.detail)}</td></tr>`).join('')||'<tr><td>Trống</td></tr>'}</table></div>`},
set(){return`<h3>Cấu hình</h3><div class="card"><label>Tên quán</label><input id="sn" value="${esc(D.cfg.name)}"> <button class="btn" onclick="saveName()">Lưu</button></div>
<div class="card"><b>Backup / Restore</b><div class="row" style="margin:8px 0"><button class="btn" onclick="backup()">Xuất Backup JSON</button><button class="btn s" onclick="restoreUI()">Khôi phục</button><button class="btn s" onclick="sysCheck()">🩺 KIỂM TRA HỆ THỐNG</button></div><small>Backup gồm sản phẩm, đơn, kho, công thức, nhật ký, cấu hình.</small></div>
<div class="card"><b class="bad">Factory Reset</b><p>Xóa toàn bộ dữ liệu và nạp lại dữ liệu mẫu. Nên Backup trước.</p><button class="btn d" onclick="resetUI()">Factory Reset…</button></div>
<div class="card"><small>Chế độ: <b>cục bộ</b>. Dữ liệu không tự đồng bộ giữa các máy; phân quyền/bảo mật máy chủ, thanh toán trực tuyến, hóa đơn điện tử cần backend và tích hợp riêng (chưa có trong bản này).</small></div>`}};
function bars(day){const k=Object.keys(day).sort().slice(-10),m=Math.max(1,...k.map(x=>day[x]));return k.length?`<div class="bar" style="margin-bottom:22px;margin-top:10px">${k.map(x=>`<div style="height:${day[x]/m*100}%" title="${fm(day[x])}"><i>${x.slice(5)}</i></div>`).join('')}</div>`:'<p>Chưa có dữ liệu.</p>'}
function pcards(ps){return ps.map(p=>`<button class="pi" onclick="pick('${p.id}')"><b>${esc(p.name)}</b><span>${fm(p.prices.M)}</span></button>`).join('')||'<p>Không có món.</p>'}
function pgrid(){$('#pg').innerHTML=pcards(D.products.filter(p=>p.active&&(cat=='all'||p.cat==cat)&&p.name.toLowerCase().includes(q.toLowerCase())))}
function csub(){return cart.reduce((a,i)=>a+i.price*i.qty,0)}function cdisc(s){const d=discT=='pct'?Math.round(s*Math.min(disc,100)/100):disc;return Math.min(Math.max(d,0),s)}
function cartH(){return cart.map((i,x)=>`<div class="row sp" style="margin:6px 0"><div><b>${esc(i.name)}</b> (${i.size})<br><small>${esc(i.opts.join(', '))} ${esc(i.note)}</small></div><div class="row"><button class="btn s sm" onclick="qty(${x},-1)">−</button><b>${i.qty}</b><button class="btn s sm" onclick="qty(${x},1)">+</button><b>${fm(i.price*i.qty)}</b></div></div>`).join('')||'<p style="color:var(--mu)">Chưa có món.</p>'}
function qty(x,d){cart[x].qty+=d;if(cart[x].qty<=0)cart.splice(x,1);render()}
function pick(id){const p=pById(id);dlg(`<h3>${esc(p.name)}</h3><label>Size</label><select id="sz">${['S','M','L'].map(s=>`<option ${s=='M'?'selected':''} value="${s}">${s} – ${fm(p.prices[s])}</option>`).join('')}</select><label>Nóng/lạnh</label><select id="hc"><option>Lạnh</option><option>Nóng</option></select><label>Đường</label><select id="su"><option>100% đường</option><option>70%</option><option>50%</option><option>30%</option><option>Không đường</option></select><label>Đá</label><select id="da"><option>Đá bình thường</option><option>Ít đá</option><option>Không đá</option></select><label>Topping</label>${TOP.map((t,i)=>`<label style="color:var(--tx)"><input type="checkbox" class="tp" value="${i}"> ${t[0]} (+${fm(t[1])})</label>`).join('')}<label>Ghi chú</label><input id="nt" style="width:100%"><div class="row" style="margin-top:12px"><button class="btn" onclick="addC('${id}')">Thêm vào đơn</button><button class="btn s" onclick="closeD()">Hủy</button></div>`)}
function addC(id){const p=pById(id),s=$('#sz').value,tp=[...document.querySelectorAll('.tp:checked')].map(c=>TOP[+c.value]),opts=[$('#hc').value,$('#su').value,$('#da').value,...tp.map(t=>t[0])],price=p.prices[s]+tp.reduce((a,t)=>a+t[1],0),note=$('#nt').value.trim(),key=p.id+s+opts.join()+note,e=cart.find(i=>i.key==key);if(e)e.qty++;else cart.push({key,pid:p.id,name:p.name,size:s,opts,note,price,cost:p.cost,qty:1});closeD();render()}
function pmch(){$('#cashbox').style.display=$('#pm').value=='cash'?'block':'none'}
function chg(){const t=csub()-cdisc(csub());$('#chg').textContent=fm(Math.max(0,(+$('#paid').value||0)-t))}
function deduct(o){o.items.forEach(i=>{const p=pById(i.pid);Object.entries(p?.recipe||{}).forEach(([k,v])=>{const g=D.ings.find(x=>x.id==k);if(g)g.stock=Math.round((g.stock-v*i.qty)*100)/100})});o.stockDone=true}
function mkOrder(pay){if(!cart.length)return toast('Giỏ hàng trống');const sub=csub(),d=cdisc(sub),total=sub-d,m=pay?$('#pm').value:null;let paid=0;
if(pay){if(m=='cash'){paid=+$('#paid').value||0;if(paid<total)return toast('Tiền khách đưa chưa đủ')}else{if(!confirm('Xác nhận ĐÃ nhận '+fm(total)+' qua '+PM[m]+'? (Hệ thống không tự kiểm tra ngân hàng)'))return;paid=total}}
let code;const ok=tx(()=>{const o={id:'o'+Date.now()+Math.random().toString(36).slice(2,5),code:'DH'+String(D.seq++).padStart(4,'0'),time:Date.now(),items:cart.map(({key,...r})=>r),sub,disc:d,total,payStatus:pay?'paid':'unpaid',method:m,paid,change:m=='cash'?paid-total:0,status:'Đã xác nhận',brew:'Chờ pha chế'};if(pay){o.paidAt=Date.now();deduct(o)}D.orders.unshift(o);code=o.code;log('Tạo đơn',o.code+' '+fm(total)+(pay?' · đã TT '+m:' · chưa TT'))});
if(ok){toast((pay?'Đã thanh toán ':'Đã lưu ')+code+(m=='cash'&&paid>total?' · Thừa '+fm(paid-total):''));cart=[];disc=0;render()}}
function payOrd(id){const o=D.orders.find(x=>x.id==id);if(o.payStatus!='unpaid')return toast('Đơn không ở trạng thái chờ thanh toán');const m=prompt('Phương thức: cash / bank / qr','cash');if(!PM[m])return toast('Phương thức không hợp lệ');let paid=o.total;if(m=='cash'){paid=+prompt('Khách đưa bao nhiêu?',o.total)||0;if(paid<o.total)return toast('Chưa đủ tiền')}
if(tx(()=>{const x=D.orders.find(y=>y.id==id);x.payStatus='paid';x.method=m;x.paid=paid;x.change=m=='cash'?paid-x.total:0;x.paidAt=Date.now();if(!x.stockDone)deduct(x);fin(x);log('Thanh toán',x.code+' '+m)})){toast('Đã thu tiền');render()}}
function fin(o){if(o.payStatus=='paid'&&o.brew=='Đã giao')o.status='Đã hoàn thành'}
function cancelOrd(id){const o=D.orders.find(x=>x.id==id),paid=o.payStatus=='paid',r=prompt((paid?'Hoàn tiền ':'Hủy ')+o.code+' – nhập lý do (bắt buộc):');if(!r||!r.trim())return toast('Cần nhập lý do');const back=paid&&o.stockDone&&confirm('Hoàn lại nguyên liệu vào kho? (OK = có, Cancel = không, coi như hao hụt)');
if(tx(()=>{const x=D.orders.find(y=>y.id==id);if(back)x.items.forEach(i=>Object.entries(pById(i.pid)?.recipe||{}).forEach(([k,v])=>{const g=D.ings.find(z=>z.id==k);if(g)g.stock=Math.round((g.stock+v*i.qty)*100)/100}));x.status='Đã hủy';x.reason=r;if(paid){x.payStatus='refunded';x.refundAt=Date.now()}log(paid?'Hoàn tiền':'Hủy đơn',x.code+' · '+r)}))render()}
function detail(id){const o=D.orders.find(x=>x.id==id);dlg(`<h3>${o.code}</h3><small>${hm(o.time)}</small>${o.items.map(i=>`<div class="row sp"><span>${i.qty}× ${esc(i.name)} (${i.size})<br><small>${esc(i.opts.join(', '))} ${esc(i.note)}</small></span><b>${fm(i.price*i.qty)}</b></div>`).join('')}<hr><div class="row sp"><span>Tạm tính</span>${fm(o.sub)}</div><div class="row sp"><span>Giảm giá</span>-${fm(o.disc)}</div><div class="row sp"><b>Tổng</b><b>${fm(o.total)}</b></div><p>${o.payStatus=='paid'?'Đã TT: '+PM[o.method]+' · khách đưa '+fm(o.paid)+' · thừa '+fm(o.change):o.payStatus=='refunded'?'Đã hoàn tiền':'Chưa thanh toán'}${o.reason?'<br>Lý do: '+esc(o.reason):''}</p><div class="row"><button class="btn" onclick="window.print()">In</button><button class="btn s" onclick="closeD()">Đóng</button></div>`)}
function setBrew(id){const n={'Chờ pha chế':'Đang thực hiện','Đang thực hiện':'Hoàn thành','Hoàn thành':'Đã giao'};if(tx(()=>{const o=D.orders.find(x=>x.id==id);o.brew=n[o.brew];fin(o)}))render()}
function editP(id){const p=id?pById(id):{name:'',cat:D.cats[0],prices:{S:0,M:0,L:0},cost:0,active:true,recipe:{}};dlg(`<h3>${id?'Sửa':'Thêm'} món</h3><label>Tên</label><input id="pn" value="${esc(p.name)}" style="width:100%"><label>Danh mục</label><select id="pc">${D.cats.map(c=>`<option ${c==p.cat?'selected':''}>${esc(c)}</option>`).join('')}</select><div class="row">${['S','M','L'].map(s=>`<div><label>Giá ${s}</label><input id="p${s}" type="number" min="0" value="${p.prices[s]}" style="width:100px"></div>`).join('')}<div><label>Giá vốn</label><input id="pcost" type="number" min="0" value="${p.cost}" style="width:100px"></div></div><label>Công thức (mã:định lượng, ví dụ cafe:20,sdac:30)</label><input id="pr" value="${Object.entries(p.recipe).map(e=>e.join(':')).join(',')}" style="width:100%"><small>Mã kho: ${D.ings.map(i=>i.id).join(', ')}</small><label style="color:var(--tx)"><input type="checkbox" id="pa" ${p.active?'checked':''}> Đang kinh doanh</label><div class="row" style="margin-top:10px"><button class="btn" onclick="saveP('${id||''}')">Lưu</button><button class="btn s" onclick="closeD()">Hủy</button></div>`)}
function saveP(id){const n=$('#pn').value.trim();if(!n)return toast('Cần nhập tên');const rec={};for(const s of $('#pr').value.split(',').filter(x=>x.trim())){const[k,v]=s.split(':');if(!D.ings.find(i=>i.id==k.trim())||!(+v>0))return toast('Công thức sai: '+s);rec[k.trim()]=+v}
if(tx(()=>{const o={name:n,cat:$('#pc').value,prices:{S:+$('#pS').value,M:+$('#pM').value,L:+$('#pL').value},cost:+$('#pcost').value,active:$('#pa').checked,recipe:rec};if(id){const old=pById(id);if(old.prices.M!=o.prices.M)log('Đổi giá',n+': '+fm(old.prices.M)+' → '+fm(o.prices.M));Object.assign(old,o)}else D.products.push({id:'p'+Date.now(),...o});log(id?'Sửa món':'Thêm món',n)})){closeD();render()}}
function dupP(id){tx(()=>{const p=JSON.parse(JSON.stringify(pById(id)));p.id='p'+Date.now();p.name+=' (bản sao)';D.products.push(p);log('Nhân bản món',p.name)});render()}
function editCats(){dlg(`<h3>Danh mục</h3><p><small>Mỗi dòng một danh mục. Món thuộc danh mục bị bỏ sẽ vẫn giữ tên cũ.</small></p><textarea id="cl" rows="8" style="width:100%">${esc(D.cats.join('\n'))}</textarea><div class="row" style="margin-top:8px"><button class="btn" onclick="tx(()=>{D.cats=$('#cl').value.split('\\n').map(s=>s.trim()).filter(Boolean);log('Sửa danh mục','')})&&(closeD(),render())">Lưu</button><button class="btn s" onclick="closeD()">Hủy</button></div>`)}
function editI(){dlg(`<h3>Thêm nguyên liệu</h3><label>Mã (không dấu)</label><input id="im"><label>Tên</label><input id="in"><label>Đơn vị</label><input id="iu" value="g"><label>Tồn tối thiểu</label><input id="imin" type="number" value="0"><div class="row" style="margin-top:8px"><button class="btn" onclick="saveI()">Lưu</button><button class="btn s" onclick="closeD()">Hủy</button></div>`)}
function saveI(){const id=$('#im').value.trim(),n=$('#in').value.trim();if(!/^\w+$/.test(id)||!n||D.ings.find(i=>i.id==id))return toast('Mã/tên không hợp lệ hoặc trùng');if(tx(()=>{D.ings.push({id,name:n,unit:$('#iu').value,stock:0,min:+$('#imin').value||0,cost:0});log('Thêm nguyên liệu',n)})){closeD();render()}}
function stIn(id){const g=D.ings.find(i=>i.id==id),q=+prompt('Nhập thêm bao nhiêu '+g.unit+' '+g.name+'?');if(!(q>0))return toast('Số lượng phải > 0');const c=prompt('Đơn giá nhập / '+g.unit+' (để trống = giữ '+g.cost+')',g.cost);tx(()=>{const x=D.ings.find(i=>i.id==id);const nc=c===''||isNaN(+c)?x.cost:+c;x.cost=x.stock+q>0?Math.round((x.stock*x.cost+q*nc)/(x.stock+q)*100)/100:nc;x.stock=Math.round((x.stock+q)*100)/100;log('Nhập kho',x.name+' +'+q+' '+x.unit+' @'+nc)});render()}
function stAdj(id){const g=D.ings.find(i=>i.id==id),v=prompt('Tồn kiểm kê thực tế ('+g.unit+'). Hiện hệ thống: '+g.stock);if(v===null||v===''||isNaN(+v)||+v<0)return;const r=prompt('Lý do chênh lệch (bắt buộc):');if(!r)return toast('Cần lý do');tx(()=>{const x=D.ings.find(i=>i.id==id);log('Kiểm kê',x.name+': '+x.stock+' → '+v+' · '+r);x.stock=+v});render()}
function csvOrders(){const rows=[['Mã','Giờ','Món','Tạm tính','Giảm','Tổng','TT','Phương thức','Trạng thái','Lý do']];D.orders.filter(o=>inR(o.time)).forEach(o=>rows.push([o.code,hm(o.time),o.items.map(i=>i.qty+'x'+i.name+'('+i.size+')').join('; '),o.sub,o.disc,o.total,o.payStatus,o.method||'',o.status,o.reason||'']));show('CSV đơn hàng','\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'))}
function saveName(){const n=$('#sn').value.trim();if(n&&tx(()=>{D.cfg.name=n;log('Đổi cấu hình','Tên quán: '+n)}))render()}
function backup(){show('Backup JSON',JSON.stringify({app:'smart-cafe',version:1,exported:Date.now(),data:D}))}
function restoreUI(){dlg(`<h3>Khôi phục</h3><p><small>Dán nội dung Backup JSON hoặc chọn file.</small></p><input type="file" accept=".json" onchange="const f=this.files[0];if(f)f.text().then(t=>$('#rt').value=t)"><textarea id="rt" rows="8" style="width:100%;margin-top:6px"></textarea><div class="row" style="margin-top:8px"><button class="btn" onclick="doRestore()">Kiểm tra &amp; khôi phục</button><button class="btn s" onclick="closeD()">Hủy</button></div>`)}
function doRestore(){let b;try{b=JSON.parse($('#rt').value)}catch(e){return toast('File không phải JSON hợp lệ')}const d=b&&b.data;if(!d||b.app!='smart-cafe'||!Array.isArray(d.products)||!Array.isArray(d.orders)||!Array.isArray(d.ings)||!Array.isArray(d.cats))return toast('Cấu trúc backup không hợp lệ');
if(!confirm('Sẽ THAY THẾ toàn bộ dữ liệu hiện tại bằng: '+d.products.length+' món, '+d.orders.length+' đơn, '+d.ings.length+' nguyên liệu. Tiếp tục?'))return;
if(tx(()=>{D=d;log('Khôi phục','Từ backup '+new Date(b.exported).toLocaleString('vi-VN'))})){closeD();cart=[];render();toast('Đã khôi phục và xác minh')}}
function resetUI(){dlg(`<h3 class="bad">Factory Reset</h3><p>Toàn bộ dữ liệu sẽ bị xóa. Gõ <b>XOA</b> để xác nhận.</p><input id="rx"><div class="row" style="margin-top:8px"><button class="btn d" onclick="if($('#rx').value=='XOA'){const s=JSON.stringify(D);D=seed();if(save()){cart=[];closeD();render();toast('Đã reset')}else{D=JSON.parse(s);toast('Reset thất bại')}}else toast('Chưa gõ đúng XOA')">Xóa tất cả</button><button class="btn s" onclick="closeD()">Hủy</button></div>`)}
function sysCheck(){const R=[],t=(n,f)=>{try{const r=f();R.push([n,r===true?'ok':r===false?'bad':'warn',r===true?'Hoạt động tốt':r===false?'Lỗi':r])}catch(e){R.push([n,'bad','Lỗi: '+e.message])}};
t('LocalStorage ghi/đọc',()=>{localStorage.setItem('_t','1');const r=localStorage.getItem('_t')=='1';localStorage.removeItem('_t');return r});
t('Tuần tự hóa dữ liệu',()=>JSON.stringify(JSON.parse(JSON.stringify(D)))==JSON.stringify(D));
t('Tính tiền (2×30.000đ −10% = 54.000đ)',()=>{const s=60000;return s-Math.round(s*10/100)==54000});
t('Trừ kho theo công thức',()=>{const o={items:[{pid:'p2',qty:10}]},g=JSON.parse(JSON.stringify(D.ings)),b=D.ings.find(i=>i.id=='cafe').stock;if(!pById('p2'))return 'Không có món p2 để thử';deduct(o);const a=D.ings.find(i=>i.id=='cafe').stock;D.ings=g;return b-a==200});
t('Dữ liệu sản phẩm hợp lệ',()=>D.products.every(p=>p.name&&p.prices.M>=0)&&D.products.length>0);
t('Tồn kho âm',()=>D.ings.some(i=>i.stock<0)?'Có nguyên liệu âm tồn':true);
t('Đơn thanh toán có đủ tiền',()=>D.orders.every(o=>o.payStatus!='paid'||o.paid>=o.total));
t('In hóa đơn',()=>typeof window.print=='function'?true:false);
t('Tương thích trình duyệt (dialog)',()=>typeof HTMLDialogElement=='function');
dlg(`<h3>Kết quả kiểm tra</h3>${R.map(r=>`<div class="row sp"><span>${r[0]}</span><b class="${r[1]=='ok'?'good':r[1]=='bad'?'bad':'warn'}">${r[1]=='ok'?'✔ ':r[1]=='bad'?'✖ ':'⚠ '}${r[2]}</b></div>`).join('')}<button class="btn" style="margin-top:10px" onclick="closeD()">Đóng</button>`)}
load();render();
</script></body></html>
