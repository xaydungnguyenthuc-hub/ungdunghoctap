<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMS TEST – Quản lý tiêu chuẩn thí nghiệm vật liệu xây dựng</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--tx:#14213d;--mu:#5b6b86;--pr:#0b3d91;--pr2:#1769aa;--bd:#d5dde9;--ok:#1b7f4b;--wn:#b36b00;--er:#b3261e}
[data-theme=dark]{--bg:#0e1626;--card:#162239;--tx:#e6ecf7;--mu:#93a3bf;--pr:#5aa2ff;--pr2:#3b82d6;--bd:#2a3a57;--ok:#4cc38a;--wn:#f0b04a;--er:#ff7a70}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Arial;background:var(--bg);color:var(--tx)}
header{background:var(--pr);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
[data-theme=dark] header{background:#0b2a5c;color:#fff}
header h1{font-size:16px;margin:0;flex:1}header button{background:#ffffff22;color:#fff;border:1px solid #ffffff55}
.wrap{display:flex;min-height:calc(100vh - 50px)}nav{width:215px;background:var(--card);border-right:1px solid var(--bd);padding:8px;flex-shrink:0}
nav a{display:block;padding:8px 10px;border-radius:6px;color:var(--tx);cursor:pointer;margin-bottom:2px}nav a.on,nav a:hover{background:var(--pr);color:#fff}
main{flex:1;padding:16px;min-width:0}.bc{color:var(--mu);font-size:12px;margin-bottom:8px}
h2{margin:0 0 12px;font-size:19px}.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi b{font-size:24px;color:var(--pr)}.kpi span{display:block;color:var(--mu);font-size:12px}
button,select,input,textarea{font:inherit;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
button{cursor:pointer}button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button.d{color:var(--er)}button.s{padding:2px 7px;font-size:12px}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tb input[type=search]{flex:1;min-width:200px}
.big input{width:100%;padding:12px;font-size:17px}.ov{overflow-x:auto}table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--bg);position:sticky;top:0;white-space:nowrap}
.b{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:var(--bd);color:var(--tx);white-space:nowrap}.b.w{background:#ffe2b0;color:#7a4300}.b.o{background:#c8f0da;color:#0c5a33}.b.e{background:#ffd5d1;color:#8a1a13}.b.demo{background:#e7d4ff;color:#4b1d86}
#m{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}
#m>div{background:var(--card);border-radius:8px;padding:16px;width:min(760px,100%)}
label{display:block;margin:6px 0 2px;font-size:12px;color:var(--mu)}.fm input,.fm select,.fm textarea{width:100%}textarea{min-height:60px}
.warn{border-left:4px solid var(--wn);background:#fff6e5;color:#5a3600;padding:8px;margin:6px 0;border-radius:4px}[data-theme=dark] .warn{background:#3a2c10;color:#ffd99a}
#toast{position:fixed;bottom:16px;right:16px;background:var(--pr);color:#fff;padding:10px 16px;border-radius:6px;display:none;z-index:99}
@media(max-width:760px){.wrap{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;gap:4px;border-right:0;border-bottom:1px solid var(--bd)}nav a{white-space:nowrap}}
@media print{header,nav,.tb,.np,#toast{display:none!important}main{padding:0}}
</style></head><body>
<header><h1 id="ttl">CMS TEST – QUẢN LÝ TIÊU CHUẨN THÍ NGHIỆM VẬT LIỆU XÂY DỰNG</h1><button onclick="theme()">Sáng/Tối</button></header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div><div id="m"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4),today=()=>new Date().toISOString().slice(0,10);
const KEY='cmstest_v1',ST=['DRAFT','REVIEW','VERIFIED','PUBLISHED','ARCHIVED','NEEDS_REVIEW'];
const V=['Chưa xác minh','Đang hiệu lực — đã xác minh','Đã bị thay thế — đã xác minh','Đã bị hủy bỏ — đã xác minh','Chưa đủ thông tin','Cần rà soát'];
const E={
standards:{n:'Tiêu chuẩn',k:1,f:[['code','Mã tiêu chuẩn','t',1],['name','Tên đầy đủ','t',1],['type','Loại','s',0,['TCVN','Tiêu chuẩn ngành','Quốc tế','QCVN','Khác']],['mat','Nhóm vật liệu','ref:materials'],['validity','Trạng thái hiệu lực','s',0,V],['version','Phiên bản/năm','t'],['issued','Ngày ban hành','d'],['issuer','Cơ quan ban hành','t'],['replaces','Thay thế','t'],['replacedBy','Bị thay thế bởi','t'],['scope','Phạm vi áp dụng','a'],['src','Nguồn/URL chính thức','t'],['checked','Ngày kiểm tra gần nhất','d'],['note','Ghi chú kỹ thuật','a']]},
materials:{n:'Vật liệu',f:[['group','Nhóm vật liệu','t',1],['name','Vật liệu','t',1],['note','Ghi chú','a']]},
indicators:{n:'Chỉ tiêu',f:[['code','Mã chỉ tiêu','t'],['name','Tên chỉ tiêu','t',1],['mat','Vật liệu','ref:materials'],['unit','Đơn vị','t'],['methodStd','TC phương pháp thử','ref:standards'],['reqStd','TC yêu cầu kỹ thuật','ref:standards'],['sampling','Lấy mẫu/chuẩn bị mẫu','a'],['equip','Thiết bị','ref:equipment'],['formula','Công thức tính (có nguồn)','a'],['src','Nguồn','t']]},
procedures:{n:'Quy trình',f:[['name','Tên quy trình','t',1],['ind','Chỉ tiêu','ref:indicators'],['std','Tài liệu viện dẫn','ref:standards'],['steps','Trình tự (mỗi dòng 1 bước)','a'],['warn','Cảnh báo kỹ thuật','a'],['src','Nguồn/vị trí tham chiếu','t',1]]},
requirements:{n:'Yêu cầu kỹ thuật',k:1,f:[['code','Mã yêu cầu','t',1],['mat','Vật liệu','ref:materials'],['ind','Chỉ tiêu','ref:indicators'],['unit','Đơn vị','t'],['op','Điều kiện','s',0,['>=','>','<=','<','khoảng','=','văn bản']],['lo','Giá trị/giới hạn dưới','t'],['hi','Giới hạn trên','t'],['text','Giá trị dạng văn bản','t'],['std','Tiêu chuẩn áp dụng','ref:standards'],['ver','Phiên bản TC','t'],['basis','Căn cứ thiết kế/hợp đồng','t'],['src','Nguồn','t']]},
equipment:{n:'Thiết bị',k:1,f:[['code','Mã thiết bị','t',1],['name','Tên thiết bị','t',1],['model','Hãng/Model/Serial','t'],['range','Phạm vi đo/độ phân giải','t'],['cal','Hiệu chuẩn gần nhất','d'],['next','Hiệu chuẩn tiếp theo','d'],['cert','Mã chứng chỉ','t'],['state','Tình trạng','s',0,['Đang sử dụng','Cần hiệu chuẩn','Đang sửa chữa','Ngừng sử dụng']]]},
documents:{n:'Tài liệu',k:1,f:[['code','Mã tài liệu','t',1],['name','Tên tài liệu','t',1],['type','Loại','s',0,['Tiêu chuẩn TCVN','Tiêu chuẩn quốc tế','Quy chuẩn','Quy trình nội bộ','Biểu mẫu','Phiếu kết quả','Hồ sơ nghiệm thu','Tài liệu dự án']],['version','Phiên bản','t'],['url','URL/tên file','t'],['std','Tiêu chuẩn liên kết','ref:standards'],['mat','Vật liệu','ref:materials'],['proj','Dự án','ref:projects'],['file','File đính kèm (lưu trong IndexedDB)','file'],['note','Mô tả','a']]},
projects:{n:'Dự án',k:1,f:[['code','Mã dự án','t',1],['name','Tên dự án','t',1],['unit','Chủ đầu tư/đơn vị','t'],['loc','Địa điểm','t'],['note','Ghi chú','a']]},
checklists:{n:'Checklist',f:[['name','Tên checklist','t',1],['proj','Dự án','ref:projects'],['std','Tiêu chuẩn','ref:standards'],['mat','Vật liệu','ref:materials'],['items','Hạng mục (mỗi dòng 1 mục)','a']]}};
const NAV=[['dash','Dashboard'],['standards','Tra cứu tiêu chuẩn'],['materials','Danh mục vật liệu'],['indicators','Chỉ tiêu thí nghiệm'],['procedures','Quy trình thí nghiệm'],['requirements','Yêu cầu kỹ thuật & nghiệm thu'],['equipment','Thiết bị thí nghiệm'],['documents','Hồ sơ và tài liệu'],['projects','Dự án'],['checklists','Checklist kiểm soát'],['ai','Trợ lý AI'],['reports','Báo cáo'],['admin','Admin Studio'],['backup','Sao lưu & khôi phục'],['diag','Kiểm tra hệ thống']];
let DB,S={q:'',st:'',va:'',mat:''},cur='dash';
function seed(){const d={cfg:{name:'CMS TEST',unit:'',dark:0},log:[],recent:[],fav:[],data:{}};for(const e in E)d.data[e]=[];
const mk=(e,o)=>{const r={id:uid(),status:'DRAFT',demo:1,upd:today(),...o};d.data[e].push(r);return r.id};
const G={'Xi măng và chất kết dính':['Xi măng poóc lăng','Vôi xây dựng'],'Cốt liệu':['Cát xây dựng','Đá dăm'],'Bê tông':['Bê tông tươi','Bê tông thương phẩm'],'Thép xây dựng':['Thép thanh','Thép cuộn'],'Vữa và vật liệu xây':['Vữa xây','Gạch đất sét nung'],'Đất và vật liệu nền móng':['Đất đắp','Cấp phối đá dăm'],'Mặt đường':['Bê tông nhựa','Nhựa đường'],'Vật liệu chống thấm và hoàn thiện':['Vật liệu chống thấm','Gạch ốp lát']};
const M={};for(const g in G)G[g].forEach(n=>M[n]=mk('materials',{group:g,name:n,status:'NEEDS_REVIEW'}));
const s1=mk('standards',{code:'DEMO-001',name:'[DEMO] Tiêu chuẩn minh họa phương pháp thử cốt liệu',type:'TCVN',mat:M['Cát xây dựng'],validity:V[0],status:'NEEDS_REVIEW',note:'DỮ LIỆU DEMO – không phải mã tiêu chuẩn thật'});
mk('standards',{code:'DEMO-002',name:'[DEMO] Tiêu chuẩn minh họa yêu cầu kỹ thuật bê tông',type:'TCVN',mat:M['Bê tông tươi'],validity:V[0],status:'NEEDS_REVIEW',note:'DỮ LIỆU DEMO'});
const eq=mk('equipment',{code:'DEMO-TB-01',name:'[DEMO] Cân kỹ thuật',state:'Đang sử dụng',next:'2025-01-01',status:'NEEDS_REVIEW'});
const i1=mk('indicators',{code:'DEMO-CT-01',name:'Thành phần hạt',mat:M['Cát xây dựng'],unit:'%',methodStd:s1,equip:eq,status:'NEEDS_REVIEW'});
['Độ ẩm','Độ hút nước','Cường độ nén','Độ sụt bê tông','Độ kim lún'].forEach((n,i)=>mk('indicators',{code:'DEMO-CT-0'+(i+2),name:n,status:'NEEDS_REVIEW'}));
mk('requirements',{code:'DEMO-YC-01',mat:M['Cát xây dựng'],ind:i1,op:'văn bản',text:'(chưa có giá trị – cần nhập từ tiêu chuẩn/hồ sơ dự án)',std:s1,status:'NEEDS_REVIEW'});
mk('procedures',{name:'[DEMO] Quy trình mẫu – chưa có nội dung kỹ thuật',ind:i1,src:'(chưa có nguồn)',steps:'Bước nhập từ tiêu chuẩn hợp pháp',status:'NEEDS_REVIEW'});
return d}
function load(){try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!DB||!DB.data){DB=seed();save()}for(const e in E)if(!DB.data[e])DB.data[e]=[];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));return 1}catch(e){toast('Lỗi lưu dữ liệu: '+e.message);return 0}}
function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';clearTimeout(x.t);x.t=setTimeout(()=>x.style.display='none',2800)}
function log(a,e,id,b,af,n){DB.log.unshift({t:new Date().toLocaleString('vi-VN'),a,e,id,b:b?JSON.stringify(b):'',af:af?JSON.stringify(af):'',n:n||''});DB.log=DB.log.slice(0,500)}
const D=e=>DB.data[e],get=(e,id)=>D(e).find(r=>r.id===id),lab=(e,id)=>{const r=get(e,id);return r?(r.code||r.name):''};
const val=(e,f,r)=>{let v=r[f[0]];if(f[2]=='file')return esc(r.fileName?r.fileName+' ('+Math.round(r.fileSize/1024)+' KB)':'');if(f[2].startsWith('ref'))return esc(lab(f[2].slice(4),v));if(f[0]=='next'&&v&&v<today())return esc(v)+' <span class="b e">Quá hạn</span>';return esc(v)};
const stb=r=>`<span class="b ${r.status=='VERIFIED'||r.status=='PUBLISHED'?'o':r.status=='NEEDS_REVIEW'?'w':''}">${r.status}</span>${r.demo?' <span class="b demo">DEMO</span>':''}`;
function theme(){DB.cfg.dark=DB.cfg.dark?0:1;apply();save()}
function apply(){document.documentElement.dataset.theme=DB.cfg.dark?'dark':'';$('#ttl').textContent=(DB.cfg.name||'CMS TEST')+' – QUẢN LÝ TIÊU CHUẨN THÍ NGHIỆM VẬT LIỆU XÂY DỰNG'}
function go(v){if(['admin','backup'].includes(v)&&DB.cfg.pin&&!UNL)return needPin(()=>go(v));cur=v;S={q:'',st:'',va:'',mat:''};$('#nav').innerHTML=NAV.map(n=>`<a class="${n[0]==v?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('');const t=NAV.find(n=>n[0]==v)[1];
$('#main').innerHTML=`<div class="bc np">CMS TEST › ${t}</div><h2>${t}</h2><div id="v"></div>`;({dash,admin,backup,diag,reports,ai}[v]||(()=>listView(v)))();scrollTo(0,0)}
function dash(){const c=e=>D(e).length,st=D('standards'),dup=dups().length,nv=st.filter(s=>s.validity==V[0]).length;
const k=[['Tiêu chuẩn',c('standards')],['Đã xác minh (VERIFIED/PUBLISHED)',st.filter(s=>['VERIFIED','PUBLISHED'].includes(s.status)).length],['Cần rà soát/chưa xác minh hiệu lực',nv],['Đã thay thế/hủy bỏ',st.filter(s=>/thay thế|hủy bỏ/.test(s.validity)).length],['Vật liệu',c('materials')],['Chỉ tiêu',c('indicators')],['Quy trình',c('procedures')],['Tài liệu',c('documents')],['Thiết bị',c('equipment')],['Yêu cầu kỹ thuật',c('requirements')]];
const w=[];st.filter(s=>!s.version).forEach(s=>w.push('Thiếu phiên bản: '+s.code));st.filter(s=>!s.src).forEach(s=>w.push('Thiếu nguồn: '+s.code));dups().forEach(x=>w.push('Trùng mã: '+x));D('requirements').filter(r=>!r.basis||!r.ver).forEach(r=>w.push('Yêu cầu thiếu căn cứ/phiên bản: '+r.code));D('equipment').filter(q=>q.next&&q.next<today()).forEach(q=>w.push('Thiết bị quá hạn hiệu chuẩn theo ngày nhập: '+q.code));
$('#v').innerHTML=`<div class="card big np"><input type="search" id="gq" placeholder="Tra cứu nhanh: mã tiêu chuẩn, vật liệu, chỉ tiêu, từ khóa… (Enter)" onkeydown="if(event.key=='Enter'){go('standards');S.q=this.value;$('#q').value=S.q;draw()}"></div>
<div class="grid">${k.map(x=>`<div class="card kpi"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>
<div class="card np"><button class="p" onclick="go('standards')">Tra cứu tiêu chuẩn</button> <button onclick="go('standards');form('standards')">Thêm tiêu chuẩn</button> <button onclick="go('materials');form('materials')">Thêm vật liệu</button> <button onclick="go('reports')">Xuất danh mục</button> <button onclick="go('backup')">Sao lưu dữ liệu</button></div>
<div class="card"><b>Cảnh báo quản lý</b> (chỉ dựa trên dữ liệu đang có)${w.length?'<ul>'+w.slice(0,30).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p>Không có cảnh báo.</p>'}</div>
<div class="card"><b>Xem gần đây</b><br>${DB.recent.map(i=>get('standards',i)).filter(Boolean).map(s=>`<a href="#" onclick="detail('standards','${s.id}');return false">${esc(s.code)}</a>`).join(' · ')||'Chưa có'}</div>`}
function dups(){const o=[];for(const e of ['standards','equipment','documents','requirements']){const m={};D(e).forEach(r=>{const k=(r.code||'').trim().toLowerCase();if(k){if(m[k])o.push(r.code);m[k]=1}})}return o}
function listView(e){const sc=E[e];const isS=e=='standards';
$('#v').innerHTML=`<div class="tb np"><input type="search" id="q" placeholder="Tìm…" oninput="S.q=this.value;draw()">${isS?`<select onchange="S.va=this.value;draw()"><option value="">Mọi hiệu lực</option>${V.map(v=>`<option>${v}</option>`).join('')}</select><select onchange="S.mat=this.value;draw()"><option value="">Mọi vật liệu</option>${D('materials').map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select>`:''}<select onchange="S.st=this.value;draw()"><option value="">Mọi trạng thái</option>${ST.map(v=>`<option>${v}</option>`).join('')}</select><select onchange="S.so=this.value;draw()"><option value="">Sắp xếp: mặc định</option><option value="a">Theo mã/tên</option><option value="u">Mới cập nhật</option></select><button class="p" onclick="form('${e}')">+ Thêm</button><button onclick="csvOut('${e}')">Xuất CSV</button><button onclick="print()">In</button></div><div class="ov" id="tb"></div>`;draw()}
function draw(){const e=cur,sc=E[e],q=S.q.toLowerCase();let rs=D(e).filter(r=>(!q||JSON.stringify(Object.values(r)).toLowerCase().includes(q)||sc.f.some(f=>f[2].startsWith('ref')&&lab(f[2].slice(4),r[f[0]]).toLowerCase().includes(q)))&&(!S.st||r.status==S.st)&&(!S.va||r.validity==S.va)&&(!S.mat||r.mat==S.mat));
if(S.so=='a')rs.sort((a,b)=>(a.code||a.name||'').localeCompare(b.code||b.name||''));if(S.so=='u')rs.sort((a,b)=>(b.upd||'').localeCompare(a.upd||''));
const cols=sc.f.slice(0,6);$('#tb').innerHTML=rs.length?`<table><tr>${cols.map(f=>`<th>${f[1]}</th>`).join('')}<th>Xác minh</th><th class="np"></th></tr>${rs.map(r=>`<tr>${cols.map(f=>`<td>${val(e,f,r)}</td>`).join('')}<td>${stb(r)}</td><td class="np" style="white-space:nowrap"><button class="s" onclick="detail('${e}','${r.id}')">Xem</button> <button class="s" onclick="form('${e}','${r.id}')">Sửa</button> <button class="s" onclick="dup('${e}','${r.id}')">Nhân bản</button> <button class="s d" onclick="del('${e}','${r.id}')">Xóa</button></td></tr>`).join('')}</table>`:`<div class="card">Không có dữ liệu phù hợp. Thử từ khóa ngắn hơn hoặc bỏ bớt bộ lọc.</div>`}
function modal(h){const m=$('#m');m.innerHTML='<div>'+h+'</div>';m.style.display='flex'}const close=()=>$('#m').style.display='none';

function csvOut(e,rows,cols,name){let data;if(rows){data=[cols,...rows]}else{const f=E[e].f;data=[f.map(x=>x[0]),...D(e).map(r=>f.map(x=>r[x[0]]??''))]}

function parseCSV(t){const R=[];let r=[],c='',q=0;t=t.replace(/^\ufeff/,'');for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}else if(ch=='"')q=1;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';R.push(r);r=[]}else c+=ch}if(c||r.length){r.push(c);R.push(r)}return R.filter(x=>x.join('')!=='')}

if(!confirm(`Xem trước: ${rs.length} dòng – ${ok.length} sẽ thêm mới, ${dp} trùng mã (bỏ qua), ${bad.length} thiếu trường bắt buộc (bỏ qua).\nBản ghi nhập vào sẽ ở trạng thái DRAFT. Tiếp tục?`))return;
ok.forEach(o=>{const r={status:'DRAFT',upd:today(),...Object.fromEntries(sc.f.map(f=>[f[0],o[f[0]]??'']) ),id:uid()};D(e).push(r)});log('Nhập dữ liệu',e,'',0,0,ok.length+' bản ghi từ '+f.name);save();toast('Đã nhập '+ok.length+' bản ghi')}catch(x){toast('File không hợp lệ: '+x.message)}inp.value=''};rd.readAsText(f)}

t('Backup → JSON hợp lệ',()=>{const b=JSON.parse(JSON.stringify(DB));return [b.data&&Object.keys(E).every(e=>Array.isArray(b.data[e]))?'OK':'LỖI','Chỉ kiểm tra tuần tự hóa, chưa khôi phục thực']});
['Import CSV tiếng Việt','Export CSV tiếng Việt','Trạng thái tích hợp AI'].forEach(n=>r.push([n,'CHƯA KIỂM TRA','Cần thao tác thủ công / chưa triển khai']));
$('#v').innerHTML=`<div class="card"><button class="p" onclick="diag()">Chạy lại</button><table><tr><th>Hạng mục</th><th>Kết quả</th><th>Chi tiết</th></tr>${r.map(x=>`<tr><td>${x[0]}</td><td><span class="b ${x[1]=='OK'?'o':x[1]=='LỖI'?'e':x[1]=='CẢNH BÁO'?'w':''}">${x[1]}</span></td><td>${esc(x[2])}</td></tr>`).join('')}</table></div>`}
const idb=()=>new Promise((ok,no)=>{const q=indexedDB.open('cmstest_files',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const tx=(m,f)=>idb().then(d=>new Promise((ok,no)=>{const t=d.transaction('f',m),r=f(t.objectStore('f'));t.oncomplete=()=>ok(r.result);t.onerror=()=>no(t.error)}));
const idbPut=(k,b)=>tx('readwrite',s=>s.put(b,k)),idbGet=k=>tx('readonly',s=>s.get(k)),idbDel=k=>tx('readwrite',s=>s.delete(k));
async function idbTest(){await idbPut('_t',new Blob(['x']));const b=await idbGet('_t');await idbDel('_t');return b&&b.size==1?['OK','Đã ghi/đọc/xóa thực tế']:['LỖI','Đọc lại không khớp']}
function dlFile(id){idbGet(id).then(b=>{if(!b)return toast('Không tìm thấy file trong IndexedDB (trình duyệt/thiết bị khác?)');const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=get('documents',id).fileName;a.click()}).catch(x=>toast(x.message))}
function clHtml(r){const it=(r.items||'').split('\n').filter(Boolean),d=r.done||[];return `<h4>Danh sách kiểm tra (${d.length}/${it.length})</h4>`+it.map((t,i)=>`<label style="color:var(--tx);font-size:14px"><input type="checkbox" style="width:auto" ${d.includes(i)?'checked':''} onchange="chk('${r.id}',${i})"> ${esc(t)}</label>`).join('')}
function chk(id,i){const r=get('checklists',id);r.done=r.done||[];r.done=r.done.includes(i)?r.done.filter(x=>x!=i):[...r.done,i];r.upd=today();save();detail('checklists',id)}
function mkCL(id){const s=get('standards',id),ind=D('indicators').filter(i=>i.methodStd==id||i.reqStd==id),rq=D('requirements').filter(q=>q.std==id);const items=['Đối chiếu bản tiêu chuẩn hợp pháp, phiên bản và nguồn: '+s.code,'Xác minh trạng thái hiệu lực từ nguồn chính thức',...ind.map(i=>'Chỉ tiêu: '+i.name),...rq.map(q=>'Đối chiếu yêu cầu kỹ thuật '+q.code+' với hồ sơ dự án')].join('\n');const r={id:uid(),status:'DRAFT',upd:today(),name:'Checklist – '+s.code,std:id,items};D('checklists').push(r);log('Tạo mới','checklists',r.id,0,r,'từ tiêu chuẩn');save();close();toast('Đã tạo checklist (DRAFT)');go('checklists')}
let UNL=0;
async function hash(p,s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function needPin(cb){if(!DB.cfg.pin||UNL)return cb();modal('<h3>Nhập mã PIN quản trị</h3><input type="password" id="pn" onkeydown="if(event.key==\'Enter\')chkPin()"><p><button class="p" onclick="chkPin()">Mở khóa</button> <button onclick="close()">Hủy</button></p>');window.PCB=cb;setTimeout(()=>$('#pn').focus(),50)}
async function chkPin(){if(await hash($('#pn').value,DB.cfg.pin.s)==DB.cfg.pin.h){UNL=1;close();PCB()}else toast('Sai PIN')}
async function setPin(){const p=$('#np').value;if(p.length<4)return toast('PIN tối thiểu 4 ký tự');if(!(window.crypto&&crypto.subtle))return toast('Trình duyệt/ngữ cảnh này không hỗ trợ băm an toàn');const s=uid();DB.cfg.pin={s,h:await hash(p,s)};UNL=1;save();toast('Đã đặt PIN');go('admin')}
function rmPin(){if(!confirm('Gỡ PIN?'))return;delete DB.cfg.pin;save();go('admin')}
function ai(){$('#v').innerHTML=`<div class="warn"><b>NỘI DUNG AI ĐỀ XUẤT — CẦN KIỂM TRA TRƯỚC KHI SỬ DỤNG.</b><br>API Key chỉ giữ tạm trong phiên trình duyệt (sessionStorage), không đưa vào backup; vì gọi trực tiếp từ trình duyệt nên không bảo mật tuyệt đối. Văn bản bạn nhập sẽ được gửi tới nhà cung cấp AI – chỉ dùng tài liệu bạn có quyền sử dụng.</div><div class="card fm"><label>API Key (Anthropic)</label><input type="password" id="ak" value="${esc(sessionStorage.getItem('ak')||'')}"><label>Model</label><input id="am" value="${esc(sessionStorage.getItem('am')||'claude-sonnet-5-5')}"><label>Câu hỏi hoặc văn bản nguồn</label><textarea id="aq" style="min-height:130px"></textarea><p><button class="p" onclick="aiRun(0)">Hỏi / tóm tắt</button> <button onclick="aiRun(1)">Trích xuất bản nháp tiêu chuẩn</button> <button onclick="aiRun(2)">Tạo checklist hồ sơ</button></p></div><div id="ao"></div>`}
async function aiRun(m){const k=$('#ak').value.trim(),q=$('#aq').value.trim();if(!k||!q)return toast('Cần API Key và nội dung');sessionStorage.setItem('ak',k);sessionStorage.setItem('am',$('#am').value);
const ctx='Mã tiêu chuẩn đang có: '+D('standards').map(x=>x.code).join(', ')+' | Vật liệu: '+D('materials').map(x=>x.name).join(', ');
const sys='Bạn hỗ trợ tra cứu tiêu chuẩn thí nghiệm vật liệu xây dựng Việt Nam. Không tự khẳng định hiệu lực tiêu chuẩn, không tự đặt thông số thí nghiệm hay giới hạn nghiệm thu; thiếu căn cứ thì nói rõ. Chỉ dựa trên văn bản người dùng cung cấp.'+(m==1?' Trả về DUY NHẤT một mảng JSON, mỗi phần tử có khóa: code,name,type,scope,version,issued(YYYY-MM-DD hoặc rỗng),issuer,src. Chỉ điền thông tin có trong văn bản, thiếu thì để rỗng.':m==2?' Trả về danh sách kiểm tra, mỗi dòng một mục, không đánh số, không bịa thông số.':'');
$('#ao').innerHTML='<div class="card">Đang gọi AI…</div>';
try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:$('#am').value,max_tokens:2000,system:sys,messages:[{role:'user',content:(m?'':ctx+'\n\n')+q}]})});const j=await r.json();if(!r.ok)throw Error(j.error?.message||r.status);const t=j.content.filter(c=>c.type=='text').map(c=>c.text).join('\n');let act='';
if(m==1){try{window.AIJ=JSON.parse(t.replace(/```json|```/g,'').trim());if(!Array.isArray(AIJ))throw 0;act=`<button class="p" onclick="aiAdd()">Thêm ${AIJ.length} bản nháp (DRAFT)</button>`}catch(x){act='<b>Không phân tích được JSON – kiểm tra thủ công.</b>'}}
if(m==2){window.AIT=t;act='<button class="p" onclick="aiCL()">Lưu thành checklist (DRAFT)</button>'}
$('#ao').innerHTML=`<div class="card"><div class="warn"><b>NỘI DUNG AI ĐỀ XUẤT — CẦN KIỂM TRA TRƯỚC KHI SỬ DỤNG.</b></div><pre style="white-space:pre-wrap">${esc(t)}</pre><p>${act}</p></div>`}catch(x){$('#ao').innerHTML='<div class="card warn">Lỗi gọi AI: '+esc(x.message)+' (có thể do key sai, mạng hoặc trình duyệt chặn truy cập chéo nguồn)</div>'}}
function aiAdd(){let n=0,sk=0;AIJ.forEach(o=>{if(!o.code||!o.name||D('standards').some(r=>(r.code||'').toLowerCase()==String(o.code).toLowerCase()))return sk++;D('standards').push({id:uid(),status:'DRAFT',upd:today(),validity:V[0],type:o.type||'TCVN',code:o.code,name:o.name,scope:o.scope||'',version:o.version||'',issued:o.issued||'',issuer:o.issuer||'',src:o.src||'',note:'NỘI DUNG AI ĐỀ XUẤT — CẦN KIỂM TRA TRƯỚC KHI SỬ DỤNG',ai:1});n++});log('Nhập dữ liệu','standards','',0,0,'AI '+n);save();toast(`Đã thêm ${n}, bỏ qua ${sk} (trùng/thiếu mã)`);go('standards')}
function aiCL(){D('checklists').push({id:uid(),status:'DRAFT',upd:today(),name:'Checklist AI – '+today(),items:AIT.trim(),ai:1});save();toast('Đã lưu');go('checklists')}
window.onbeforeunload=null;load();apply();go('dash');
</script></body></html>
