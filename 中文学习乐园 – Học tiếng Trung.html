:root{--bg:#faf6ee;--card:#fff;--tx:#2b2522;--mu:#7a6f66;--pr:#a6262b;--pr2:#fbe9e7;--ac:#1f7a6d;--bd:#e6dccb;--ok:#1f7a45;--no:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#1b1715;--card:#26201d;--tx:#f1e9df;--mu:#a99d92;--pr:#e0646a;--pr2:#3a2422;--ac:#4fb8a8;--bd:#3b322d;--ok:#5fcf8a;--no:#f08b84}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
header{background:var(--pr);color:#fff;padding:12px 16px}header h1{margin:0;font-size:20px}header small{opacity:.9}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:none;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:7px 12px;border-radius:20px;cursor:pointer;font-size:14px}
nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{max-width:820px;margin:0 auto;padding:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.st{text-align:center}.st b{display:block;font-size:26px;color:var(--pr)}.st span{color:var(--mu);font-size:13px}
button.b{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:15px}
button.b.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button.b.ok{background:var(--ok)}button.b.no{background:var(--no)}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0}
.hz{font-size:44px;line-height:1.2}.py{color:var(--ac);font-size:18px}.mu{color:var(--mu);font-size:14px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;cursor:pointer;font-size:16px}
.opt.r{border-color:var(--ok);background:var(--pr2)}.opt.w{border-color:var(--no)}
.fc{min-height:170px;text-align:center;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--bd);padding:6px;text-align:center}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.tag{display:inline-block;background:var(--pr2);color:var(--pr);border-radius:10px;padding:1px 8px;font-size:12px}
.wrap{overflow-x:auto}
</style></head><body>

 `</table></div><p class="mu">Thanh nhẹ: đọc nhẹ và ngắn, ví dụ 妈妈 (mā ma). 🔊 dùng giọng tổng hợp của thiết bị nếu có.</p></div>`;
 if(!ST.pq){ST.pq=shuf(TONES).slice(0,4).map(t=>({t,o:shuf(TONES.map(x=>x[0])),a:null}));ST.pi=0;ST.ps=0}

 h+=`<div class="c"><h3>Luyện chọn thanh điệu (${ST.pi+1}/4)</h3><div class="hz">${q.t[1]}</div><p><button class="b s" onclick="say('${q.t[1]}')">🔊 Nghe</button></p>`+
 q.o.map(o=>`<button class="opt ${q.a?(o===q.t[0]?"r":o===q.a?"w":""):""}" ${q.a?"disabled":""} onclick="pAns('${o}')">${o}</button>`).join("")+
 (q.a?`<p>${q.a===q.t[0]?"✅ Đúng":"❌ Sai"} – ${q.t[0]}: ${q.t[3]}</p><button class="b" onclick="ST.pi++;render()">Tiếp</button>`:"")+`</div>`;return h};

function addAll(){allV().filter(w=>!S.cards[w[0]]).slice(0,10).forEach(w=>S.cards[w[0]]={box:0,next:today(),ok:0,ng:0,last:null});ST={};save();render()}
function rate(id,ok){const c=S.cards[id];c.last=today();if(ok){c.ok++;c.box=Math.min(5,c.box+1)}else{c.ng++;c.box=0}
 const d=new Date();d.setDate(d.getDate()+INT[c.box]);c.next=ymd(d);
 ST.q.shift();if(!ok&&INT[c.box]===0)ST.q.push(id);ST.fl=false;mark();render()}

R.quiz=()=>{
 const pool=allV();if(pool.length<4)return `<div class="c">Cần ít nhất 4 từ.</div>`;
 if(!ST.qs){return `<div class="c"><h3>Bài kiểm tra từ vựng</h3><select id="qt"><option value="mix">Hỗn hợp</option><option value="hv">Hán → nghĩa</option><option value="vh">Nghĩa → Hán</option><option value="ph">Pinyin → Hán</option></select>

 if(ST.qi>=ST.qs.length){const sc=ST.qs.filter(q=>q.a===q.c).length;
  return `<div class="c"><h3>Kết quả: ${sc}/${ST.qs.length}</h3><p>Sai: ${ST.qs.filter(q=>q.a&&q.a!==q.c).length} · Bỏ trống: ${ST.qs.filter(q=>!q.a).length}</p>`+
  ST.qs.filter(q=>q.a!==q.c).map(q=>`<p>❌ ${esc(q.p)} → <b>${esc(q.c)}</b> (bạn chọn: ${esc(q.a||"—")})</p>`).join("")+`<button class="b" onclick="ST={};render()">Làm lại</button></div>`}
 const q=ST.qs[ST.qi];
 return `<div class="c"><p class="mu">Câu ${ST.qi+1}/${ST.qs.length}</p><div class="hz" style="font-size:34px">${esc(q.p)}</div>`+
 q.o.map(o=>`<button class="opt ${q.a?(o===q.c?"r":o===q.a?"w":""):""}" ${q.a?"disabled":""} onclick="qAns('${esc(o).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join("")+
 (q.a?`<button class="b" onclick="ST.qi++;render()">${ST.qi+1<ST.qs.length?"Câu tiếp":"Xem kết quả"}</button>`:"")+`</div>`};
function startQ(){const t=document.getElementById("qt").value,src=document.getElementById("qs").value;
 let pool=allV();let base=src==="wrong"?pool.filter(w=>S.wrong[w[0]]):pool;if(!base.length){alert("Chưa có câu sai nào để ôn.");return}
 ST.qs=shuf(base).slice(0,10).map(w=>{const ty=t==="mix"?["hv","vh","ph"][Math.floor(Math.random()*3)]:t;
  const ds=shuf(pool.filter(x=>x[0]!==w[0])).slice(0,3);let p,c,o;
  if(ty==="hv"){p=hzOf(w);c=w[3];o=ds.map(d=>d[3])}else if(ty==="vh"){p=w[3];c=hzOf(w);o=ds.map(d=>hzOf(d))}else{p=w[2];c=hzOf(w);o=ds.map(d=>hzOf(d))}
  return{id:w[0],p,c,o:shuf([c,...o]),a:null}});ST.qi=0;ST.t0=Date.now();render()}
function qAns(o){const q=ST.qs[ST.qi];q.a=o;if(o===q.c){delete S.wrong[q.id];if(S.cards[q.id])S.cards[q.id].ok++}else{S.wrong[q.id]=(S.wrong[q.id]||0)+1;if(S.cards[q.id])S.cards[q.id].ng++}
 if(ST.qi===ST.qs.length-1){S.hist.push({d:today(),s:ST.qs.filter(x=>x.a===x.c).length+(o===q.c?0:0),n:ST.qs.length})}
 mark();render()}

const WP=[["Viết tin nhắn mời bạn uống trà (2–3 câu).","请喝茶。你喝茶吗?"],["Giới thiệu bản thân (3–4 câu): tên, quốc tịch, nghề nghiệp.","你好,我叫小兰。我是越南人。我是学生。"]];
function sInit(){ST.sh=shuf(SE[ST.si][0].map((_,i)=>i));ST.sp=[];ST.sr=null}
function sPick(k){ST.sp.push(k);ST.sr=null;render()}
function sCheck(){const t=SE[ST.si][0];if(ST.sp.length<t.length){alert("Hãy ghép đủ các từ.");return}ST.sr=ST.sp.map(k=>t[k]).join("")===t.join("")?1:0;mark();render()}
function tCheck(){const v=document.getElementById("ti").value.trim(),w=allV()[ST.ti];if(!v)return;ST.tr=(v===w[1]||v===w[5])?1:0;mark();render()}
async function aiFb(){const v=(document.getElementById("wt").value||"").trim();if(!v){alert("Hãy viết bài trước.");return}if(!AI||ST.fbz)return;ST.fbz=1;ST.fb="";ST.wv=v;render();
 const prm=`Bạn là giáo viên tiếng Trung. Hãy nhận xét bài viết của học viên (trình độ sơ cấp) bằng tiếng Việt, văn bản thuần, không markdown. Phân biệt rõ từng nhóm: lỗi chữ Hán; lỗi từ vựng; lỗi ngữ pháp; lỗi diễn đạt (khác biệt văn phong không phải lỗi). Sau đó đưa gợi ý sửa câu, GIỮ NGUYÊN ý định ban đầu của học viên. Nếu bài đã đúng, hãy nói rõ. Không bịa nguồn.\nĐề bài: ${WP[ST.wp||0][0]}\nBài viết của học viên: ${v}`;
 try{const r=await AI(prm,{cache:false});ST.fb=r.text}catch(e){ST.fb="Không gọi được AI lúc này."}ST.fbz=0;render()}
R.write=()=>{ensureQ();ST.si=ST.si||0;if(!ST.sh)sInit();const t=SE[ST.si][0],pk=ST.sp,w0=allV();if(ST.ti==null)ST.ti=Math.floor(Math.random()*w0.length);const w=w0[ST.ti],wp=ST.wp||0;
 let h=`<div class="c"><h3>1. Sắp xếp từ thành câu</h3><p class="mu">${esc(SE[ST.si][1])}</p><p style="font-size:24px;min-height:36px">${pk.map(k=>t[k]).join(" ")||"…"}</p><p>`+ST.sh.filter(k=>!pk.includes(k)).map(k=>`<button class="b s" style="font-size:20px;margin:2px" onclick="sPick(${k})">${t[k]}</button>`).join("")+`</p><button class="b s" onclick="ST.sp=[];ST.sr=null;render()">Xóa</button> <button class="b" onclick="sCheck()">Kiểm tra</button> <button class="b s" onclick="ST.si=(ST.si+1)%SE.length;sInit();render()">Câu khác</button>`+(ST.sr!=null?`<p>${ST.sr?"✅ Đúng":"❌ Chưa khớp đáp án mẫu: <b>"+t.join("")+"</b>"}</p><p class="mu">Có thể có cách sắp xếp đúng khác; kết quả được so với đáp án mẫu.</p>`:"")+`</div>`;
 h+=`<div class="c"><h3>2. Viết chữ Hán từ nghĩa</h3><p>${esc(w[3])} <span class="py">${esc(w[2])}</span></p><input id="ti" placeholder="Gõ chữ Hán" ${ST.tr!=null?"disabled":""}><button class="b" onclick="tCheck()">Kiểm tra</button> <button class="b s" onclick="ST.ti=Math.floor(Math.random()*allV().length);ST.tr=null;render()">Từ khác</button>`+(ST.tr!=null?`<p>${ST.tr?"✅ Đúng":"❌ Đáp án: <b>"+esc(hzOf(w))+"</b>"}</p>`:"")+`</div>`;
 h+=`<div class="c"><h3>3. Viết tự do</h3><select onchange="ST.wp=+this.value;ST.fb=\"\";ST.wm=0;render()">${WP.map((x,i)=>`<option value="${i}" ${i===wp?"selected":""}>${esc(x[0])}</option>`).join("")}</select><textarea id="wt" rows="4" placeholder="Viết bằng tiếng Trung…">${esc(ST.wv||"")}</textarea>`+
 (AI?`<button class="b" onclick="aiFb()">Nhận xét bằng AI</button> `:`<span class="mu">${AI===undefined?"Đang kiểm tra AI…":"AI không khả dụng: hãy tự đối chiếu với bài mẫu."}</span> `)+`<button class="b s" onclick="ST.wv=document.getElementById('wt').value;ST.wm=!ST.wm;render()">${ST.wm?"Ẩn":"Xem"} bài mẫu</button>`+(ST.wm?`<p>${WP[wp][1]}</p>`:"")+(ST.fbz?`<p class="mu">AI đang nhận xét…</p>`:"")+(ST.fb?`<div class="c" style="background:var(--pr2)">${esc(ST.fb).replace(/\n/g,"<br>")}</div><p class="mu">Nhận xét do AI tạo, có thể sai; hãy đối chiếu khi cần.</p>`:"")+`</div>`;
 h+=`<div class="c"><h3>4. Chép chữ Hán</h3><p class="mu">Vào mục Chữ Hán, chọn chữ và luyện viết trên khung (tự đối chiếu).</p><button class="b s" onclick="go('hanzi')">Mở Chữ Hán</button></div>`;return h};
function vq(q,sk){if(!q||typeof q.q!=="string"||!q.q.trim())return["Thiếu nội dung câu hỏi"];const e=[];
 if(!Array.isArray(q.o)||q.o.length<2||q.o.length>4)e.push("Cần 2–4 lựa chọn");else{if(new Set(q.o.map(x=>String(x).trim())).size!==q.o.length)e.push("Lựa chọn bị trùng");if(!Number.isInteger(q.a)||q.a<0||q.a>=q.o.length)e.push("Đáp án đúng không hợp lệ")}
 if(sk==="Nghe"&&!q.tts)e.push("Thiếu văn bản tiếng Trung để đọc");if(!q.ex)e.push("Thiếu giải thích");if(S.qb.some(x=>x.q===q.q))e.push("Trùng nội dung với câu đã có");return e}
async function genGo(){const g=i=>document.getElementById(i).value.trim(),sk=g("gk"),lv=g("gl")||"HSK 1",tp=g("gt")||"chào hỏi",n=Math.min(10,Math.max(1,parseInt(g("gn"))||5));
 if(!AI||ST.gb)return;ST.gb=1;ST.ge=null;render();
 const prm=`Tạo ${n} câu hỏi trắc nghiệm tiếng Trung (chữ giản thể) cho ứng dụng học tập. Kỹ năng: ${sk}. Cấp độ: ${lv}. Chủ đề: ${tp}. Quy tắc: mỗi câu có đúng một đáp án đúng rõ ràng, 3 lựa chọn, không vượt cấp độ, câu tự nhiên; Pinyin (nếu dùng) phải khớp chữ Hán; phần giải thích viết bằng tiếng Việt và nêu Pinyin cùng nghĩa. Với kỹ năng "Nghe", thêm trường "tts" chứa câu tiếng Trung sẽ được đọc lên và KHÔNG ghi nội dung đó trong câu hỏi. Trả về DUY NHẤT một mảng JSON, không markdown, mỗi phần tử dạng {"q":"...","o":["...","...","..."],"a":0,"ex":"...","tts":"(chỉ cho kỹ năng Nghe)"}; "a" là chỉ số (từ 0) của đáp án đúng trong "o". Đặt đáp án đúng ở các vị trí khác nhau.`;
 try{const r=await AI(prm,{cache:false}),t=r.text||"",a=t.indexOf("["),b=t.lastIndexOf("]"),arr=JSON.parse(t.slice(a,b+1));if(!Array.isArray(arr))throw 0;
  arr.slice(0,n).forEach(q=>{const x={id:"ai"+Date.now()+Math.random().toString(36).slice(2,6),skill:sk,lv,q:q&&q.q,o:q&&q.o,a:q&&q.a,ex:q&&q.ex,tts:(q&&q.tts?cl(q.tts):undefined),st:"Draft",src:"AI"};x.err=vq(q,sk);S.ad.push(x)});save()}
 catch(e){ST.ge="Không đọc được kết quả từ AI hoặc không gọi được AI. Hãy thử lại."}ST.gb=0;render()}
function genOk(id){const i=S.ad.findIndex(x=>x.id===id);if(i<0)return;const x=S.ad[i];if(x.err.length||S.qb.some(y=>y.q===x.q))return;delete x.err;S.qb.push(x);S.ad.splice(i,1);save();render()}
function genNo(id){S.ad=S.ad.filter(x=>x.id!==id);save();render()}
function genAll(){const ok=S.ad.filter(x=>!x.err.length&&!S.qb.some(y=>y.q===x.q));ok.forEach(x=>{delete x.err;S.qb.push(x)});S.ad=S.ad.filter(x=>!ok.includes(x));save();render()}
R.gen=()=>{ensureQ();
 let h=`<div class="c"><h3>AI Question Generator</h3><p class="mu">Quy trình: AI tạo → Draft → kiểm tra dữ liệu tự động → bạn duyệt → vào Ngân hàng ở trạng thái Draft → đổi sang Published trong mục Ngân hàng. Không có câu nào tự động được xuất bản. AI có thể sai Pinyin, nghĩa hoặc độ khó, nên cần kiểm tra trước khi Published.</p>`;
 if(AI===undefined)h+=`<p>Đang kiểm tra dịch vụ AI…</p>`;else if(!AI)h+=`<p>🔒 Dịch vụ AI không khả dụng cho lượt xem này. Bạn vẫn có thể thêm câu thủ công trong Ngân hàng.</p>`;
 else h+=`<label class="mu">Kỹ năng</label><select id="gk">${SK.map(x=>`<option>${x}</option>`).join("")}</select><label class="mu">Cấp độ</label><input id="gl" value="HSK 1"><label class="mu">Chủ đề</label><input id="gt" value="chào hỏi"><label class="mu">Số câu (tối đa 10)</label><input id="gn" type="number" value="5" min="1" max="10"><button class="b" ${ST.gb?"disabled":""} onclick="genGo()">${ST.gb?"Đang tạo…":"Tạo bản nháp"}</button>`+(ST.ge?`<p style="color:var(--no)">${ST.ge}</p>`:"");
 h+=`</div>`;if(!S.ad.length)return h+`<div class="c mu">Chưa có bản nháp AI.</div>`;
 return h+`<div class="c"><b>${S.ad.length} bản nháp chờ duyệt</b> <button class="b s" onclick="genAll()">Duyệt tất cả câu hợp lệ</button></div>`+S.ad.map(x=>{const ok=!x.err.length&&!S.qb.some(y=>y.q===x.q);return `<div class="c"><span class="tag">${esc(x.skill)}</span> <span class="tag">${esc(x.lv)}</span><p>${esc(x.q||"(trống)")}${x.tts?` <button class="b s" onclick="say('${esc(x.tts)}')">🔊</button>`:""}</p>${Array.isArray(x.o)?`<p class="mu">${x.o.map((o,i)=>(i===x.a?"✔ ":"")+esc(o)).join(" · ")}</p>`:""}<p class="mu">${esc(x.ex||"")}</p>${x.err.length?`<p style="color:var(--no)">⚠ ${x.err.map(esc).join("; ")}</p>`:`<p style="color:var(--ok)">✔ Qua kiểm tra dữ liệu (chưa xác minh nội dung)</p>`}${ok?`<button class="b ok" onclick="genOk('${x.id}')">Duyệt vào Ngân hàng</button> `:""}<button class="b s" onclick="genNo('${x.id}')">Bỏ</button></div>`}).join("")};
async function dlOffline(){try{const d=window.claude?await claude.use("downloads"):null;if(!d){alert("Tải xuống không khả dụng trong lượt xem này.");return}
