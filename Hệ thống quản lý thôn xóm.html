<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hệ thống quản lý thôn xóm</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ee;--sf:#fff;--ink:#1c2a33;--mut:#5d6b73;--ln:#d5ddd8;--pri:#2b6a4a;--pri2:#e1efe6;--acc:#b8862b;--err:#b3261e;--side:#1f3a2f;--sideink:#dbe8df;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b18;--sf:#1d2722;--ink:#e6eee9;--mut:#9aaba2;--ln:#33423a;--pri:#5fb58a;--pri2:#24372d;--acc:#d9a94a;--err:#ff8a80;--side:#0e1512}}
:root[data-theme="dark"]{--bg:#141b18;--sf:#1d2722;--ink:#e6eee9;--mut:#9aaba2;--ln:#33423a;--pri:#5fb58a;--pri2:#24372d;--acc:#d9a94a;--err:#ff8a80;--side:#0e1512}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
nav{width:218px;background:var(--side);color:var(--sideink);padding:16px 10px;flex:none;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:15px;margin:4px 8px 14px;line-height:1.3;font-weight:700}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 10px;border-radius:6px;cursor:pointer}
nav button:hover{background:#ffffff14}nav button.on{background:var(--pri);color:#fff;font-weight:600}
nav small{display:block;margin:12px 8px 4px;opacity:.6;font-size:12px}
main{flex:1;min-width:0;padding:20px 24px 40px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.top h2{margin:0;font-size:22px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar input,.bar select,.f input,.f select,.f textarea{padding:8px 10px;border:1px solid var(--ln);border-radius:6px;background:var(--sf)}
.bar input[type=search]{flex:1;min-width:180px}
.btn{padding:8px 14px;border-radius:6px;border:1px solid var(--pri);background:var(--pri);color:#fff;cursor:pointer;font-weight:500}
.btn.sec{background:var(--sf);color:var(--pri)}.btn.dng{background:var(--sf);color:var(--err);border-color:var(--err)}
.btn.sm{padding:3px 9px;font-size:13px}.btn:focus-visible,nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--pri);border-radius:6px;padding:12px 14px;text-align:left;cursor:pointer}
.stat b{display:block;font-size:26px;line-height:1.2}.stat span{color:var(--mut);font-size:13px}
.stat.w{border-left-color:var(--acc)}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:15px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.row i{flex:0 0 110px;font-style:normal;color:var(--mut)}
.row u{display:block;height:14px;background:var(--pri);border-radius:3px;min-width:2px}.row span{flex:none}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:640px}th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--ln);vertical-align:top}
th{background:var(--pri2);font-weight:600;white-space:nowrap}tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--pri2);font-size:12px}.tag.x{background:#f5e2c4;color:#6b4a0b}
.empty{padding:28px;text-align:center;color:var(--mut)}
.pg{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--mut)}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:9}
.md{background:var(--sf);border-radius:8px;width:100%;max-width:560px;padding:18px}
.md h3{margin:0 0 12px}.f label{display:block;margin:0 0 10px;font-size:13px;color:var(--mut)}.f input,.f select,.f textarea{display:block;width:100%;margin-top:3px;color:var(--ink)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.warn{background:#f5e2c4;color:#4d3604;padding:8px 10px;border-radius:6px;margin-bottom:10px;font-size:13px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:20;display:none}
.note{color:var(--mut);font-size:13px}.rh{text-align:center;margin-bottom:10px}.num{text-align:right;white-space:nowrap}tr.tot td{font-weight:600;background:var(--pri2)}.sig{display:flex;justify-content:space-around;margin-top:28px;text-align:center}.cx{text-decoration:line-through;opacity:.6}
@media(max-width:820px){#app{display:block}nav{width:auto;height:auto;position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;padding:8px;align-items:center}
nav h1,nav small{display:none}nav button{white-space:nowrap;width:auto;padding:8px 12px}main{padding:14px 12px 40px}}
@media print{nav,.bar,.acts,.btn,.pg{display:none!important}main{padding:0}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script>
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?d.split('-').reverse().join('/'):'';
let S={ver:1,village:'Thôn của bạn',seq:{h:0,p:0,e:0,a:0},areas:[],hh:[],ps:[],ms:[],ev:[],log:[]};
let ui={v:'home',q:'',a:'',s:'',g:'',pg:1,evt:''};
let mem=false;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('vmp',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('s').objectStore('s').get('state');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(x){mem=true;return null}}
async function save(){if(mem)return;try{const d=await idb();d.transaction('s','readwrite').objectStore('s').put(JSON.stringify(S),'state')}catch(x){mem=true;toast('Trình duyệt không cho lưu dữ liệu. Hãy xuất bản sao lưu thường xuyên.')}}
function toast(t){const o=$('#toast');o.textContent=t;o.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>o.style.display='none',3200)}
const L=(a,t)=>{S.log.unshift({t:new Date().toISOString(),a,x:t});S.log=S.log.slice(0,800)};
const nid=(k,p)=>p+'-'+String(++S.seq[k]).padStart(4,'0');
const age=d=>{if(!d)return null;const b=new Date(d),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const grp=a=>a==null?'Chưa rõ tuổi':a<=5?'0–5 tuổi':a<=14?'6–14 tuổi':a<=17?'15–17 tuổi':a<=59?'18–59 tuổi':'60 tuổi trở lên';
const GR=['0–5 tuổi','6–14 tuổi','15–17 tuổi','18–59 tuổi','60 tuổi trở lên','Chưa rõ tuổi'];
const cur=p=>S.ms.find(m=>m.p===p&&!m.to);
const hh=id=>S.hh.find(h=>h.id===id), ps=id=>S.ps.find(p=>p.id===id), ar=id=>S.areas.find(a=>a.id===id);
const members=h=>S.ps.filter(p=>p.st==='Đang quản lý'&&cur(p.id)?.h===h);
const head=h=>{const m=S.ms.find(m=>m.h===h&&!m.to&&m.rel==='Chủ hộ');return m?ps(m.p):null};
const hname=h=>{const x=hh(h);return x?(x.id+' – '+x.rep):'—'};

/* ---------- Giao diện chung ---------- */
const NAV=[['home','Tổng quan'],['hh','Hộ gia đình'],['ps','Nhân khẩu'],['ev','Biến động dân cư'],['im','Nhập dữ liệu'],['ar','Tổ/xóm'],['tc','Thu – chi'],['tk','Công việc'],['mt','Họp dân, thông báo'],['rp','Báo cáo'],['log','Nhật ký'],['bk','Sao lưu & cài đặt']];
function drawNav(){$('#nav').innerHTML='<h1>'+e(S.village)+'<br><small style="font-weight:400;opacity:.7">Quản lý hộ và nhân khẩu</small></h1>'+NAV.map(([k,t])=>`<button data-v="${k}" class="${ui.v===k?'on':''}">${t}</button>`).join('')+'<small>Chính sách, an sinh và tài liệu đính kèm sẽ có ở giai đoạn sau.</small>'}
$('#nav').onclick=x=>{const v=x.target.dataset.v;if(v)go(v)};
function go(v,o={}){ui={v,q:'',a:'',s:'',g:'',pg:1,evt:'',...o};draw()}
function draw(){drawNav();const m=$('#main');({home,hh:vHH,ps:vPS,ev:vEV,ar:vAR,log:vLOG,bk:vBK,im:vIM,tc:vTC,rp:vRP,tk:vTK,mt:vMT})[ui.v](m);scrollTo(0,0)}
function modal(html,wire){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="md" role="dialog" aria-modal="true">'+html+'</div>';document.body.appendChild(o);
o.onclick=x=>{if(x.target===o||x.target.dataset.close!==undefined)o.remove()};wire&&wire(o);const f=o.querySelector('input,select,textarea');f&&f.focus();return o}
function form(title,fields,vals,ok,extra=''){const h=`<h3>${title}</h3><form class="f">${extra}${fields.map(f=>{const v=vals[f.k]??'';
const inp=f.t==='select'?`<select name="${f.k}" ${f.r?'required':''}>${f.o.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return `<option value="${e(a)}" ${a==v?'selected':''}>${e(b)}</option>`}).join('')}</select>`:f.t==='area'?`<textarea name="${f.k}" rows="2">${e(v)}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}" value="${e(v)}" ${f.r?'required':''}>`;
return `<label>${f.l}${f.r?' *':''}${inp}</label>`}).join('')}<div class="acts"><button type="button" class="btn sec" data-close>Hủy</button><button class="btn">Lưu</button></div></form>`;
modal(h,o=>{o.querySelector('form').onsubmit=x=>{x.preventDefault();const d=Object.fromEntries(new FormData(x.target));for(const k in d)d[k]=d[k].trim();if(ok(d)!==false)o.remove()}})}
function pager(list,fn){const n=Math.max(1,Math.ceil(list.length/10));if(ui.pg>n)ui.pg=n;const s=list.slice((ui.pg-1)*10,ui.pg*10);
return{rows:s,html:`<div class="pg"><span>${list.length} bản ghi</span><button class="btn sec sm" ${ui.pg<=1?'disabled':''} onclick="ui.pg--;draw()">Trước</button><span>${ui.pg}/${n}</span><button class="btn sec sm" ${ui.pg>=n?'disabled':''} onclick="ui.pg++;draw()">Sau</button></div>`}}
function bind(m){m.querySelectorAll('[data-f]').forEach(i=>i.oninput=i.onchange=()=>{ui[i.dataset.f]=i.value;ui.pg=1;const p=i.selectionStart;draw();const n=$('[data-f="'+i.dataset.f+'"]');if(n&&n.type==='search'){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}})}
const areaOpts=(all)=>[...(all?[['','Tất cả tổ/xóm']]:[['','— Chọn —']]),...S.areas.filter(a=>a.on||all).map(a=>[a.id,a.name])];

/* ---------- Tổng quan ---------- */
function bars(o,total){const mx=Math.max(1,...Object.values(o));const ks=Object.keys(o);return ks.length?ks.map(k=>`<div class="row"><i>${e(k)}</i><u style="width:${Math.round(o[k]/mx*100)}%"></u><span>${o[k]}</span></div>`).join(''):'<div class="note">Chưa có dữ liệu.</div>'}
function home(m){const H=S.hh.filter(h=>h.st==='Đang quản lý'),P=S.ps.filter(p=>p.st==='Đang quản lý');const ym=today().slice(0,7);
const evm=S.ev.filter(x=>x.d.startsWith(ym)).length;const rv=H.filter(h=>!head(h.id)||!members(h.id).length);const noA=P.filter(p=>!p.dob).length;
const byA={};H.forEach(h=>{const n=ar(h.a)?.name||'Chưa gán tổ/xóm';byA[n]=(byA[n]||0)+1});
const byG={};P.forEach(p=>{const g=grp(age(p.dob));byG[g]=(byG[g]||0)+1});const og={};GR.forEach(g=>byG[g]&&(og[g]=byG[g]));
const mo={};S.ev.forEach(x=>{const k=x.d.slice(0,7);mo[k]=(mo[k]||0)+1});const om={};Object.keys(mo).sort().slice(-6).forEach(k=>om[k.split('-').reverse().join('/')]=mo[k]);
m.innerHTML=`<div class="top"><h2>Tổng quan – ${e(S.village)}</h2><span class="note">Số liệu lấy trực tiếp từ dữ liệu đã nhập. Chốt lúc ${new Date().toLocaleString('vi-VN')}</span></div>
${!S.hh.length?'<div class="panel"><b>Bắt đầu từ đâu?</b><ol><li>Vào <b>Tổ/xóm</b> để tạo địa bàn (hoặc bỏ qua nếu thôn không chia tổ).</li><li>Vào <b>Hộ gia đình</b> để thêm hộ.</li><li>Vào <b>Nhân khẩu</b> để thêm người và gắn vào hộ.</li></ol><span class="note">Dữ liệu lưu trong trình duyệt của máy này. Hãy xuất bản sao lưu ở mục Sao lưu & cài đặt.</span></div>':''}
<div class="grid"><button class="stat" onclick="go('hh')"><b>${H.length}</b><span>Hộ đang quản lý</span></button><button class="stat" onclick="go('ps')"><b>${P.length}</b><span>Nhân khẩu đang quản lý</span></button>
<button class="stat" onclick="go('ev')"><b>${evm}</b><span>Biến động tháng này</span></button><button class="stat w" onclick="go('hh',{s:'rv'})"><b>${rv.length}</b><span>Hộ cần rà soát (thiếu chủ hộ hoặc chưa có thành viên)</span></button>
${S.tx.length?`<button class='stat' onclick="go('tc')"><b>${vnd(bal())}</b><span>Số dư theo giao dịch đã ghi</span></button>`:''}<button class="stat w" onclick="go('ev',{s:'open'})"><b>${S.ev.filter(x=>OPEN.includes(x.st)).length}</b><span>Phiếu biến động chờ xử lý</span></button><button class='stat w' onclick="go('tk',{s:'Quá hạn'})"><b>${S.tk.filter(t=>tkSt(t)==='Quá hạn').length}</b><span>Công việc quá hạn</span></button><button class='stat' onclick="go('mt')"><b>${S.mt.filter(x=>x.st==='Dự kiến'&&x.d>=today()).length}</b><span>Cuộc họp sắp tới</span></button><button class="stat w" onclick="go('ps',{s:'nodob'})"><b>${noA}</b><span>Nhân khẩu thiếu ngày sinh</span></button></div>
<div class="two"><div class="panel"><h3>Hộ theo tổ/xóm</h3>${bars(byA)}</div><div class="panel"><h3>Nhân khẩu theo nhóm tuổi</h3>${bars(og)}</div></div>
<div class="panel"><h3>Biến động theo tháng (6 tháng gần nhất)</h3>${bars(om)}</div>`}

/* ---------- Hộ gia đình ---------- */
function hhList(){const q=ui.q.toLowerCase();return S.hh.filter(h=>(!ui.a||h.a===ui.a)&&(!ui.s||(ui.s==='rv'?(h.st==='Đang quản lý'&&(!head(h.id)||!members(h.id).length)):h.st===ui.s))&&(!q||(h.id+' '+h.rep+' '+h.addr).toLowerCase().includes(q)))}
function vHH(m){const l=hhList(),p=pager(l);
m.innerHTML=`<div class="top"><h2>Hộ gia đình</h2><button class="btn" id="add">+ Thêm hộ</button></div>
<div class="bar"><input type="search" data-f="q" value="${e(ui.q)}" placeholder="Tìm theo mã hộ, tên chủ hộ, địa chỉ"><select data-f="a">${areaOpts(1).map(([a,b])=>`<option value="${a}" ${ui.a===a?'selected':''}>${e(b)}</option>`).join('')}</select>
<select data-f="s">${[['','Mọi trạng thái'],['Đang quản lý','Đang quản lý'],['Ngừng quản lý','Ngừng quản lý'],['rv','Cần rà soát']].map(([a,b])=>`<option value="${a}" ${ui.s===a?'selected':''}>${b}</option>`).join('')}</select>
<button class="btn sec" id="csv">Xuất CSV</button><button class="btn sec" onclick="print()">In</button></div>
<div class="tw"><table><tr><th>Mã hộ</th><th>Chủ hộ / đại diện</th><th>Địa chỉ</th><th>Tổ/xóm</th><th>Nhân khẩu</th><th>Trạng thái</th><th>Cập nhật</th><th></th></tr>
${p.rows.map(h=>`<tr><td>${h.id}</td><td>${e(h.rep)}</td><td>${e(h.addr)}</td><td>${e(ar(h.a)?.name||'')}</td><td>${members(h.id).length}</td><td><span class="tag ${h.st!=='Đang quản lý'?'x':''}">${h.st}</span></td><td>${fmt(h.upd)}</td><td><button class="btn sec sm" onclick="hhView('${h.id}')">Xem</button></td></tr>`).join('')||`<tr><td colspan="8" class="empty">${S.hh.length?'Không có hộ nào khớp bộ lọc.':'Chưa có hộ nào. Chọn “Thêm hộ” để bắt đầu.'}</td></tr>`}</table></div>${p.html}`;
bind(m);$('#add').onclick=()=>hhForm();$('#csv').onclick=()=>csv('ho-gia-dinh',['Mã hộ','Chủ hộ','Địa chỉ','Tổ/xóm','SĐT','Số nhân khẩu','Trạng thái'],l.map(h=>[h.id,h.rep,h.addr,ar(h.a)?.name||'',h.tel,members(h.id).length,h.st]))}
function hhForm(id){const h=id?hh(id):{};form(id?'Sửa hộ '+id:'Thêm hộ gia đình',[{k:'rep',l:'Tên chủ hộ / người đại diện',r:1},{k:'addr',l:'Địa chỉ cụ thể',r:1},{k:'a',l:'Tổ/xóm',t:'select',o:areaOpts()},{k:'tel',l:'Số điện thoại liên hệ (nếu được phép lưu)'},{k:'note',l:'Ghi chú nghiệp vụ',t:'area'}],h,d=>{
if(!id){const dup=S.hh.find(x=>x.rep.toLowerCase()===d.rep.toLowerCase()&&x.addr.toLowerCase()===d.addr.toLowerCase());if(dup&&!confirm('Đã có hộ '+dup.id+' cùng tên chủ hộ và địa chỉ. Vẫn tạo hộ mới?'))return false;
const n={id:nid('h','HO'),...d,st:'Đang quản lý',cr:today(),upd:today(),hist:[{d:today(),t:'Tạo hồ sơ hộ'}]};S.hh.push(n);L('Thêm hộ',n.id+' – '+n.rep)}
else{const o={...h};const ch=[];['rep','addr','a','tel','note'].forEach(k=>{if(o[k]!==d[k])ch.push(k==='a'?'Tổ/xóm: '+(ar(o.a)?.name||'—')+' → '+(ar(d.a)?.name||'—'):({rep:'Đại diện',addr:'Địa chỉ',tel:'SĐT',note:'Ghi chú'})[k]+': '+(o[k]||'—')+' → '+(d[k]||'—'))});
const adr=o.addr!==d.addr||o.a!==d.a;window._adr=adr;const nx=ch.filter(x=>!/^(Địa chỉ|Tổ\/xóm)/.test(x));if(adr){addEv('Thay đổi địa chỉ',null,id,'Đề nghị: '+d.addr+(d.a?' · '+(ar(d.a)?.name||''):'')+' (hiện tại: '+o.addr+')',today(),'Mới tiếp nhận',{hid:id,addr:d.addr,a:d.a});d.addr=o.addr;d.a=o.a}Object.assign(h,d,{upd:today()});if(nx.length){h.hist.unshift({d:today(),t:nx.join('; ')});L('Sửa hộ',id)}}

o.querySelector('#ed').onclick=()=>{o.remove();mtForm(id)};o.querySelector('#tk').onclick=()=>{o.remove();tkForm(null,{mt:id,txt:x.concl||'',place:x.place||''})};
o.querySelector('#dl').onclick=()=>{if(!confirm('Xóa cuộc họp này? Công việc đã tạo vẫn được giữ lại.'))return;S.mt=S.mt.filter(v=>v.id!==id);L('Xóa cuộc họp',id);save();o.remove();draw()}})}
function anForm(id){const x=id?anf(id):{};form(id?'Sửa thông báo '+id:'Soạn thông báo',[{k:'title',l:'Tiêu đề',r:1},{k:'body',l:'Nội dung *',t:'area'},{k:'aud',l:'Đối tượng',t:'select',o:[['','Toàn thôn'],...S.areas.filter(a=>a.on).map(a=>[a.id,a.name])]}],x,d=>{if(!d.body){toast('Hãy nhập nội dung thông báo.');return false}if(id)Object.assign(x,d);else S.an.push({id:nid('n','TB'),...d,d:today(),st:'Nháp',by:S.user||''});L(id?'Sửa thông báo':'Soạn thông báo',d.title);save();draw()})}
function anView(id){const x=anf(id);modal(`<h3>${x.id} – ${e(x.title)}</h3><span class='tag ${x.st==='Nháp'?'x':''}'>${x.st}</span> <span class='note'>${fmt(x.d)}</span><div style='white-space:pre-wrap;margin:10px 0'>${e(x.body)}</div><div class='acts'><button class='btn sec' data-close>Đóng</button>${x.st==='Nháp'?`<button class='btn dng' id='dl'>Xóa</button><button class='btn sec' id='ed'>Sửa</button><button class='btn' id='pb'>Phát hành</button>`:''}<button class='btn sec' id='pr'>In</button></div>`,o=>{
const g=s=>o.querySelector(s);if(g('#ed'))g('#ed').onclick=()=>{o.remove();anForm(id)};if(g('#dl'))g('#dl').onclick=()=>{if(!confirm('Xóa bản nháp này?'))return;S.an=S.an.filter(v=>v.id!==id);L('Xóa thông báo',id);save();o.remove();draw()};
if(g('#pb'))g('#pb').onclick=()=>{if(!confirm('Phát hành thông báo này? Sau đó không sửa được. Hệ thống không tự gửi SMS hay email.'))return;x.st='Đã phát hành';x.d=today();L('Phát hành thông báo',id);save();o.remove();draw()};
g('#pr').onclick=()=>printDoc(`<p class='c'><b>${e(S.village.toUpperCase())}</b></p><h2>THÔNG BÁO</h2><p class='c'><b>${e(x.title)}</b></p><div style='white-space:pre-wrap'>${e(x.body)}</div><p style='text-align:right;margin-top:30px'>Ngày ${fmt(x.d)}<br><b>Trưởng thôn</b></p>`)})}
/* ---------- Xuất PDF và .docx chuẩn ---------- */
function dlb(n,b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function pdf(R,name){if(!window.pdfMake){toast('Không tải được thư viện PDF. Kiểm tra kết nối mạng.');return}
const c=v=>typeof v==='number'?v.toLocaleString('vi-VN'):String(v??''),al=v=>typeof v==='number'?'right':'left';
const body=[R.hd.map(h=>({text:h,bold:true,fillColor:'#e8e8e8'})),...R.rows.map(r=>R.hd.map((_,i)=>({text:c(r[i]),alignment:al(r[i])}))),...(R.foot||[]).map(r=>R.hd.map((_,i)=>({text:c(r[i]),bold:true,alignment:al(r[i])})))];
const dd={pageSize:'A4',pageOrientation:R.hd.length>6?'landscape':'portrait',pageMargins:[36,40,36,40],defaultStyle:{font:'Roboto',fontSize:10},footer:(p,n)=>({text:p+'/'+n,alignment:'center',fontSize:8}),
content:[{text:S.village.toUpperCase(),bold:true,alignment:'center'},{text:R.title.toUpperCase(),bold:true,alignment:'center',fontSize:13,margin:[0,4,0,2]},{text:R.period+' · '+R.filter,alignment:'center',margin:[0,0,0,10]},
{table:{headerRows:1,widths:R.hd.map(()=>'*'),body}},{text:'Chốt dữ liệu: '+R.at+'. Ngày lập: '+fmt(today()),fontSize:9,margin:[0,8,0,14]},
{columns:[{text:'Người lập\n(Ký, ghi rõ họ tên)\n\n\n'+(S.user||''),alignment:'center'},{text:'Trưởng thôn\n(Ký, ghi rõ họ tên)',alignment:'center'}],unbreakable:true}]};
pdfMake.createPdf(dd).getBlob(b=>{dlb(name+'-'+today()+'.pdf',b);L('Xuất PDF',R.title);save()})}
async function dx(R,name){if(!window.docx){toast('Không tải được thư viện Word. Kiểm tra kết nối mạng.');return}const D=docx;
const c=v=>typeof v==='number'?v.toLocaleString('vi-VN'):String(v??''),tr=(t,o={})=>new D.TextRun({text:t,bold:!!o.b,size:o.s||20});
const cell=(t,o={})=>new D.TableCell({shading:o.sh?{fill:'E8E8E8',type:D.ShadingType.CLEAR,color:'auto'}:undefined,children:[new D.Paragraph({alignment:o.r?D.AlignmentType.RIGHT:D.AlignmentType.LEFT,children:[tr(t,o)]})]});
const row=(r,b)=>new D.TableRow({children:R.hd.map((_,i)=>cell(c(r[i]),{b,r:typeof r[i]==='number'}))});
const P=(t,o={})=>new D.Paragraph({alignment:D.AlignmentType.CENTER,spacing:{after:80},children:[tr(t,{b:o.b,s:o.s||24})]});
const nb={style:D.BorderStyle.NONE,size:0,color:'FFFFFF'},NB={top:nb,bottom:nb,left:nb,right:nb};
const sg=t=>new D.TableCell({borders:NB,children:t.split('\n').map(x=>new D.Paragraph({alignment:D.AlignmentType.CENTER,children:[tr(x,{s:22})]}))});
const doc=new D.Document({styles:{default:{document:{run:{font:'Times New Roman',size:22}}}},sections:[{properties:{page:{size:{orientation:R.hd.length>6?D.PageOrientation.LANDSCAPE:D.PageOrientation.PORTRAIT}}},children:[
P(S.village.toUpperCase(),{b:1}),P(R.title.toUpperCase(),{b:1,s:28}),P(R.period+' · '+R.filter),
new D.Table({width:{size:100,type:D.WidthType.PERCENTAGE},rows:[new D.TableRow({tableHeader:true,children:R.hd.map(h=>cell(h,{b:1,sh:1}))}),...R.rows.map(r=>row(r)),...(R.foot||[]).map(r=>row(r,1))]}),
new D.Paragraph({spacing:{before:160,after:200},children:[tr('Chốt dữ liệu: '+R.at+'. Ngày lập: '+fmt(today()),{s:20})]}),
new D.Table({width:{size:100,type:D.WidthType.PERCENTAGE},borders:D.TableBorders.NONE,rows:[new D.TableRow({children:[sg('Người lập\n(Ký, ghi rõ họ tên)\n\n\n'+(S.user||'')),sg('Trưởng thôn\n(Ký, ghi rõ họ tên)')]})]})]}]});
dlb(name+'-'+today()+'.docx',await D.Packer.toBlob(doc));L('Xuất Word (.docx)',R.title);save()}
(async()=>{const d=await load();if(d){try{S=JSON.parse(d)}catch(x){}}ensure();draw();if(mem)toast('Trình duyệt không cho lưu dữ liệu. Hãy xuất bản sao lưu thường xuyên.')})();
</script>
