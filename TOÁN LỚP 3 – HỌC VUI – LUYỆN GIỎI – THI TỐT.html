/* ---------- học toán ---------- */
V.learn=p=>{ const [tid,lid]=p;
  if(!tid){ const docs=S.docs.filter(d=>d.published); return `${UI.crumbs([['Trang chủ','/'],['Học toán','/learn']])}<h1>📚 Học toán</h1><p class="muted">Chọn một chuyên đề, rồi đọc kiến thức và làm bài luyện nhé.</p><div class="grid g3">${S.content.topics.filter(t=>Pool.topicOn(t.id)).map(t=>`<button class="topic" style="border-left-color:${t.color}" data-go="/learn/${t.id}"><span class="ic">${t.icon}</span><span><b>${esc(t.name)}</b><span class="muted small">${t.lessons.length} bài học</span></span></button>`).join('')}</div>`+(docs.length?`<h2 style="margin-top:20px">📎 Tài liệu của thầy cô</h2>${docs.map(d=>`<details class="card"><summary><b>${esc(d.title)}</b></summary>${d.kind==='image'?`<img alt="${esc(d.title)}" src="${esc(d.data)}" style="max-width:100%">`:`<div style="white-space:pre-wrap">${esc(d.text||'')}</div>`}</details>`).join('')}`:''); }
  const t=UI.topic(tid);
  if(!lid) return `${UI.crumbs([['Trang chủ','/'],['Học toán','/learn'],[t.name,'/learn/'+tid]])}<h1>${t.icon} ${esc(t.name)}</h1><div class="grid g2">${t.lessons.map((l,i)=>`<button class="topic" style="border-left-color:${t.color}" data-go="/learn/${tid}/${l.id}"><span class="ic">${i+1}</span><span><b>${esc(l.name)}</b><span class="muted small">Kiến thức · Ví dụ · Bài luyện</span></span></button>`).join('')}</div><div class="row" style="margin-top:14px"><button class="btn" data-go="/topic/${tid}">⬅ Về chuyên đề</button></div>`;
  const l=UI.lesson(tid,lid); if(!l) return V.notfound(); const idx=t.lessons.findIndex(x=>x.id===lid), prev=t.lessons[idx-1], next=t.lessons[idx+1]; const hasGen=QE.gens.some(g=>g.t===tid&&g.l===lid);
  let ex=null; if(hasGen){ const key=tid+'/'+lid; if(!st.exm||st.exm.key!==key){ const q=QE.make({topic:tid,lesson:lid,difficulty:2},T3.R); st.exm=q?{key,q:T3.Prep.q(q,{shuffleOpt:true})}:null; } ex=st.exm; }
  const li=a=>`<ul style="margin:.3em 0">${a.map(x=>`<li>${UI.t(x)}</li>`).join('')}</ul>`;
  return `${UI.crumbs([['Trang chủ','/'],['Học toán','/learn'],[t.name,'/learn/'+tid],[l.name,'']])}<h1>${esc(l.name)}</h1><div class="card"><h3>📖 Kiến thức</h3><p style="font-size:1.15rem">${UI.t(l.intro)}</p></div>`+
  (l.worked&&l.worked.length?`<div class="card"><h3>📝 Ví dụ có lời giải từng bước</h3>${l.worked.map(w=>`<div class="note ok"><b>${UI.t(w.q)}</b><ol style="margin:.4em 0">${w.steps.map(x=>`<li>${UI.t(x)}</li>`).join('')}</ol><b>Đáp số: ${UI.t(w.a)}</b></div>`).join('')}</div>`:(l.examples&&l.examples.length?`<div class="card"><h3>✍️ Ví dụ</h3>${l.examples.map(e=>`<p><b>${UI.t(e.q)}</b><br>→ ${UI.t(e.a)}</p>`).join('')}</div>`:''))+
  (l.worked&&l.worked.length&&l.examples&&l.examples.length?`<div class="card"><h3>✍️ Thêm ví dụ nhanh</h3>${l.examples.map(e=>`<p><b>${UI.t(e.q)}</b> → ${UI.t(e.a)}</p>`).join('')}</div>`:'')+
  ((l.tips&&l.tips.length)||(l.mistakes&&l.mistakes.length)?`<div class="grid g2">${l.tips&&l.tips.length?`<div class="card" style="border-left:10px solid var(--yellow)"><h3>💡 Mẹo nhớ</h3>${li(l.tips)}</div>`:''}${l.mistakes&&l.mistakes.length?`<div class="card" style="border-left:10px solid var(--pen)"><h3>⚠️ Lỗi hay gặp</h3>${li(l.mistakes)}</div>`:''}</div>`:'')+
  (ex?`<div class="card"><div class="row"><h3 class="grow">🎲 Thử một ví dụ</h3><button class="btn sm warn" data-a="newExample" data-t="${tid}" data-l="${lid}">🔁 Ví dụ khác</button></div><div class="qbox" style="box-shadow:none">${UI.qBody(ex.q,{given:null},{lock:true})}</div><details style="margin-top:10px"><summary><b>👀 Xem cách giải</b></summary><div class="note ok"><p><b>Đáp án:</b> ${UI.t(T3.Check.answerText(ex.q))}</p><div style="white-space:pre-line">${UI.t(ex.q.explanation)}</div></div></details></div>`:'')+
  `<div class="card"><h3>✏️ Bài luyện</h3><p class="muted">Làm từng câu, em sẽ biết đúng sai và có lời giải ngay.</p><div class="row"><button class="btn primary big" data-a="startLesson" data-t="${tid}" data-l="${lid}" data-n="5">Luyện 5 câu</button><button class="btn big" data-a="startLesson" data-t="${tid}" data-l="${lid}" data-n="10">Luyện 10 câu</button></div></div><div class="row" style="justify-content:space-between">${prev?`<button class="btn" data-go="/learn/${tid}/${prev.id}">← ${esc(prev.name)}</button>`:'<span></span>'}${next?`<button class="btn" data-go="/learn/${tid}/${next.id}">${esc(next.name)} →</button>`:'<span></span>'}</div>`; };
A.newExample=el=>{ const t=el.dataset.t,l=el.dataset.l; const q=QE.make({topic:t,lesson:l,difficulty:T3.R.int(1,3)},T3.R); if(q) st.exm={key:t+'/'+l,q:T3.Prep.q(q,{shuffleOpt:true})}; UI.render(); };
A.startLesson=el=>{ const t=el.dataset.t,l=el.dataset.l,n=+el.dataset.n; const ramp=[1,2,2,3,3,2,3,4,3,4]; const used=new Set(), qs=[]; const hasGen=QE.gens.some(g=>g.t===t&&g.l===l);
  if(hasGen){ for(let i=0;i<n;i++){ const q=QE.make({topic:t,lesson:l,difficulty:ramp[i%ramp.length]},T3.R,used); if(q) qs.push(T3.Prep.q(q,{shuffleOpt:true})); } }
  if(qs.length<n){ Pool.pick({topics:[t],lessons:[l],count:n-qs.length,source:'bank'}).forEach(q=>qs.push(T3.Prep.q(q,{shuffleOpt:true}))); }
  UI.start({mode:'learn',title:UI.lesson(t,l).name,questions:qs,feedback:true,meta:{redo:{kind:'lesson',t,l,n}}}); };

/* ---------- luyện tập ---------- */
function pf(){ if(!st.pf) st.pf={topics:[],types:[],levels:[],count:10,shuffleQ:true,shuffleOpt:true,source:'mix',adv:false}; return st.pf; }
V.practice=()=>{ const f=pf(); const chip=(k,v,label)=>`<button class="chip" data-a="pf" data-k="${k}" data-v="${v}" aria-pressed="${f[k].indexOf(v)>=0}">${label}</button>`;
  return `${UI.crumbs([['Trang chủ','/'],['Luyện tập','/practice']])}<h1>✏️ Luyện tập</h1><p class="muted">Không chọn gì nghĩa là chọn tất cả.</p><div class="card"><h3>Chủ đề</h3><div class="chips">${S.content.topics.filter(t=>Pool.topicOn(t.id)).map(t=>chip('topics',t.id,t.icon+' '+esc(t.name))).join('')}</div>
  <h3 style="margin-top:14px">Dạng bài</h3><div class="chips">${Object.keys(T3.TYPES).map(k=>chip('types',k,esc(T3.TYPES[k]))).join('')}</div>
  <h3 style="margin-top:14px">Mức độ</h3><div class="chips">${[1,2,3,4,5].map(d=>chip('levels',d,d+' · '+esc(UI.lv(d)))).join('')}</div>
  <h3 style="margin-top:14px">Số câu</h3><div class="chips">${[5,10,15,20,30,50].map(n=>`<button class="chip" data-a="pfCount" data-v="${n}" aria-pressed="${f.count===n}">${n} câu</button>`).join('')}<span class="row"><label for="pfCount">Tùy chọn:</label><input id="pfCount" class="in" style="width:90px" type="number" min="1" max="100" value="${f.count}" data-i="pfCount"></span></div>
  <h3 style="margin-top:14px">Tùy chọn</h3><div class="chips"><button class="chip" data-a="pfTog" data-k="shuffleQ" aria-pressed="${f.shuffleQ}">🔀 Câu hỏi ngẫu nhiên</button><button class="chip" data-a="pfTog" data-k="shuffleOpt" aria-pressed="${f.shuffleOpt}">🔀 Đáp án ngẫu nhiên</button><button class="chip" data-a="pfTog" data-k="adv" aria-pressed="${f.adv}">🚀 Có câu nâng cao</button><button class="chip" data-a="pfSrc" aria-pressed="${f.source==='bank'}">📦 Chỉ dùng ngân hàng câu hỏi</button></div></div>
  <button class="btn primary big" data-a="startPracticeForm">Bắt đầu luyện tập 🚀</button>`; };
A.pf=el=>{ const f=pf(), k=el.dataset.k; const v=k==='levels'?+el.dataset.v:el.dataset.v; const i=f[k].indexOf(v); if(i>=0) f[k].splice(i,1); else f[k].push(v); UI.render(); };
A.pfCount=el=>{ pf().count=+el.dataset.v; UI.render(); }; I.pfCount=el=>{ pf().count=Math.max(1,Math.min(100,parseInt(el.value,10)||10)); };
A.pfTog=el=>{ const f=pf(); f[el.dataset.k]=!f[el.dataset.k]; UI.render(); }; A.pfSrc=()=>{ const f=pf(); f.source=f.source==='bank'?'mix':'bank'; UI.render(); };
function startPractice(o,title,redo){ const r=T3.R; let qs=Pool.pick({topics:o.topics,lessons:o.lessons,levels:o.levels,types:o.types,count:o.count,source:o.source,advanced:o.adv,rng:r}); if(o.shuffleQ===false) qs=qs.slice().sort((a,b)=>a.difficulty-b.difficulty); qs=qs.map(q=>T3.Prep.q(q,{shuffleOpt:o.shuffleOpt!==false},r));
  if(qs.length&&qs.length<o.count) UI.toast('Chỉ tìm được '+qs.length+' câu phù hợp.'); UI.start({mode:'practice',title,questions:qs,feedback:true,meta:{redo:redo||{kind:'practice',o}}}); }
UI.startPractice=startPractice;
A.startPracticeForm=()=>{ const f=pf(); startPractice(Object.assign({},f,{count:Math.max(1,Math.min(100,f.count))}),'Luyện tập tự chọn',{kind:'practice',o:U.clone(f)}); };

/* ---------- chuyên đề ---------- */
V.topics=()=>`${UI.crumbs([['Trang chủ','/'],['Luyện theo chuyên đề','/topics']])}<h1>🎯 Luyện theo chuyên đề</h1><div class="grid g3">${S.content.topics.filter(t=>Pool.topicOn(t.id)).map(t=>`<button class="topic" style="border-left-color:${t.color}" data-go="/topic/${t.id}"><span class="ic">${t.icon}</span><span><b>${esc(t.name)}</b><span class="muted small">Học · Luyện · Thi</span></span></button>`).join('')}</div>`;
V.topic=p=>{ const t=UI.topic(p[0]); if(!S.content.topics.some(x=>x.id===t.id)) return V.notfound(); const s=me(), o=An.byTopic(s.id)[t.id], n=o?o.c+o.w:0;
  return `${UI.crumbs([['Trang chủ','/'],['Chuyên đề','/topics'],[t.name,'']])}<div class="card" style="border-left:12px solid ${t.color}"><div class="row"><span style="font-size:3rem">${t.icon}</span><div class="grow"><h1>${esc(t.name)}</h1><p class="muted">${n?`Em đã làm ${n} câu, đúng ${U.pct(o.c/n)}.`:'Chuyên đề này em chưa làm câu nào.'}</p></div>${UI.ring(n?o.c/n*100:0,t.color)}</div></div>
  <div class="grid g3"><button class="tile t1" data-go="/learn/${t.id}"><span class="ic">📚</span><span class="tt">HỌC</span><span class="ds">Kiến thức và ví dụ</span></button><button class="tile t2" data-a="startTopicPractice" data-t="${t.id}"><span class="ic">✏️</span><span class="tt">LUYỆN 10 CÂU</span><span class="ds">Từ dễ đến khó</span></button><button class="tile t4" data-a="startTopicExam" data-t="${t.id}"><span class="ic">📝</span><span class="tt">THI CHUYÊN ĐỀ</span><span class="ds">20 câu · 20 phút</span></button></div>
  <h3 style="margin-top:18px">Các bài học</h3><div class="chips">${t.lessons.map(l=>`<button class="chip" data-go="/learn/${t.id}/${l.id}">${esc(l.name)}</button>`).join('')}</div>`; };
A.startTopicPractice=el=>{ const t=el.dataset.t; const used=new Set(), qs=[]; const ramp=[1,1,2,2,3,3,3,4,4,5]; for(let i=0;i<10;i++){ let q=QE.make({topic:t,difficulty:ramp[i]},T3.R,used); if(!q){ const b=Pool.pick({topics:[t],count:1,source:'bank'}); if(b[0]) q=b[0]; } if(q&&q.advanced&&(!S.cfg.enableAdvanced||t!=='TOAN_TU_DUY')&&q.difficulty>=5&&t!=='TOAN_TU_DUY'){ const alt=QE.make({topic:t,difficulty:4},T3.R,used); if(alt) q=alt; } if(q) qs.push(T3.Prep.q(q,{shuffleOpt:true})); }
  UI.start({mode:'practice',title:'Luyện '+tName(t),questions:qs,feedback:true,meta:{redo:{kind:'topic',t}}}); };
A.startTopicExam=el=>{ const t=el.dataset.t; const qs=Pool.pick({topics:[t],count:20,dist:[10,25,30,25,10],source:'mix',rng:T3.R}).map(q=>T3.Prep.q(q,{shuffleOpt:true})); UI.start({mode:'topicexam',title:'THI CHUYÊN ĐỀ '+tName(t).toUpperCase(),questions:qs,durationSec:20*60,feedback:false,meta:{redo:{kind:'topicexam',t}}}); };

/* ---------- toán tư duy ---------- */
V.thinking=()=>{ const t=UI.topic('TOAN_TU_DUY'); const lv=[['🌱','CƠ BẢN','Logic và tìm quy luật nhẹ nhàng',[1,2,3]],['🔥','KHÁ','Suy luận nhiều bước',[4]],['🚀','NÂNG CAO','Thử thách dành cho nhà toán học nhí',[5]]];
  return `${UI.crumbs([['Trang chủ','/'],['Toán tư duy','/thinking']])}<h1>🧠 Toán tư duy</h1><p class="muted">Các câu có nhãn <span class="pill adv">NÂNG CAO</span> là câu thử thách, có thể vượt ra ngoài bài học thường ngày.</p>
  <div class="grid g3">${lv.map((l,i)=>`<button class="tile ${['t2','t3','t5'][i]}" data-a="startThinking" data-i="${i}"><span class="ic">${l[0]}</span><span class="tt">${l[1]}</span><span class="ds">${l[2]}</span></button>`).join('')}</div>
  <h3 style="margin-top:18px">Học các dạng tư duy</h3><div class="chips">${t.lessons.map(l=>`<button class="chip" data-go="/learn/TOAN_TU_DUY/${l.id}">${esc(l.name)}</button>`).join('')}</div>`; };
A.startThinking=el=>{ const lvs=[[1,2,3],[4],[5]][+el.dataset.i]; startPractice({topics:['TOAN_TU_DUY'],levels:lvs,count:10,shuffleOpt:true,source:'mix',adv:true},'Toán tư duy · '+['Cơ bản','Khá','Nâng cao'][+el.dataset.i],{kind:'thinking',i:+el.dataset.i}); };

/* ---------- thi thử ---------- */
V.exam=()=>{ const s=me(); const pub=S.exams.filter(e=>e.status==='published'); const exams=pub.filter(e=>!e.mini), minis=pub.filter(e=>e.mini);
  const card=e=>`<div class="card flat"><div class="row"><div class="grow"><b>${esc(e.title)}</b><div class="muted small">${e.count} câu · ${e.minutes} phút${e.desc?' · '+esc(e.desc):''}</div></div><button class="btn primary" data-a="startExam" data-v="${e.id}">Bắt đầu</button></div></div>`;
  return `${UI.crumbs([['Trang chủ','/'],['Thi thử','/exam']])}<h1>📝 Thi thử</h1><p class="muted">Khi thi: không hiện đáp án, có đồng hồ đếm ngược, hết giờ tự nộp bài.</p>
  <h2>Đề thi thử</h2>${exams.length?exams.map(card).join(''):'<p class="muted">Chưa có đề nào được xuất bản. Nhờ thầy cô tạo đề trong Admin Studio nhé.</p>'}
  <div class="card" style="border-left:10px solid var(--mint)"><h2>🪄 Tạo đề cho em</h2><p>Hệ thống tự chọn chuyên đề, mức độ và dạng bài dựa trên lịch sử làm bài của em: yếu phần nào thì có nhiều câu phần đó hơn.</p><button class="btn good big" data-a="startAuto">Tạo đề cho em (20 câu · 20 phút)</button></div>
  <h2>Kiểm tra nhanh (Mini test)</h2><div class="row"><button class="btn" data-a="startMini" data-n="5">5 câu · 5 phút</button><button class="btn" data-a="startMini" data-n="10">10 câu · 10 phút</button></div>${minis.map(card).join('')}
  <h2 style="margin-top:20px">Thi theo chuyên đề</h2><div class="chips">${S.content.topics.filter(t=>Pool.topicOn(t.id)).map(t=>`<button class="chip" data-a="startTopicExam" data-t="${t.id}">${t.icon} ${esc(t.name)}</button>`).join('')}</div>`; };
A.startExam=el=>{ const def=S.exams.find(e=>e.id===el.dataset.v); if(!def) return; const qs=T3.Exam.build(def); if(!qs.length){ UI.toast('Đề này chưa có câu hỏi phù hợp trong ngân hàng.','bad'); return; } if(qs.length<def.count) UI.toast('Ngân hàng chỉ có '+qs.length+'/'+def.count+' câu phù hợp.');
  UI.start({mode:def.mini?'mini':'exam',title:def.title,questions:qs,durationSec:def.minutes*60,feedback:false,meta:{examId:def.id,redo:{kind:'exam',id:def.id}}}); };
A.startMini=el=>{ const n=+el.dataset.n; const qs=Pool.pick({count:n,dist:[20,30,30,15,5],figure:true,word:true,source:'mix',topics:['PHEP_TINH','NHAN_CHIA','BIEU_THUC','DAI_LUONG','HINH_HOC','SO_HOC']}).map(q=>T3.Prep.q(q,{shuffleOpt:true})); UI.start({mode:'mini',title:'KIỂM TRA NHANH '+n+' CÂU',questions:qs,durationSec:n*60,feedback:false,meta:{redo:{kind:'mini',n}}}); };
A.startAuto=()=>{ const s=me(); const r=Pool.pickAuto(s,20); const qs=r.questions.map(q=>T3.Prep.q(q,{shuffleOpt:true})); UI.start({mode:'auto',title:'ĐỀ TỰ ĐỘNG CỦA '+s.name.toUpperCase(),questions:qs,durationSec:20*60,feedback:false,meta:{redo:{kind:'auto'}}}); };
UI.redo=rec=>{ const r=rec.meta&&rec.meta.redo; if(!r){ UI.go('/exam'); return; }
  if(r.kind==='exam') A.startExam({dataset:{v:r.id}}); else if(r.kind==='topicexam') A.startTopicExam({dataset:{t:r.t}}); else if(r.kind==='mini') A.startMini({dataset:{n:r.n}}); else if(r.kind==='auto') A.startAuto();
  else if(r.kind==='lesson') A.startLesson({dataset:{t:r.t,l:r.l,n:r.n}}); else if(r.kind==='topic') A.startTopicPractice({dataset:{t:r.t}}); else if(r.kind==='thinking') A.startThinking({dataset:{i:r.i}}); else if(r.kind==='practice') startPractice(r.o,rec.title,r); else UI.go('/'); };

/* ---------- sự kiện toàn cục ---------- */
A.closeModal=()=>UI.closeModal();
A.confirmOk=()=>{ const cb=st.cb; st.cb=null; UI.closeModal(); if(cb) try{ cb(); }catch(e){ UI.fail(e); } };
A.copyText=async()=>{ try{ await root.navigator.clipboard.writeText(st.copyText||''); UI.toast('Đã sao chép','ok'); }catch(e){ const t=$('copyArea'); if(t){ t.select(); try{ root.document.execCommand('copy'); UI.toast('Đã sao chép','ok'); }catch(_){ UI.toast('Hãy nhấn giữ để chọn và sao chép.'); } } } };
A.toggleSound=()=>{ const r=T3.saveCfg({sound:!S.cfg.sound}); if(!r.ok) UI.toast(r.errors[0],'bad'); UI.render(); if(S.cfg.sound) UI.snd('ok'); };
A.bigFont=()=>{ const on=!root.document.documentElement.classList.contains('big'); root.document.documentElement.classList.toggle('big',on); T3.LS.set('big',on); };
A.fullscreen=()=>{ try{ const d=root.document; if(d.fullscreenElement) d.exitFullscreen(); else d.documentElement.requestFullscreen(); }catch(e){ UI.toast('Thiết bị này chưa hỗ trợ toàn màn hình.'); } };

UI.guardLeave=newHash=>{ const s=UI.ses; if(!s||s.done||s.feedback) return false; if(String(newHash).split('/')[1]==='session') return false; return true; };
function nav(h){ if(UI.guardLeave('#'+h)){ UI.confirm({title:'Em đang làm bài thi!',body:'<p>Em đang trong giờ thi. Em muốn ở lại làm tiếp, hay nộp bài ngay bây giờ?</p>',ok:'Nộp bài ngay',cancel:'Ở lại làm bài',onOk:()=>UI.finish()}); return; } UI.go(h); }
root.document.addEventListener('click',e=>{ try{ const t=e.target.closest('[data-a],[data-go]'); if(!t||t.disabled||t.getAttribute('aria-disabled')==='true') return; const a=t.dataset.a, g=t.dataset.go; if(a&&A[a]){ const r=A[a](t,e); if(r&&r.catch) r.catch(x=>UI.fail(x)); } if(g) nav(g); }catch(err){ UI.fail(err); } });
root.document.addEventListener('input',e=>{ const t=e.target.closest('[data-i]'); if(!t) return; try{ const f=I[t.dataset.i]; if(f) f(t,e); }catch(err){ UI.fail(err); } });
root.document.addEventListener('change',e=>{ const t=e.target.closest('[data-i],[data-c]'); if(!t) return; try{ const f=C[t.dataset.c||t.dataset.i]; if(f) f(t,e); }catch(err){ UI.fail(err); } });
root.document.addEventListener('keydown',e=>{ try{
  if(e.key==='Escape'&&$('modal').classList.contains('on')){ UI.closeModal(); return; }
  const tag=(e.target.tagName||'').toLowerCase(), typing=tag==='input'||tag==='textarea'||tag==='select';
  if(UI.route()[0]==='session'&&UI.ses){ const s=UI.ses, q=s.qs[s.i], a=s.ans[s.i];
    if(e.key==='Enter'&&!$('modal').classList.contains('on')){ if(tag==='button') return; e.preventDefault(); if(s.feedback){ if(a.checked) A.next(); else A.check(); } else A.next(); return; }
    if(typing) return; if(q.type==='mc'||q.type==='tf'){ const k='1234'.indexOf(e.key), l='abcd'.indexOf(e.key.toLowerCase()); const idx=k>=0?k:(e.key.length===1?l:-1); if(idx>=0&&idx<q.options.length){ A.pick({dataset:{v:idx}}); } }
    if(!s.feedback){ if(e.key==='ArrowRight') A.next(); if(e.key==='ArrowLeft') A.prev(); } }
  if(UI.route()[0]==='quick'&&UI.keyQuick) UI.keyQuick(e); if(UI.route()[0]==='arena'&&UI.keyArena) UI.keyArena(e);
}catch(err){ UI.fail(err); } });
/* kéo thả (HTML5) */
root.document.addEventListener('dragstart',e=>{ const t=e.target.closest('[data-drag]'); if(!t) return; e.dataTransfer.setData('text/plain',t.dataset.drag); e.dataTransfer.effectAllowed='move'; });
root.document.addEventListener('dragover',e=>{ const z=e.target.closest('[data-drop]'); if(z){ e.preventDefault(); z.classList.add('drop'); } });
root.document.addEventListener('dragleave',e=>{ const z=e.target.closest('[data-drop]'); if(z) z.classList.remove('drop'); });
root.document.addEventListener('drop',e=>{ const z=e.target.closest('[data-drop]'); if(!z) return; e.preventDefault(); z.classList.remove('drop'); const src=e.dataTransfer.getData('text/plain'); if(src) UI.dnd(src,z.dataset.drop); });
root.addEventListener('hashchange',()=>{ if(st.revert){ st.revert=false; return; } const h=root.location.hash.replace(/^#/,''); if(UI.guardLeave('#'+h)){ st.revert=true; root.location.hash='#/session'; nav(h||'/'); return; } UI.render(); });
root.addEventListener('beforeunload',e=>{ if(UI.ses&&!UI.ses.done&&!UI.ses.feedback){ UI.saveActive(); e.preventDefault(); e.returnValue=''; } else if(UI.ses) UI.saveActive(); });
root.addEventListener('error',ev=>{ T3.logErr(ev.error||ev.message,'window'); });
root.addEventListener('unhandledrejection',ev=>{ T3.logErr(ev.reason,'promise'); });
})(typeof window!=='undefined'?window:globalThis);
/* ===== UI 3: KẾT QUẢ · CÂU SAI · THÀNH TÍCH · TIẾN BỘ · XẾP HẠNG · PHỤ HUYNH · TÍNH NHANH · ĐẤU TRƯỜNG ===== */
(function(root){
'use strict';
const T3=root.T3, S=T3.S, U=T3.U, esc=U.esc, UI=T3.UI, A=UI.A, V=UI.V, I=UI.I, C=UI.C, $=UI.$, QE=T3.QE, Pool=T3.Pool, An=T3.An, st=UI.st;
const me=()=>T3.Student.current();
const tName=id=>UI.topic(id).name;
const MODES=['learn','practice','exam','topicexam','mini','auto','mistakes','quick'];

/* ---------- biểu đồ ---------- */
UI.chartLine=(series,key,max,fmt)=>{ const pts=series.map((s,i)=>({i,v:s[key],l:s.label})).filter(p=>p.v!=null); if(!pts.length) return '<p class="muted">Chưa có dữ liệu. Em hãy làm vài bài để thấy biểu đồ nhé.</p>'; const W=600,H=210,pl=36,pb=30,pt=12,n=series.length;
  const X=i=>pl+(W-pl-14)*(n>1?i/(n-1):0.5), Y=v=>pt+(H-pt-pb)*(1-v/max);
  let g=''; [0,0.5,1].forEach(f=>{ const y=Y(max*f); g+=`<line x1="${pl}" y1="${y}" x2="${W-10}" y2="${y}" stroke="var(--line)" stroke-width="1.5"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="12" fill="currentColor">${fmt(max*f)}</text>`; });
  series.forEach((s,i)=>{ if(i%2===0||n<8) g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="currentColor">${s.label}</text>`; });
  g+=`<polyline fill="none" stroke="var(--brand)" stroke-width="4" stroke-linejoin="round" points="${pts.map(p=>X(p.i)+','+Y(p.v)).join(' ')}"/>`+pts.map(p=>`<circle cx="${X(p.i)}" cy="${Y(p.v)}" r="5" fill="var(--yellow)" stroke="var(--ink)" stroke-width="2"><title>${p.l}: ${fmt(p.v)}</title></circle>`).join('');
  return `<div class="tw"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ đường, ${pts.length} ngày có dữ liệu" style="color:var(--ink);max-width:640px">${g}</svg></div>`; };
UI.topicBars=bt=>{ const rows=S.content.topics.filter(t=>bt[t.id]&&bt[t.id].c+bt[t.id].w>0); if(!rows.length) return '<p class="muted">Chưa có dữ liệu theo chuyên đề.</p>'; return rows.map(t=>{ const o=bt[t.id], n=o.c+o.w, p=o.c/n*100; return `<div class="row" style="margin:6px 0"><span style="width:190px">${t.icon} ${esc(t.name)}</span><span class="grow">${UI.bar(p)}</span><b style="width:120px;text-align:right">${Math.round(p)}% (${o.c}/${n})</b></div>`; }).join(''); };

/* ---------- lịch sử ---------- */
const hf=()=>st.hf||(st.hf={q:'',mode:''});
UI.histRows=(sid,admin)=>{ const f=hf(); let r=S.sessions.filter(x=>!sid||x.studentId===sid).slice().sort((a,b)=>b.ts-a.ts); if(f.mode) r=r.filter(x=>x.mode===f.mode); if(f.q){ const q=U.norm(f.q); r=r.filter(x=>U.norm((x.title||'')+' '+UI.modeName(x.mode)+' '+(x.studentName||'')+' '+U.dateTime(x.ts)).indexOf(q)>=0); } return r; };
UI.histTable=(sid,admin,limit)=>{ const f=hf(), rows=UI.histRows(sid,admin), shown=limit?rows.slice(0,limit):rows;
  return `<div class="row" style="margin-bottom:10px"><input class="in grow" data-i="hq" placeholder="🔍 Tìm theo tên bài, chế độ, ngày…" value="${esc(f.q)}" aria-label="Tìm kiếm lịch sử"><select class="in" data-c="hmode" style="width:auto" aria-label="Lọc theo chế độ"><option value="">Tất cả chế độ</option>${MODES.map(m=>`<option value="${m}" ${f.mode===m?'selected':''}>${UI.modeName(m)}</option>`).join('')}</select></div>
  ${shown.length?`<div class="tw"><table><thead><tr><th>Ngày giờ</th>${admin?'<th>Học sinh</th>':''}<th>Chế độ</th><th>Nội dung</th><th>Câu</th><th>Đúng</th><th>Sai</th><th>Điểm</th><th>Thời gian</th><th></th></tr></thead><tbody>${shown.map(x=>`<tr><td>${U.dateTime(x.ts)}</td>${admin?`<td>${esc(x.studentName)}</td>`:''}<td>${UI.modeName(x.mode)}</td><td>${esc(x.title)}</td><td>${x.n}</td><td>${x.correct}</td><td>${x.wrong}</td><td><b>${x.mode==='quick'?x.points+' đ':U.score(x.score)}</b></td><td>${U.mmss(x.timeSec)}</td><td><button class="btn sm" data-go="/review/${x.id}">Chi tiết</button></td></tr>`).join('')}</tbody></table></div>${limit&&rows.length>limit?`<p class="muted">Đang hiển thị ${limit}/${rows.length} dòng.</p>`:''}`:'<p class="muted">Chưa có dòng nào phù hợp.</p>'}`; };
I.hq=el=>{ hf().q=el.value; clearTimeout(st.hqT); st.hqT=setTimeout(()=>{ const p=el.selectionStart; UI.render(); const n=root.document.querySelector('[data-i="hq"]'); if(n){ n.focus(); try{ n.setSelectionRange(p,p); }catch(e){} } },350); };
C.hmode=el=>{ hf().mode=el.value; UI.render(); };
UI.histCSV=(sid)=>{ const rows=UI.histRows(sid,true); const csv=T3.IO.toCSV([['Ngày','Giờ','Học sinh','Chế độ','Nội dung','Số câu','Đúng','Sai','Bỏ trống','Điểm (thang 10)','Điểm tích lũy','Thời gian (giây)','Mức độ']].concat(rows.map(x=>{ const d=new Date(x.ts); return [U.pad(d.getDate())+'/'+U.pad(d.getMonth()+1)+'/'+d.getFullYear(),U.pad(d.getHours())+':'+U.pad(d.getMinutes()),x.studentName,UI.modeName(x.mode),x.title,x.n,x.correct,x.wrong,x.blank,x.mode==='quick'?'':U.score(x.score),x.points,x.timeSec,(x.levels||[]).join('/')]; })));
  UI.download('toan-lop-3-lich-su-'+U.dayKey(Date.now())+'.csv','\uFEFF'+csv); };
A.histCSV=el=>UI.histCSV(el.dataset.sid||null);
A.histClear=el=>{ const sid=el.dataset.sid; UI.confirm({title:'Xóa lịch sử?',body:'<p>Toàn bộ lịch sử làm bài sẽ bị xóa và không thể khôi phục. Hãy sao lưu trước nếu cần.</p>',danger:true,ok:'Xóa lịch sử',onOk:()=>{ S.sessions.filter(x=>!sid||x.studentId===sid).forEach(x=>T3.Data.sessionDel(x.id)); S.sessions=S.sessions.filter(x=>sid&&x.studentId!==sid); UI.toast('Đã xóa lịch sử','ok'); UI.render(); }}); };
V.history=()=>{ const s=me(); return `${UI.crumbs([['Trang chủ','/'],['Tiến bộ','/progress'],['Lịch sử','/history']])}<h1>🕒 Lịch sử học tập</h1><div class="card">${UI.histTable(s.id,false)}<div class="row" style="margin-top:12px"><button class="btn" data-a="histCSV" data-sid="${s.id}">📤 Xuất CSV</button><button class="btn danger" data-a="histClear" data-sid="${s.id}">🗑️ Xóa lịch sử của em</button></div></div>`; };

/* ---------- kết quả ---------- */
V.result=p=>{ const rec=S.sessions.find(x=>x.id===p[0]); if(!rec) return `<div class="card center"><h2>Không tìm thấy kết quả</h2><button class="btn primary" data-go="/">Về trang chủ</button></div>`;
  const quick=rec.mode==='quick'; const bt=rec.perTopic||{}; const rows=Object.keys(bt).map(t=>({t,c:bt[t].c,w:bt[t].w,acc:bt[t].c/Math.max(1,bt[t].c+bt[t].w)})); const good=rows.filter(r=>r.acc>=0.8&&r.c>0), weak=rows.filter(r=>r.acc<0.7&&r.c+r.w>0);
  let h=''; if(st.badges&&st.badges.length){ h+=`<div class="note ok"><b>🎖️ Em vừa nhận huy hiệu mới!</b> ${st.badges.map(b=>`${b.icon} ${esc(b.name)}`).join(' · ')}</div>`; st.badges=[]; }
  h+=`<div class="card center"><h1>🎉 HOÀN THÀNH!</h1><p class="muted">${esc(rec.title)}</p>`+(quick?`<div class="redscore">${rec.points}<small> điểm</small></div>`:`<div class="redscore">${U.score(rec.score)}<small> / 10</small></div>`)+`<h2>${esc(rec.label)} ${rec.ratio>=0.8?'🌟':rec.ratio>=0.5?'👍':'💪'}</h2><p style="font-size:1.2rem"><b>${rec.correct} / ${rec.n}</b> câu đúng · <b>${U.pct(rec.ratio)}</b> chính xác</p></div>`;
  h+=`<div class="grid g4"><div class="stat"><b style="color:var(--ok)">${rec.correct}</b>câu đúng</div><div class="stat"><b style="color:var(--bad)">${rec.wrong}</b>câu sai</div><div class="stat"><b>${rec.blank}</b>bỏ trống</div><div class="stat"><b>${U.mmss(rec.timeSec)}</b>thời gian</div></div>`;
  h+=`<div class="note ${rec.ratio>=0.8?'ok':rec.ratio<0.5?'bad':''}" style="margin-top:14px"><b>Lời khuyên:</b> ${esc(T3.Score.advice(rec.ratio))}</div>`;
  if(rows.length){ h+=`<div class="card"><h3>📊 Phân tích theo chuyên đề</h3><div class="tw"><table><thead><tr><th>Chuyên đề</th><th>Đúng</th><th>Sai</th><th>Tỷ lệ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${UI.topic(r.t).icon} ${esc(tName(r.t))}</td><td>${r.c}</td><td>${r.w}</td><td><b>${Math.round(r.acc*100)}%</b> ${r.acc>=0.8?'✓':r.acc<0.7?'⚠':''}</td></tr>`).join('')}</tbody></table></div>`;
    if(good.length) h+=`<p>👍 <b>Em làm tốt:</b> ${good.map(g=>esc(tName(g.t))).join(', ')}.</p>`; if(weak.length) h+=`<p>📌 <b>Em cần ôn thêm:</b> ${weak.map(g=>esc(tName(g.t))).join(' và ')}.</p>`; h+='</div>'; }
  if(weak.length){ h+=`<div class="card"><h3>🧭 Nên học tiếp</h3>${weak.slice(0,4).map((w,i)=>`<div class="row" style="padding:4px 0"><span class="grow">${i+1}. Ôn lại ${esc(tName(w.t))}</span><button class="btn sm good" data-a="practiceTopic" data-t="${w.t}">LUYỆN NGAY</button></div>`).join('')}</div>`; }
  h+=`<div class="row" style="margin:14px 0"><button class="btn primary" data-a="redo" data-v="${rec.id}">🔄 Làm lại</button><button class="btn" data-go="/review/${rec.id}/wrong">❌ Xem câu sai</button>${weak.length?`<button class="btn good" data-a="practiceWeak" data-v="${rec.id}">📚 Ôn chuyên đề yếu</button>`:''}<button class="btn" data-go="/exam">📝 Làm đề khác</button><button class="btn" data-go="/">🏠 Trang chủ</button></div>`; return h; };
A.redo=el=>{ const rec=S.sessions.find(x=>x.id===el.dataset.v); if(rec) UI.redo(rec); };
A.practiceTopic=el=>UI.startPractice({topics:[el.dataset.t],levels:[1,2,3],count:10,shuffleOpt:true,source:'mix'},'Ôn tập: '+tName(el.dataset.t),{kind:'topic',t:el.dataset.t});
A.practiceWeak=el=>{ const rec=S.sessions.find(x=>x.id===el.dataset.v); if(!rec) return; const tp=Object.keys(rec.perTopic||{}).filter(t=>{ const o=rec.perTopic[t]; return o.c/Math.max(1,o.c+o.w)<0.7; }); UI.startPractice({topics:tp,levels:[1,2,3],count:12,shuffleOpt:true,source:'mix'},'Ôn chuyên đề yếu',{kind:'practice',o:{topics:tp,levels:[1,2,3],count:12,shuffleOpt:true,source:'mix'}}); };
const _redo=UI.redo; UI.redo=rec=>{ const r=rec.meta&&rec.meta.redo; if(r&&r.kind==='quick'){ st.quick=Object.assign({phase:'setup'},{dur:r.dur,kind:r.k,lv:r.lv}); UI.go('/quick'); return; } _redo(rec); };

V.review=p=>{ const rec=S.sessions.find(x=>x.id===p[0]); if(!rec) return V.notfound(); const onlyWrong=p[1]==='wrong'; const items=rec.items.map((it,i)=>({it,i})).filter(x=>!onlyWrong||x.it.ok!==true);
  return `${UI.crumbs([['Trang chủ','/'],['Kết quả','/result/'+rec.id],['Xem lại','']])}<h1>${onlyWrong?'❌ Các câu chưa đúng':'🔍 Xem lại bài làm'}</h1><p class="muted">${esc(rec.title)} · ${U.dateTime(rec.ts)} · ${esc(rec.studentName)}</p><div class="row"><button class="btn sm ${onlyWrong?'':'primary'}" data-go="/review/${rec.id}">Tất cả câu</button><button class="btn sm ${onlyWrong?'primary':''}" data-go="/review/${rec.id}/wrong">Chỉ câu sai</button></div>
  ${items.length?items.map(x=>{ const q=x.it.q, ok=x.it.ok; return `<div class="card"><div class="row"><b>Câu ${x.i+1}</b><span class="pill ${ok===true?'ok':ok===false?'bad':''}">${ok===true?'✓ Đúng':ok===false?'✗ Sai':'— Bỏ trống'}</span><span class="pill">${esc(tName(q.topic))}</span><span class="pill ${q.advanced?'adv':''}">${esc(UI.lv(q.difficulty))}</span></div>${UI.qBody(q,{given:x.it.given,ok},{lock:true,result:true})}${ok!==true?`<p><b>Đáp án đúng:</b> ${UI.t(T3.Check.answerText(q))}</p><p><b>Vì sao?</b> ${esc(T3.Why.analyze(q,x.it.given))}</p>`:''}<div class="note"><b>Cách làm:</b>\n<span style="white-space:pre-line">${UI.t(q.explanation)}</span></div></div>`; }).join(''):'<div class="card center"><h2>Không có câu sai nào! 🎉</h2></div>'}`; };

/* ---------- câu sai ---------- */
const mf=()=>st.mf||(st.mf={topic:'',state:'open'});
V.mistakes=()=>{ const s=me(), f=mf(); let list=T3.Mist.list(s.id,false); const open=list.filter(m=>!m.fixed).length; if(f.state==='open') list=list.filter(m=>!m.fixed); else if(f.state==='fixed') list=list.filter(m=>m.fixed); if(f.topic) list=list.filter(m=>m.topic===f.topic);
  return `${UI.crumbs([['Trang chủ','/'],['Câu sai của em','/mistakes']])}<h1>🔄 Câu sai của em</h1><p class="muted">Làm lại đúng thì câu đó được đánh dấu "đã khắc phục".</p>
  <div class="row" style="margin-bottom:12px"><button class="chip" data-a="mfState" data-v="open" aria-pressed="${f.state==='open'}">Chưa khắc phục (${open})</button><button class="chip" data-a="mfState" data-v="fixed" aria-pressed="${f.state==='fixed'}">Đã khắc phục</button><button class="chip" data-a="mfState" data-v="all" aria-pressed="${f.state==='all'}">Tất cả</button><select class="in" style="width:auto" data-c="mfTopic" aria-label="Lọc theo chuyên đề"><option value="">Mọi chuyên đề</option>${S.content.topics.map(t=>`<option value="${t.id}" ${f.topic===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>${open?`<button class="btn good" data-a="redoAll">▶ Làm lại tất cả (${Math.min(open,20)})</button>`:''}</div>
  ${list.length?list.map(m=>`<div class="card"><div class="row"><span class="pill ${m.fixed?'ok':'bad'}">${m.fixed?'✓ Đã khắc phục':'Chưa khắc phục'}</span><span class="pill">Sai ${m.wrongCount} lần</span><span class="pill">${esc(tName(m.topic))}</span><span class="pill ${m.q.advanced?'adv':''}">${esc(UI.lv(m.difficulty))}</span><span class="grow"></span>${m.fixed?'':`<button class="btn primary" data-a="redoOne" data-v="${esc(m.id)}">LÀM LẠI</button>`}</div>${UI.qBody(m.q,{given:m.lastGiven,ok:false},{lock:true,result:true})}<p><b>Em đã chọn:</b> ${UI.t(T3.Check.givenText(m.q,m.lastGiven))}</p><p><b>Đáp án đúng:</b> ${UI.t(T3.Check.answerText(m.q))}</p></div>`).join(''):`<div class="card center"><h2>${open?'Không có câu nào trong bộ lọc này':'Em chưa có câu sai nào cần ôn 🎉'}</h2></div>`}`; };
A.mfState=el=>{ mf().state=el.dataset.v; UI.render(); }; C.mfTopic=el=>{ mf().topic=el.value; UI.render(); };
A.redoOne=el=>{ const m=S.mistakes.find(x=>x.id===el.dataset.v); if(!m) return; UI.start({mode:'mistakes',title:'Làm lại câu sai',questions:[T3.Prep.q(m.q,{shuffleOpt:false})],feedback:true,meta:{redo:{kind:'practice',o:{count:5}}}}); };
A.redoAll=()=>{ const s=me(); const l=T3.Mist.list(s.id,true).slice(0,20); UI.start({mode:'mistakes',title:'Làm lại các câu sai',questions:l.map(m=>T3.Prep.q(m.q,{shuffleOpt:false})),feedback:true,meta:{}}); };

/* ---------- thành tích · tiến bộ · xếp hạng ---------- */
V.achievements=()=>{ const s=me(), x=An.stats(s.id), got=s.badges||{};
  return `${UI.crumbs([['Trang chủ','/'],['Thành tích','/achievements']])}<h1>🏆 Thành tích</h1><div class="grid g4"><div class="stat"><b>${Object.keys(got).length}/${T3.BADGES.length}</b>huy hiệu</div><div class="stat"><b>${x.days}</b>ngày luyện tập</div><div class="stat"><b>${x.examsDone}</b>đề hoàn thành</div><div class="stat"><b>${U.score(x.best)}</b>điểm cao nhất</div></div><h2 style="margin-top:18px">Huy hiệu</h2><div class="grid g2">${T3.BADGES.map(b=>`<div class="badge ${got[b.id]?'':'lock'}"><span class="ic" aria-hidden="true">${b.icon}</span><div><b>${esc(b.name)}</b><div class="small muted">${esc(b.desc)}</div><div class="small">${got[b.id]?'✅ Đạt ngày '+U.dateTime(got[b.id]).slice(0,10):'🔒 Chưa đạt'}</div></div></div>`).join('')}</div>`; };
UI.progress=(sid)=>{ const x=An.stats(sid), ser=An.series(sid,14), bt=An.byTopic(sid);

  return `${UI.crumbs([['Trang chủ','/'],['Phụ huynh','/parent']])}<div class="row"><h1 class="grow">👨‍👩‍👧 Góc phụ huynh</h1><button class="btn sm" data-a="parentLock">🔒 Khóa lại</button></div><div class="chips" style="margin-bottom:12px">${S.students.map(x=>`<button class="chip" data-a="parentPick" data-v="${x.id}" aria-pressed="${x.id===sid}">${x.avatar} ${esc(x.name)}</button>`).join('')}</div>
  <div class="card"><p>💪 <b>Chuyên đề mạnh:</b> ${nm(sp.strong.slice(0,3))}</p><p>🌱 <b>Chuyên đề yếu:</b> ${nm(sp.weak.slice(0,3))}</p><p>📌 <b>Câu sai chưa khắc phục:</b> ${T3.Mist.openCount(sid)} câu</p></div>${UI.progress(sid)}<div class="card"><h3>🕒 Lịch sử luyện tập</h3>${UI.histTable(sid,false,20)}</div>`; };

/* ---------- TÍNH NHANH ---------- */
const QK={nhan:'Bảng nhân',chia:'Bảng chia',cong:'Cộng',tru:'Trừ',mix:'Hỗn hợp'};
V.quick=()=>{ const q=st.quick||(st.quick={phase:'setup',dur:60,kind:'mix',lv:2});
  if(q.phase==='run') return `<div class="row" style="justify-content:space-between"><div class="clock" id="qkTime" role="timer">${U.mmss(q.dur)}</div><div><b>Điểm: <span id="qkScore">0</span></b></div><div class="pill ok" id="qkCombo" aria-live="polite">Combo ×1</div><button class="btn sm" data-a="qkQuit">Thoát</button></div><div id="qkBarW" style="margin:8px 0">${UI.bar(100)}</div><div class="qbox"><div class="qk" id="qkQ" aria-live="polite">${esc(q.cur.text)} = ?</div><div class="center"><input id="qkIn" data-i="qk" inputmode="numeric" autocomplete="off" aria-label="Đáp án" style="font-family:var(--f-d);font-size:2.4rem;width:200px;text-align:center;border:3px solid var(--ink);border-radius:16px;padding:6px"></div><div class="center" id="qkMsg" style="min-height:2rem;font-weight:900" aria-live="polite"></div><div class="pad" style="margin-top:8px">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-a="qkKey" data-v="${n}">${n}</button>`).join('')}<button data-a="qkKey" data-v="bk" aria-label="Xóa">⌫</button><button data-a="qkKey" data-v="0">0</button><button data-a="qkKey" data-v="ok" aria-label="Trả lời">✓</button></div></div>`;
  return `${UI.crumbs([['Trang chủ','/'],['Tính nhanh','/quick']])}<h1>⚡ Tính nhanh</h1><p class="muted">Tính thật nhanh để được thưởng điểm tốc độ và combo! Gõ đủ chữ số là hệ thống tự chấm.</p><div class="card"><h3>Thời gian</h3><div class="chips">${[30,60,90,120].map(d=>`<button class="chip" data-a="qkSet" data-k="dur" data-v="${d}" aria-pressed="${q.dur===d}">${d} giây</button>`).join('')}</div><h3 style="margin-top:14px">Phép tính</h3><div class="chips">${Object.keys(QK).map(k=>`<button class="chip" data-a="qkSet" data-k="kind" data-v="${k}" aria-pressed="${q.kind===k}">${QK[k]}</button>`).join('')}</div>${q.kind==='cong'||q.kind==='tru'||q.kind==='mix'?`<h3 style="margin-top:14px">Độ khó số cộng, trừ</h3><div class="chips">${[1,2,3].map(l=>`<button class="chip" data-a="qkSet" data-k="lv" data-v="${l}" aria-pressed="${q.lv===l}">${['Dễ','Vừa','Khó'][l-1]}</button>`).join('')}</div>`:''}</div><div class="note"><b>Cách tính điểm:</b> đúng +10, trả lời nhanh được thưởng thêm, chuỗi đúng liên tiếp tăng hệ số combo (×1,5; ×2; …). Sai mất combo${S.cfg.quickPenalty?' và bị trừ '+S.cfg.quickPenalty+' điểm':''}.</div><button class="btn primary big" data-a="qkStart">⚡ BẮT ĐẦU</button>`; };
A.qkSet=el=>{ const q=st.quick; q[el.dataset.k]=el.dataset.k==='kind'?el.dataset.v:+el.dataset.v; UI.render(); };
function qkNext(){ const q=st.quick; q.cur=QE.quick(T3.R,q.kind,q.lv); q.qStart=Date.now(); }
A.qkStart=()=>{ const q=st.quick; Object.assign(q,{phase:'run',score:0,streak:0,best:0,correct:0,wrong:0,log:[]}); qkNext(); T3.Timer.stopAll(); T3.Timer.start('quick',{ms:q.dur*1000,onTick:(l,sec)=>{ const t=$('qkTime'); if(t){ t.textContent=U.mmss(sec); t.classList.toggle('low',sec<=10); } const b=$('qkBarW'); if(b) b.innerHTML=UI.bar(l/(q.dur*1000)*100); if(sec<=5&&sec>0) UI.snd('tick'); },onEnd:()=>qkFinish()}); UI.render(); };
A.qkQuit=()=>UI.confirm({title:'Thoát khỏi Tính nhanh?',body:'<p>Kết quả lượt này sẽ không được lưu.</p>',ok:'Thoát',onOk:()=>{ T3.Timer.stopAll(); st.quick={phase:'setup',dur:st.quick.dur,kind:st.quick.kind,lv:st.quick.lv}; UI.render(); }});
UI.post.quick=()=>{ const q=st.quick; if(q&&q.phase==='run'){ const i=$('qkIn'); if(i) i.focus(); } };
function qkUpdate(msg,good){ const q=st.quick; const qq=$('qkQ'), sc=$('qkScore'), cb=$('qkCombo'), m=$('qkMsg'), i=$('qkIn'); if(qq) qq.textContent=q.cur.text+' = ?'; if(sc) sc.textContent=q.score; const mult=Math.min(3,1+Math.floor(q.streak/5)*0.5); if(cb) cb.textContent='Combo ×'+String(mult).replace('.',',')+' · chuỗi '+q.streak; if(m){ m.textContent=msg||''; m.style.color=good?'var(--ok)':'var(--bad)'; } if(i){ i.value=''; i.focus(); } }
function qkEval(val){ const q=st.quick; if(!q||q.phase!=='run'||val==='') return; const c=q.cur, ok=Number(val)===c.ans, ms=Date.now()-q.qStart; let msg;
  if(ok){ q.streak++; q.best=Math.max(q.best,q.streak); const p=T3.Score.quickPoints(q.streak-1,ms); q.score+=p.pts; q.correct++; msg='✓ +'+p.pts; UI.snd('ok'); } else { q.wrong++; q.streak=0; q.score=Math.max(0,q.score-S.cfg.quickPenalty); msg='✗ '+c.text+' = '+c.ans; UI.snd('bad'); }
  q.log.push({text:c.text,ans:c.ans,given:val,ok,ms,topic:c.topic}); qkNext(); qkUpdate(msg,ok); }
I.qk=el=>{ const q=st.quick; if(!q||q.phase!=='run') return; const v=el.value.replace(/\D/g,'').slice(0,5); el.value=v; if(v.length>=String(q.cur.ans).length) qkEval(v); };
A.qkKey=el=>{ const q=st.quick; if(!q||q.phase!=='run') return; const i=$('qkIn'); const k=el.dataset.v; if(k==='bk') i.value=i.value.slice(0,-1); else if(k==='ok') qkEval(i.value); else { i.value=(i.value+k).slice(0,5); I.qk(i); } };
UI.keyQuick=e=>{ const q=st.quick; if(!q||q.phase!=='run') return; const i=$('qkIn'); if(e.key==='Enter'){ e.preventDefault(); qkEval(i?i.value:''); } else if(i&&root.document.activeElement!==i&&/^\d$/.test(e.key)){ i.focus(); } };
function qkFinish(){ const q=st.quick; if(!q||q.phase!=='run') return; UI.snd('time'); const s=me(); const n=q.correct+q.wrong; q.phase='done'; T3.Timer.stopAll();
  if(!n){ UI.toast('Hết giờ! Em chưa trả lời câu nào.'); st.quick={phase:'setup',dur:q.dur,kind:q.kind,lv:q.lv}; UI.render(); return; }
  const pt={}; const items=q.log.slice(-80).map(l=>{ const qq={id:'QK-'+U.hash(l.text),grade:3,topic:l.topic,difficulty:2,type:'fill',question:l.text+' = ?',answer:l.ans,explanation:l.text+' = '+l.ans+'.',hint:''}; return {q:qq,given:String(l.given),ok:l.ok}; });
  q.log.forEach(l=>{ const o=pt[l.topic]||(pt[l.topic]={c:0,w:0}); if(l.ok) o.c++; else o.w++; }); items.forEach(it=>{ if(it.ok===false) T3.Mist.record(s.id,it.q,it.given); });
  const ratio=q.correct/n, score=Math.round(ratio*1000)/100; const rec={id:U.uid('KQ'),studentId:s.id,studentName:s.name,ts:Date.now(),mode:'quick',title:'Tính nhanh '+q.dur+' giây · '+QK[q.kind],topic:Object.keys(pt).length===1?Object.keys(pt)[0]:'mixed',n,correct:q.correct,wrong:q.wrong,blank:0,ratio,score,label:T3.Score.label(score),timeSec:q.dur,points:q.score,perTopic:pt,items,streak:q.best,meta:{redo:{kind:'quick',dur:q.dur,k:q.kind,lv:q.lv}},levels:[2]};
  S.sessions.push(rec); T3.Data.session(rec); st.badges=T3.Ach.check(s,rec,{bestStreak:q.best}); st.quick={phase:'setup',dur:q.dur,kind:q.kind,lv:q.lv}; UI.confetti(); UI.snd('done'); UI.go('/result/'+rec.id); }

/* ---------- ĐẤU TRƯỜNG 2 NGƯỜI ---------- */
const ar=()=>st.arena||(st.arena={phase:'setup',names:['Người chơi 1','Người chơi 2']});
V.arena=()=>{ const a=ar(); const cfg=S.cfg.arena;
  if(a.phase==='setup') return `${UI.crumbs([['Trang chủ','/'],['Đấu trường','/arena']])}<h1>⚔️ Đấu trường toán học</h1><div class="card"><p><b>Luật chơi:</b> ${cfg.rounds} câu hỏi. Người chơi 1 nhấn phím <kbd>A</kbd>, người chơi 2 nhấn phím <kbd>L</kbd> (hoặc chạm nút to) để giành quyền trả lời, rồi chọn đáp án <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd>. Đúng được cộng điểm${cfg.penalty?', sai bị trừ '+cfg.penalty+' điểm':''}${cfg.steal?'. Nếu một bạn trả lời sai, bạn còn lại được quyền trả lời':''}. Mỗi câu có ${cfg.time} giây.</p><div class="row"><div class="field grow"><label for="arN1">Tên người chơi 1 (phím A)</label><input id="arN1" maxlength="20" value="${esc(a.names[0])}"></div><div class="field grow"><label for="arN2">Tên người chơi 2 (phím L)</label><input id="arN2" maxlength="20" value="${esc(a.names[1])}"></div></div><button class="btn primary big" data-a="arStart">⚔️ VÀO TRẬN</button></div>`;
  if(a.phase==='end'){ const [p1,p2]=a.p; const tie=p1.score===p2.score, w=p1.score>p2.score?p1:p2; return `<div class="card center"><h1>🏁 Kết thúc trận đấu</h1><div class="winner">${tie?'🤝 HÒA NHAU!':'🏆 NGƯỜI CHIẾN THẮNG: '+esc(w.n)}</div><div class="grid g2" style="margin:14px 0"><div class="pl"><h3>${esc(p1.n)}</h3><div class="sc2">${p1.score}</div><div class="muted">${p1.right} câu đúng</div></div><div class="pl"><h3>${esc(p2.n)}</h3><div class="sc2">${p2.score}</div><div class="muted">${p2.right} câu đúng</div></div></div><div class="row" style="justify-content:center"><button class="btn primary" data-a="arAgain">🔄 Chơi lại</button><button class="btn" data-a="arReset">Đổi người chơi</button><button class="btn" data-go="/">🏠 Trang chủ</button></div></div>`; }
  const q=a.qs[a.i], rev=a.phase==='reveal'; const pl=(k)=>{ const p=a.p[k]; return `<div class="pl ${a.buzzed===k?'on':''}"><h3>${esc(p.n)}</h3><div class="sc2" id="arS${k}">${p.score}</div><div class="small">Combo: ${p.streak}</div><button class="btn big ${a.tried[k]?'off':'primary'}" data-a="arBuzz" data-v="${k}" ${rev||a.tried[k]||a.buzzed!=null?'disabled':''} style="margin-top:8px;width:100%">${k===0?'A':'L'} · GIÀNH QUYỀN</button></div>`; };
  return `<div class="row" style="justify-content:space-between"><b>Câu ${a.i+1} / ${a.qs.length}</b><div class="clock" id="arClock" role="timer">${U.mmss(a.left||cfg.time)}</div><button class="btn sm" data-a="arQuit">Thoát</button></div><div class="arena" style="margin-top:10px">${pl(0)}<div class="qbox">${q.figure?UI.fig(q.figure):''}<div class="qtext">${UI.t(q.question)}</div><div class="opts">${q.options.map((o,k)=>`<button class="opt ${rev&&k===q.answer?'ok':''}" data-a="arPick" data-v="${k}" ${a.buzzed==null||rev?'disabled':''}><span class="lt">${k+1}</span><span>${UI.t(o)}</span><span class="mk">${rev&&k===q.answer?'✓':''}</span></button>`).join('')}</div><div class="note" aria-live="polite" style="margin-top:12px">${esc(a.msg||'Ai nhanh tay hơn? Nhấn A hoặc L để giành quyền trả lời!')}</div></div>${pl(1)}</div>`; };
A.arStart=()=>{ const a=ar(); a.names=[($('arN1').value.trim()||'Người chơi 1'),($('arN2').value.trim()||'Người chơi 2')]; arRun(); };
function arRun(){ const a=ar(); const cfg=S.cfg.arena; const used=new Set(), qs=[]; const tps=['PHEP_TINH','NHAN_CHIA','SO_HOC','BIEU_THUC','DAI_LUONG']; for(let i=0;i<cfg.rounds;i++){ const q=QE.makeMC({topic:tps[i%tps.length],difficulty:1+i%3},T3.R,used); if(q) qs.push(T3.Prep.q(q,{shuffleOpt:true})); }
  Object.assign(a,{phase:'q',qs,i:0,p:a.names.map(n=>({n,score:0,streak:0,right:0})),buzzed:null,tried:[false,false],msg:'',left:cfg.time}); arStartQ(); UI.render(); }
function arStartQ(){ const a=ar(); a.phase='q'; a.buzzed=null; a.tried=[false,false]; a.msg=''; a.left=S.cfg.arena.time; T3.Timer.stopAll(); T3.Timer.start('arena',{ms:S.cfg.arena.time*1000,onTick:(l,sec)=>{ a.left=sec; const c=$('arClock'); if(c){ c.textContent=U.mmss(sec); c.classList.toggle('low',sec<=5); } },onEnd:()=>arReveal('⏰ Hết giờ! Không ai trả lời được.')}); }
function arReveal(msg){ const a=ar(); if(a.phase!=='q') return; T3.Timer.stop('arena'); a.phase='reveal'; a.msg=msg+' Đáp án đúng: '+'ABCD'[a.qs[a.i].answer]+'.'; T3.Timer.start('arenaNext',{ms:1900,onEnd:arNext}); UI.render(); }
function arNext(){ const a=ar(); if(a.i>=a.qs.length-1){ a.phase='end'; T3.Timer.stopAll(); UI.snd('win'); UI.confetti(); UI.render(); return; } a.i++; arStartQ(); UI.render(); }
function arBuzz(k){ const a=ar(); if(a.phase!=='q'||a.buzzed!=null||a.tried[k]) return; a.buzzed=k; a.msg=a.p[k].n+' đang trả lời… chọn đáp án 1–4!'; UI.snd('tick'); UI.render(); }
function arAnswer(idx){ const a=ar(); if(a.phase!=='q'||a.buzzed==null) return; const k=a.buzzed, q=a.qs[a.i], p=a.p[k]; if(idx==null||idx<0||idx>3) return;
  if(idx===q.answer){ const pts=10+Math.min(p.streak,5)*2; p.score+=pts; p.streak++; p.right++; UI.snd('ok'); arReveal('✅ '+p.n+' trả lời đúng! +'+pts+' điểm.'); }

  <div class="row"><div class="field grow"><label for="qeType">Dạng bài</label>${sel('qeType',TYPEOPTS,q.type,'data-c="qeType"')}</div><div class="field grow"><label for="qeLevel">Mức độ</label>${sel('qeLevel',[1,2,3,4,5].map(d=>[d,d+' · '+UI.lv(d)]),q.difficulty)}</div><div class="field grow"><label for="qeStatus">Trạng thái</label>${sel('qeStatus',Object.keys(STAT_LABEL).map(k=>[k,STAT_LABEL[k]]),q.status)}</div></div>
  ${fld('Nội dung câu hỏi (dùng ___ cho chỗ trống)',`<textarea id="qeText" rows="3">${esc(q.question)}</textarea>`,'qeText')}
  <div data-sec="mc"><div class="grid g2">${[0,1,2,3].map(k=>fld('Đáp án '+'ABCD'[k],`<input id="qeO${k}" value="${esc(o[k]||'')}">`,'qeO'+k)).join('')}</div>${fld('Đáp án đúng',sel('qeAns',[[0,'A'],[1,'B'],[2,'C'],[3,'D']],q.type==='mc'?q.answer:0),'qeAns')}</div>
  <div data-sec="tf">${fld('Đáp án đúng',sel('qeTf',[[0,'Đúng'],[1,'Sai']],q.type==='tf'?q.answer:0),'qeTf')}</div>
  <div data-sec="fill"><div class="row"><div class="field grow"><label for="qeFill">Đáp án cần điền</label><input id="qeFill" value="${esc(q.type==='fill'?q.answer:'')}"></div><div class="field"><label for="qeUnit">Đơn vị (nếu có)</label><input id="qeUnit" value="${esc(q.unit||'')}"></div></div></div>
  <div data-sec="sort">${fld('Các mục theo ĐÚNG thứ tự (mỗi dòng một mục)',`<textarea id="qeItems" rows="4">${esc((q.items||[]).join('\n'))}</textarea>`,'qeItems')}</div>
  <div data-sec="match">${fld('Các cặp ghép (mỗi dòng: vế trái = vế phải)',`<textarea id="qePairs" rows="4">${esc((q.pairs||[]).map(p=>p.join(' = ')).join('\n'))}</textarea>`,'qePairs')}</div>
  ${fld('Giải thích (ngắn, dễ hiểu)',`<textarea id="qeExp" rows="3">${esc(q.explanation)}</textarea>`,'qeExp')}${fld('Gợi ý (không nói đáp án)',`<input id="qeHint" value="${esc(q.hint||'')}">`,'qeHint')}
  <div class="row"><div class="field grow"><label for="qeSrc">Nguồn</label><input id="qeSrc" value="${esc(q.source||'')}"></div><div class="field grow"><label for="qeAuth">Tác giả</label><input id="qeAuth" value="${esc(q.author||'')}"></div></div>
  <div id="qeMsg" class="note hide" role="alert"></div><div class="row" style="justify-content:flex-end"><button class="btn" data-a="closeModal">Hủy</button><button class="btn" data-a="qCheck">🔍 Kiểm tra</button><button class="btn primary" data-a="qSave">💾 Lưu</button></div>`);
  qSecs(); }
function qSecs(){ const t=$('qeType').value; root.document.querySelectorAll('#modal [data-sec]').forEach(s=>s.classList.toggle('hide',s.dataset.sec!==t)); }
C.qeType=()=>qSecs();
C.qeTopic=()=>{ const tp=UI.topic($('qeTopic').value); $('qeLesson').innerHTML=tp.lessons.map(l=>opt(l.id,l.name,'')).join(''); };
function qRead(){ const old=st.editNew?null:S.questions.find(x=>x.id===st.editQ); const type=$('qeType').value; const q={id:old?old.id:'',grade:3,topic:$('qeTopic').value,lesson:$('qeLesson').value,type,difficulty:+$('qeLevel').value,question:$('qeText').value.trim(),explanation:$('qeExp').value.trim(),hint:$('qeHint').value.trim(),source:$('qeSrc').value.trim(),author:$('qeAuth').value.trim(),status:$('qeStatus').value,createdAt:old?old.createdAt:Date.now(),updatedAt:Date.now()};
  if(old&&old.figure) q.figure=old.figure; if(old&&old.advanced) q.advanced=old.advanced;
  if(type==='mc'){ q.options=[0,1,2,3].map(k=>$('qeO'+k).value.trim()); q.answer=+$('qeAns').value; } else if(type==='tf'){ q.options=['Đúng','Sai']; q.answer=+$('qeTf').value; }
  else if(type==='fill'){ const a=$('qeFill').value.trim(); q.answer=isFinite(T3.Calc.parseNum(a))&&a!==''?T3.Calc.parseNum(a):a; const u=$('qeUnit').value.trim(); if(u) q.unit=u; }
  else if(type==='sort'){ q.items=$('qeItems').value.split('\n').map(x=>x.trim()).filter(Boolean); } else if(type==='match'){ q.pairs=$('qePairs').value.split('\n').map(x=>x.split('=').map(y=>y.trim())).filter(p=>p.length===2&&p[0]&&p[1]); }
  return q; }
function qMsg(v,okText){ const m=$('qeMsg'); m.classList.remove('hide','ok','bad'); m.classList.add(v.ok?'ok':'bad'); m.innerHTML=(v.ok?'🟢 '+okText:'🔴 <b>Chưa hợp lệ:</b><ul>'+v.errors.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul>')+(v.warnings.length?'<br>🟡 '+v.warnings.map(esc).join('; '):''); }
A.qCheck=()=>{ const q=qRead(); if(!q.id) q.id='TAM-1'; qMsg(Verify.question(q),'Câu hỏi hợp lệ, có thể Publish.'); };
A.qSave=()=>{ const q=qRead(); const isNew=st.editNew; if(isNew){ q.id=U.uid('GV'); } const v=Verify.question(q); if(!v.ok){ qMsg(v,''); if(q.status==='published'){ q.status='draft'; $('qeStatus').value='draft'; const m=$('qeMsg'); m.innerHTML+='<p><b>Câu chưa hợp lệ nên không thể Publish.</b> Bấm Lưu lần nữa để lưu dưới dạng Draft.</p>'; return; } }
  if(isNew) S.questions.push(q); else { const i=S.questions.findIndex(x=>x.id===q.id); S.questions[i]=q; } T3.Data.q(q); UI.closeModal(); UI.toast('Đã lưu câu hỏi ('+STAT_LABEL[q.status]+')','ok'); reload(); };

AM.exams=()=>`<div class="card"><div class="row"><h2 class="grow">Quản lý đề thi</h2><button class="btn good" data-a="examNew">➕ Tạo đề</button></div>${S.exams.length?`<div class="tw"><table><thead><tr><th>Tên đề</th><th>Câu</th><th>Phút</th><th>Chuyên đề</th><th>Trạng thái</th><th></th></tr></thead><tbody>${S.exams.map(e=>`<tr><td><b>${esc(e.title)}</b>${e.questionIds&&e.questionIds.length?' <span class="pill">cố định</span>':''}<div class="small muted">${esc(e.id)}</div></td><td>${e.count}</td><td>${e.minutes}</td><td>${e.topics.map(t=>esc(tName(t))).join(', ')}</td><td><span class="pill ${e.status==='published'?'ok':''}">${STAT_LABEL[e.status]||e.status}</span></td><td style="white-space:nowrap"><button class="btn sm" data-a="examEdit" data-v="${e.id}">✏️</button> <button class="btn sm" data-a="examDup" data-v="${e.id}">📄</button> <button class="btn sm" data-a="examPrev" data-v="${e.id}">👁</button> <button class="btn sm" data-a="examExp" data-v="${e.id}">📤</button> <button class="btn sm danger" data-a="examDel" data-v="${e.id}">🗑</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Chưa có đề nào.</p>'}</div>`;

function examEditor(e){ const isNew=!e; e=e||{id:'',title:'',desc:'',count:20,minutes:20,topics:S.content.topics.map(t=>t.id),levels:[20,25,30,15,10],figure:true,word:true,shuffleQ:true,shuffleOpt:true,questionIds:[],status:'draft'}; st.editEx=e.id; st.editExNew=isNew; st.exFixed=(e.questionIds||[]).slice();
  UI.modal(`<h2>${isNew?'Tạo đề thi':'Sửa đề thi'}</h2>${fld('Tên đề',`<input id="exTitle" maxlength="120" value="${esc(e.title)}">`,'exTitle')}${fld('Mô tả',`<input id="exDesc" value="${esc(e.desc||'')}">`,'exDesc')}<div class="row"><div class="field grow"><label for="exCount">Số câu</label><input id="exCount" type="number" min="1" max="100" value="${e.count}"></div><div class="field grow"><label for="exMin">Thời gian (phút)</label><input id="exMin" type="number" min="1" max="180" value="${e.minutes}"></div><div class="field grow"><label for="exStatus">Trạng thái</label>${sel('exStatus',Object.keys(STAT_LABEL).map(k=>[k,STAT_LABEL[k]]),e.status)}</div></div>
  <div class="field"><label>Chuyên đề</label><div class="chips">${S.content.topics.map(t=>chk('exT_'+t.id,esc(t.name),e.topics.indexOf(t.id)>=0)).join('')}</div></div>
  <div class="field"><label>Tỷ lệ mức độ (%) — Dễ · Cơ bản · Trung bình · Khá · Nâng cao</label><div class="row">${e.levels.map((v,i)=>`<input class="in" style="width:80px" id="exL${i}" type="number" min="0" max="100" value="${v}" aria-label="${esc(UI.lv(i+1))}">`).join('')}</div></div>
  <div class="chips">${chk('exFig','Có câu hình',e.figure!==false)}${chk('exWord','Có bài toán lời văn',e.word!==false)}${chk('exSQ','Trộn câu',e.shuffleQ!==false)}${chk('exSO','Trộn đáp án',e.shuffleOpt!==false)}</div>
  <p class="muted small" id="exFixInfo" style="margin-top:8px">${st.exFixed.length?`Đề đang dùng danh sách <b>${st.exFixed.length}</b> câu cố định.`:'Đề tạo ngẫu nhiên từ ngân hàng mỗi lần thi.'} <button class="btn sm" data-a="exFix">Chốt danh sách câu</button> <button class="btn sm" data-a="exUnfix">Bỏ danh sách cố định</button></p>
  <div id="qeMsg" class="note hide" role="alert"></div><div class="row" style="justify-content:flex-end"><button class="btn" data-a="closeModal">Hủy</button><button class="btn primary" data-a="exSave">💾 Lưu</button></div>`); }
function exRead(){ const old=st.editExNew?null:S.exams.find(x=>x.id===st.editEx); return {id:old?old.id:U.uid('EX'),title:$('exTitle').value.trim(),grade:3,desc:$('exDesc').value.trim(),count:parseInt($('exCount').value,10),minutes:parseInt($('exMin').value,10),topics:S.content.topics.filter(t=>$('exT_'+t.id).checked).map(t=>t.id),levels:[0,1,2,3,4].map(i=>parseFloat($('exL'+i).value)||0),figure:$('exFig').checked,word:$('exWord').checked,shuffleQ:$('exSQ').checked,shuffleOpt:$('exSO').checked,questionIds:st.exFixed,status:$('exStatus').value,mini:old?old.mini:false,createdAt:old?old.createdAt:Date.now(),updatedAt:Date.now()}; }
A.exFix=()=>{ const d=exRead(); const e=T3.Exam.validateDef(d); if(e.length){ const m=$('qeMsg'); m.className='note bad'; m.innerHTML=e.map(esc).join('<br>'); return; } d.questionIds=[]; const qs=T3.Exam.build(d); st.exFixed=qs.map(q=>q.id); $('exFixInfo').innerHTML=`Đã chốt <b>${st.exFixed.length}</b> câu cố định (lưu đề để áp dụng).`; };
A.exUnfix=()=>{ st.exFixed=[]; $('exFixInfo').innerHTML='Đã bỏ danh sách cố định (lưu đề để áp dụng).'; };
A.exSave=()=>{ const d=exRead(); const e=T3.Exam.validateDef(d); if(d.status==='published'&&!d.questionIds.length){ const have=Pool.filter({topics:d.topics,figure:d.figure,word:d.word}).length; if(have<d.count) e.push('Ngân hàng chỉ có '+have+' câu Published phù hợp, ít hơn '+d.count+' câu.'); } if(e.length){ const m=$('qeMsg'); m.className='note bad'; m.innerHTML=e.map(esc).join('<br>'); return; }
  if(st.editExNew) S.exams.push(d); else S.exams[S.exams.findIndex(x=>x.id===d.id)]=d; T3.Data.exam(d); UI.closeModal(); UI.toast('Đã lưu đề thi','ok'); reload(); };

A.examDel=el=>UI.confirm({title:'Xóa đề thi?',body:'<p>Đề thi sẽ bị xóa (kết quả đã làm vẫn được giữ).</p>',danger:true,ok:'Xóa',onOk:()=>{ S.exams=S.exams.filter(e=>e.id!==el.dataset.v); T3.Data.examDel(el.dataset.v); reload(); }});

A.examExp=el=>{ const e=S.exams.find(x=>x.id===el.dataset.v); UI.download('toan-lop-3-de-'+e.id+'.json',JSON.stringify({app:'toan-lop-3',type:'exams',exams:[e]},null,1)); };

A.stuDel=el=>UI.confirm({title:'Xóa học sinh?',body:'<p>Hồ sơ cùng toàn bộ lịch sử và câu sai của học sinh này sẽ bị xóa.</p>',danger:true,ok:'Xóa',onOk:()=>{ T3.Student.remove(el.dataset.v); reload(); }});

  <div class="row"><div class="field grow"><label for="aiTopic">Chuyên đề</label>${sel('aiTopic',S.content.topics.map(t=>[t.id,t.name]),f.topic,'data-c="aiTopic"')}</div><div class="field grow"><label for="aiLesson">Bài học</label>${sel('aiLesson',[['','Tất cả bài học']].concat(tp.lessons.map(l=>[l.id,l.name])),f.lesson)}</div><div class="field"><label for="aiCount">Số lượng</label><input id="aiCount" type="number" min="1" max="30" value="${f.count}" style="width:100px"></div></div>
