C.aiTopic=el=>{ const f=adm().ai; f.topic=el.value; f.lesson=''; reload(); };
A.aiGen=async()=>{ const f=adm().ai; f.topic=$('aiTopic').value; f.lesson=$('aiLesson').value; f.count=Math.max(1,Math.min(30,parseInt($('aiCount').value,10)||5)); f.dist=[0,1,2,3,4].map(i=>parseFloat($('aiL'+i).value)||0); if(f.dist.reduce((a,b)=>a+b,0)<=0){ UI.toast('Tỷ lệ mức độ không hợp lệ','bad'); return; }
  const b=$('aiBtn'), m=$('aiMsg'); b.disabled=true; m.textContent=T3.AI.available?'Claude đang soạn câu hỏi… (có thể mất vài chục giây)':'Đang tạo…'; try{ const r=await T3.AI.generate({topic:f.topic,lesson:f.lesson,count:f.count,dist:f.dist}); S.questions=S.questions.concat(r.added); await T3.Data.qMany(r.added); UI.toast('Đã tạo '+r.added.length+' câu ở trạng thái Draft'+(r.note?'. '+r.note:''),'ok'); }catch(e){ UI.toast('Không tạo được câu hỏi: '+e.message,'bad'); } reload(); };
A.qToReview=el=>{ const q=S.questions.find(x=>x.id===el.dataset.v); q.status='review'; q.updatedAt=Date.now(); T3.Data.q(q); reload(); };
A.qApprove=el=>{ const q=S.questions.find(x=>x.id===el.dataset.v); const v=Verify.question(q); if(!v.ok){ UI.toast('Chưa thể Publish: '+v.errors[0],'bad'); return; } q.status='published'; q.updatedAt=Date.now(); T3.Data.q(q); UI.toast('Đã Publish. Câu hỏi đã có trong ngân hàng sử dụng.','ok'); reload(); };

/* ---- Learning Center ---- */
AM.learning=()=>`<div class="card"><h2>🗂️ Learning Center</h2><p class="muted">Quy trình: Tài liệu → Phân tích → Tạo kiến thức → Tạo câu hỏi → Giáo viên duyệt → Đưa vào ngân hàng. Hỗ trợ TXT, Markdown, CSV, JSON, hình ảnh và văn bản dán trực tiếp.</p>
  ${fld('Tiêu đề tài liệu','<input id="dcTitle" maxlength="100">','dcTitle')}${fld('Nội dung (dán văn bản, ví dụ: các phép tính "12 + 5 = 17" hoặc "H: câu hỏi | Đ: đáp án")','<textarea id="dcText" rows="5"></textarea>','dcText')}<div class="row"><button class="btn primary" data-a="docAddText">➕ Thêm tài liệu</button><label class="btn">📎 Tải tệp<input type="file" id="dcFile" data-c="docFile" accept=".txt,.md,.csv,.json,image/*,.pdf,.docx,.pptx" hidden></label></div><p id="dcMsg" class="muted" aria-live="polite"></p></div>
  <div class="card"><h3>Tài liệu (${S.docs.length})</h3>${S.docs.length?S.docs.map(d=>`<div class="card flat"><div class="row"><b class="grow">${esc(d.title)} <span class="pill">${esc(d.kind)}</span> <span class="pill ${d.published?'ok':''}">${d.published?'Hiển thị cho học sinh':'Ẩn'}</span></b><button class="btn sm" data-a="docTog" data-v="${d.id}">${d.published?'Ẩn':'Hiện'}</button>${d.kind!=='image'?`<button class="btn sm good" data-a="docAnalyze" data-v="${d.id}">🔬 Phân tích</button>`:''}<button class="btn sm danger" data-a="docDel" data-v="${d.id}">🗑</button></div>${d.kind==='image'?`<img alt="${esc(d.title)}" src="${esc(d.data)}" style="max-width:240px;margin-top:6px">`:`<div class="small muted" style="white-space:pre-wrap;max-height:5.5em;overflow:hidden">${esc((d.text||'').slice(0,300))}</div>`}</div>`).join(''):'<p class="muted">Chưa có tài liệu.</p>'}</div>`;
A.docAddText=()=>{ const t=$('dcTitle').value.trim()||'Tài liệu '+U.dateTime(Date.now()), x=$('dcText').value; if(!x.trim()){ $('dcMsg').textContent='Hãy nhập hoặc dán nội dung.'; return; } const d={id:U.uid('DOC'),title:t,kind:'text',text:x,published:false,createdAt:Date.now()}; S.docs.push(d); T3.Data.doc(d); reload(); };
C.docFile=async el=>{ const f=el.files[0]; if(!f) return; const m=$('dcMsg'); const n=f.name.toLowerCase(); try{
  if(/\.(pdf|docx|pptx)$/.test(n)){ m.textContent='Môi trường này chưa đọc được tệp PDF, DOCX, PPTX. Hãy mở tệp, sao chép nội dung và dán vào ô văn bản bên trên.'; return; }
  if(/^image\//.test(f.type)){ if(f.size>1500000){ m.textContent='Hình quá lớn (tối đa 1,5 MB).'; return; } const data=await UI.readFile(f,'url'); const d={id:U.uid('DOC'),title:f.name,kind:'image',data,published:false,createdAt:Date.now()}; S.docs.push(d); await T3.Data.doc(d); reload(); return; }
  if(f.size>2000000){ m.textContent='Tệp quá lớn (tối đa 2 MB).'; return; } const text=await UI.readFile(f,'text'); const kind=/\.csv$/.test(n)?'csv':/\.json$/.test(n)?'json':/\.md$/.test(n)?'markdown':'text'; const d={id:U.uid('DOC'),title:f.name,kind,text,published:false,createdAt:Date.now()}; S.docs.push(d); await T3.Data.doc(d); reload(); }catch(e){ m.textContent='Không đọc được tệp: '+e.message; } };
A.docTog=el=>{ const d=S.docs.find(x=>x.id===el.dataset.v); d.published=!d.published; T3.Data.doc(d); reload(); };
A.docDel=el=>UI.confirm({title:'Xóa tài liệu?',body:'<p>Tài liệu sẽ bị xóa.</p>',danger:true,ok:'Xóa',onOk:()=>{ S.docs=S.docs.filter(d=>d.id!==el.dataset.v); T3.Data.docDel(el.dataset.v); reload(); }});
A.docAnalyze=el=>{ const d=S.docs.find(x=>x.id===el.dataset.v); let qs=[],rej=[],know=''; try{ if(d.kind==='csv'||d.kind==='json'){ const rows=IO.parseQuestionFile(d.text,d.title); const r=IO.importQuestions(rows,{forceDraft:true}); qs=r.added; rej=r.skipped.map(s=>'Dòng '+s.row+': '+s.reasons.join('; ')); } else { const r=T3.Learn.analyze(d.text); qs=r.questions; rej=r.rejected; know=r.knowledge; } }catch(e){ rej=['Không phân tích được: '+e.message]; }
  st.docQs=qs; UI.modal(`<h2>Kết quả phân tích: ${esc(d.title)}</h2>${know?`<div class="card flat"><h3>Kiến thức trích ra</h3><div style="white-space:pre-wrap">${esc(know)}</div></div>`:''}<p>Tạo được <b>${qs.length}</b> câu hỏi nháp.${rej.length?` Có <b>${rej.length}</b> dòng bị loại:`:''}</p>${rej.length?`<ul class="small">${rej.slice(0,10).map(r=>'<li>'+esc(r)+'</li>').join('')}</ul>`:''}${qs.length?`<ol class="small" style="max-height:30vh;overflow:auto">${qs.slice(0,30).map(q=>'<li>'+esc(String(q.question).slice(0,80))+'</li>').join('')}</ol>`:''}<div class="row" style="justify-content:flex-end"><button class="btn" data-a="closeModal">Đóng</button>${qs.length?`<button class="btn primary" data-a="docAddQs">Thêm ${qs.length} câu vào ngân hàng (Draft)</button>`:''}</div>`); };
A.docAddQs=()=>{ const qs=st.docQs||[]; S.questions=S.questions.concat(qs); T3.Data.qMany(qs); UI.closeModal(); UI.toast('Đã thêm '+qs.length+' câu vào ngân hàng ở trạng thái Draft. Hãy duyệt trong mục AI tạo câu hỏi.','ok'); reload(); };

/* ---- Import / Export ---- */
AM.io=()=>`<div class="card"><h2>📤 Export</h2><div class="row"><button class="btn" data-a="exportQ" data-v="json">Câu hỏi (JSON)</button><button class="btn" data-a="exportQ" data-v="csv">Câu hỏi (CSV)</button><button class="btn" data-a="ioExp" data-v="content">Chuyên đề (JSON)</button><button class="btn" data-a="ioExp" data-v="exams">Đề thi (JSON)</button><button class="btn" data-a="ioExp" data-v="students">Học sinh (JSON)</button><button class="btn" data-a="ioExp" data-v="history">Lịch sử (JSON)</button><button class="btn" data-a="histCSV" data-sid="">Kết quả/Lịch sử (CSV)</button></div><p class="muted small">Excel: tệp CSV (UTF-8) mở trực tiếp bằng Excel. Môi trường này không nạp thư viện .xlsx nên dùng CSV thay thế.</p></div>
  <div class="card"><h2>📥 Import</h2><div class="field"><label for="ioKind">Loại dữ liệu</label>${sel('ioKind',[['questions','Câu hỏi (JSON hoặc CSV)'],['content','Chuyên đề (JSON)'],['exams','Đề thi (JSON)'],['students','Học sinh (JSON)'],['history','Lịch sử (JSON)']],adm().ioKind||'questions','data-c="ioKindSet"')}</div><div class="row"><label class="btn">📎 Chọn tệp<input type="file" id="ioFile" data-c="ioFile" accept=".json,.csv,.txt" hidden></label><button class="btn" data-a="ioTemplate">📄 Tải mẫu CSV</button></div>${fld('…hoặc dán nội dung vào đây','<textarea id="ioPaste" rows="5" placeholder="[ { &quot;id&quot;: &quot;T3-001&quot;, … } ]"></textarea>','ioPaste')}<button class="btn primary" data-a="ioPasteGo">Nhập từ ô văn bản</button><div id="ioOut" aria-live="polite" style="margin-top:12px"></div><p class="muted small">Câu hỏi nhập vào chỉ được Published nếu vượt qua kiểm tra tự động; câu lỗi sẽ chuyển thành Draft kèm lý do. Hãy sao lưu trước khi nhập.</p></div>`;
C.ioKindSet=el=>{ adm().ioKind=el.value; };
A.ioExp=el=>{ const k=el.dataset.v, d=U.dayKey(Date.now()); const m={content:[S.content,'chuyen-de'],exams:[{app:'toan-lop-3',type:'exams',exams:S.exams},'de-thi'],students:[{app:'toan-lop-3',type:'students',students:S.students},'hoc-sinh'],history:[{app:'toan-lop-3',type:'history',sessions:S.sessions,mistakes:S.mistakes},'lich-su']}[k]; UI.download('toan-lop-3-'+m[1]+'-'+d+'.json',JSON.stringify(m[0],null,1)); };
A.ioTemplate=()=>UI.download('mau-nhap-cau-hoi.csv','\uFEFF'+IO.toCSV([IO.qHeader,['T3-MAU-1','PHEP_TINH','cong','mc','1','235 + 124 = ?','359','349','369','339','A','235 + 124 = 359.','Cộng từ phải sang trái','Giáo viên','','published']]));
C.ioFile=async el=>{ const f=el.files[0]; if(!f) return; if(f.size>8000000){ $('ioOut').innerHTML='<p class="note bad">Tệp quá lớn (tối đa 8 MB).</p>'; return; } try{ ioRun(await UI.readFile(f,'text'),f.name); }catch(e){ $('ioOut').innerHTML='<p class="note bad">❌ Không thể nhập dữ liệu.<br>Lý do: '+esc(e.message)+'</p>'; } };
A.ioPasteGo=()=>{ const t=$('ioPaste').value; if(!t.trim()){ $('ioOut').innerHTML='<p class="note bad">Hãy dán nội dung trước.</p>'; return; } ioRun(t,'paste.json'); };
function ioErr(e){ $('ioOut').innerHTML=`<div class="note bad" role="alert">❌ <b>Không thể nhập dữ liệu</b><br>Lý do: ${esc(/JSON/.test(e.message)?'Tệp JSON không đúng cấu trúc.':e.message)}<details><summary class="small">Technical Details</summary><pre class="small" style="white-space:pre-wrap">${esc(e.stack||e.message)}</pre></details></div>`; }
async function ioRun(text,name){ const kind=($('ioKind')||{}).value||'questions'; const out=$('ioOut'); try{
  if(kind==='questions'){ const rows=IO.parseQuestionFile(text,name); const r=IO.importQuestions(rows); S.questions=S.questions.concat(r.added); await T3.Data.qMany(r.added); const pub=r.added.filter(q=>q.status==='published').length, bad=r.added.filter(q=>q.importErrors&&q.importErrors.length);
    out.innerHTML=`<div class="note ok">✅ Đã nhập <b>${r.added.length}</b> câu (Published: ${pub}, Draft/khác: ${r.added.length-pub}). Bị loại: ${r.skipped.length}.</div>${bad.length?`<div class="note">🟡 ${bad.length} câu bị chuyển thành Draft do lỗi:<ul class="small">${bad.slice(0,8).map(q=>'<li>'+esc(String(q.question).slice(0,50))+': '+esc(q.importErrors.join('; '))+'</li>').join('')}</ul></div>`:''}${r.skipped.length?`<ul class="small">${r.skipped.slice(0,8).map(s=>'<li>Dòng '+s.row+': '+esc(s.reasons.join('; '))+'</li>').join('')}</ul>`:''}`; }
  else { const j=JSON.parse(text); if(kind==='content'){ if(!j||!Array.isArray(j.topics)||j.topics.some(t=>!t.id||!t.name||!Array.isArray(t.lessons))) throw new Error('Dữ liệu chuyên đề thiếu id, name hoặc lessons'); S.content=j; await T3.Data.content(); out.innerHTML='<div class="note ok">✅ Đã nhập chuyên đề.</div>'; }
    else if(kind==='exams'){ const a=j.exams||(Array.isArray(j)?j:null); if(!a) throw new Error('Cần có khóa "exams"'); const ok=a.filter(e=>!T3.Exam.validateDef(e).length).map(e=>Object.assign({},e,{id:S.exams.some(x=>x.id===e.id)?U.uid('EX'):e.id,status:'draft'})); S.exams=S.exams.concat(ok); await DBput('exams',ok); out.innerHTML=`<div class="note ok">✅ Đã nhập ${ok.length}/${a.length} đề (ở trạng thái Draft).</div>`; }
    else if(kind==='students'){ const a=j.students||(Array.isArray(j)?j:null); if(!a) throw new Error('Cần có khóa "students"'); let n=0; a.forEach(s=>{ if(s&&s.name&&!S.students.some(x=>x.id===s.id)){ S.students.push(Object.assign({badges:{},grade:3,avatar:'🐰'},s)); n++; } }); T3.Data.saveStudents(); out.innerHTML=`<div class="note ok">✅ Đã nhập ${n} học sinh.</div>`; }
    else if(kind==='history'){ const a=j.sessions||[]; const ids=new Set(S.sessions.map(x=>x.id)); const add=a.filter(x=>x&&x.id&&!ids.has(x.id)&&Array.isArray(x.items)); S.sessions=S.sessions.concat(add).sort((p,q)=>p.ts-q.ts); await T3.DB.putMany('sessions',add); (j.mistakes||[]).forEach(m=>{ if(m&&m.id&&!S.mistakes.some(x=>x.id===m.id)){ S.mistakes.push(m); T3.Data.mistake(m); } }); out.innerHTML=`<div class="note ok">✅ Đã nhập ${add.length} dòng lịch sử.</div>`; } } }catch(e){ ioErr(e); } }
const DBput=(s,a)=>T3.DB.putMany(s,a);

/* ---- Backup / Restore ---- */
AM.backup=()=>`<div class="card"><h2>💾 Sao lưu toàn bộ (Full Backup)</h2><p>Gồm: cấu hình, chuyên đề, câu hỏi, đề thi, hồ sơ, lịch sử, câu sai, thành tích, tài liệu. <b>Không</b> lưu khóa API hoặc thông tin nhạy cảm.</p><button class="btn primary" data-a="bkMake">💾 Tạo tệp sao lưu</button></div>
  <div class="card"><h2>♻️ Khôi phục (Restore)</h2><p class="muted">Dữ liệu hiện tại sẽ được thay bằng dữ liệu trong tệp sao lưu.</p><div class="row"><label class="btn">📎 Chọn tệp sao lưu<input type="file" id="bkFile" data-c="bkFile" accept=".json" hidden></label></div>${fld('…hoặc dán nội dung tệp vào đây','<textarea id="bkPaste" rows="4"></textarea>','bkPaste')}<button class="btn" data-a="bkPasteGo">Khôi phục từ ô văn bản</button><div id="bkOut" aria-live="polite" style="margin-top:10px"></div></div>
  <div class="card"><h2>🧪 Bộ câu hỏi mẫu</h2><div class="row"><button class="btn" data-a="sampleLoad">Tải lại bộ mẫu (thêm các câu còn thiếu)</button><button class="btn danger" data-a="sampleDel">Xóa bộ mẫu</button></div><p class="muted small">Nên tạo bản sao lưu trước khi thay đổi.</p></div>
  <div class="card" style="border-color:var(--bad)"><h2>⚠️ Factory Reset</h2><div class="row"><button class="btn danger" data-a="resetSample">Khôi phục dữ liệu mẫu</button><button class="btn danger" data-a="resetWipe">Xóa toàn bộ dữ liệu cục bộ</button></div></div>`;
A.bkMake=()=>UI.download(T3.Backup.filename(),JSON.stringify(T3.Backup.make()));
C.bkFile=async el=>{ const f=el.files[0]; if(!f) return; try{ bkAsk(await UI.readFile(f,'text')); }catch(e){ $('bkOut').innerHTML='<p class="note bad">Không đọc được tệp: '+esc(e.message)+'</p>'; } };
A.bkPasteGo=()=>bkAsk($('bkPaste').value);
function bkAsk(text){ let o; try{ o=JSON.parse(text); }catch(e){ $('bkOut').innerHTML='<div class="note bad">❌ Không thể khôi phục.<br>Lý do: tệp JSON không đúng cấu trúc.</div>'; return; } const err=T3.Backup.validate(o); if(err.length){ $('bkOut').innerHTML='<div class="note bad">❌ Tệp sao lưu không hợp lệ:<ul>'+err.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul></div>'; return; }
  UI.confirm({title:'Khôi phục dữ liệu?',body:`<p>Tệp có <b>${o.questions.length}</b> câu hỏi, <b>${o.students.length}</b> học sinh, <b>${o.sessions.length}</b> lượt làm bài. Dữ liệu hiện tại sẽ bị thay thế.</p>`,danger:true,ok:'Khôi phục',onOk:async()=>{ const r=await T3.Backup.restore(o); if(r.ok){ UI.toast('Đã khôi phục dữ liệu','ok'); UI.go('/admin/dash'); } else $('bkOut').innerHTML='<div class="note bad">'+r.errors.map(esc).join('<br>')+'</div>'; }}); }
A.sampleLoad=async()=>{ const seed=QE.seed(); const ids=new Set(S.questions.map(q=>q.id)); const add=seed.filter(q=>!ids.has(q.id)); S.questions=S.questions.concat(add); await T3.Data.qMany(add); UI.toast('Đã thêm '+add.length+' câu mẫu','ok'); reload(); };
A.sampleDel=()=>UI.confirm({title:'Xóa bộ câu hỏi mẫu?',body:'<p>Các câu thuộc bộ mẫu sẽ bị xóa. Hãy sao lưu trước nếu cần.</p>',danger:true,ok:'Xóa bộ mẫu',onOk:async()=>{ const del=S.questions.filter(q=>q.source==='Bộ câu hỏi mẫu'); S.questions=S.questions.filter(q=>q.source!=='Bộ câu hỏi mẫu'); for(const q of del) await T3.Data.qDel(q.id); UI.toast('Đã xóa '+del.length+' câu mẫu','ok'); reload(); }});
function reset(mode){ UI.confirm({title:mode==='sample'?'Khôi phục dữ liệu mẫu?':'Xóa toàn bộ dữ liệu?',body:'<p><b>Toàn bộ hồ sơ, lịch sử, câu hỏi và cấu hình hiện tại sẽ bị xóa</b> và không thể hoàn tác. Hãy tạo bản sao lưu trước.</p>',danger:true,ok:'Tôi hiểu, tiếp tục',onOk:async()=>{ T3.Timer.stopAll(); T3.LS.del('active'); UI.ses=null; await T3.Backup.factory(mode); st.adminOK=false; UI.toast('Đã đặt lại dữ liệu','ok'); UI.go('/'); }}); }
A.resetSample=()=>reset('sample'); A.resetWipe=()=>reset('wipe');

/* ---- Cấu hình ---- */
AM.config=()=>{ const c=adm().cfDraft||S.cfg; const a=c.arena;
  return `<div class="card"><h2>⚙️ Cấu hình ứng dụng</h2>${fld('Tên ứng dụng',`<input id="cfName" maxlength="120" value="${esc(c.appName)}">`,'cfName')}<div class="row"><div class="field"><label for="cfLogo">Biểu tượng</label><input id="cfLogo" maxlength="4" value="${esc(c.logo)}" style="width:90px"></div><div class="field"><label for="cfColor">Màu chủ đạo</label><input id="cfColor" type="color" value="${esc(c.color)}"></div><div class="field grow"><label for="cfSchool">Tên trường / đơn vị</label><input id="cfSchool" value="${esc(c.school||'')}"></div></div>${fld('Mô tả',`<input id="cfDesc" value="${esc(c.desc||'')}">`,'cfDesc')}${fld('Chân trang (footer)',`<input id="cfFoot" value="${esc(c.footer||'')}">`,'cfFoot')}
  <h3>Tên các mức độ</h3><div class="row">${c.levelNames.map((n,i)=>`<input class="in" style="width:140px" id="cfLv${i}" value="${esc(n)}" aria-label="Mức ${i+1}">`).join('')}</div>
  <h3 style="margin-top:14px">Xếp loại (điểm tối thiểu → nhãn)</h3>${c.grading.map((g,i)=>`<div class="row" style="margin-bottom:6px"><input class="in gr-min" type="number" step="0.1" min="0" max="10" style="width:100px" value="${g.min}" aria-label="Điểm tối thiểu"><input class="in gr-lab grow" value="${esc(g.label)}" aria-label="Nhãn xếp loại"><button class="btn sm danger" data-a="cfDelGrade" data-v="${i}" aria-label="Xóa dòng">✕</button></div>`).join('')}<button class="btn sm" data-a="cfAddGrade">➕ Thêm mức xếp loại</button>
  <h3 style="margin-top:14px">Tính năng</h3><div class="chips">${chk('cfSound','Âm thanh',c.sound)}${chk('cfLeader','Bảng xếp hạng',c.leaderboard)}${chk('cfAdv','Cho phép câu nâng cao',c.enableAdvanced)}${chk('cfFrac','Chuyên đề Phân số',c.enableFractions)}${chk('cfThink','Gợi ý từng bước (1 → 2 → lời giải)',c.selfThink)}${chk('cfAI','Trợ lý AI cho học sinh',c.aiStudent)}</div>
  <div class="row" style="margin-top:12px"><div class="field"><label for="cfQP">Điểm trừ khi sai (Tính nhanh)</label><input id="cfQP" type="number" min="0" max="10" value="${c.quickPenalty}" style="width:120px"></div><div class="field"><label for="cfAR">Số câu Đấu trường</label><input id="cfAR" type="number" min="3" max="50" value="${a.rounds}" style="width:110px"></div><div class="field"><label for="cfAT">Giây mỗi câu</label><input id="cfAT" type="number" min="5" max="60" value="${a.time}" style="width:110px"></div><div class="field"><label for="cfAP">Điểm trừ sai (Đấu trường)</label><input id="cfAP" type="number" min="0" max="20" value="${a.penalty}" style="width:120px"></div></div><div class="chips">${chk('cfAS','Đấu trường: bạn còn lại được quyền giành trả lời khi một bạn sai',a.steal)}</div>
  <h3 style="margin-top:14px">Đổi mã PIN quản trị</h3><div class="row"><input class="in" id="cfPo" type="password" inputmode="numeric" placeholder="PIN hiện tại" style="width:150px"><input class="in" id="cfPn" type="password" inputmode="numeric" placeholder="PIN mới (4–12 số)" style="width:170px"><input class="in" id="cfPn2" type="password" inputmode="numeric" placeholder="Nhập lại PIN mới" style="width:170px"></div><p class="muted small">PIN chỉ bảo vệ giao diện Admin trên máy này. Đây không phải cơ chế xác thực máy chủ chuyên nghiệp.</p>
  <div id="cfMsg" class="note hide" role="alert"></div><button class="btn primary big" data-a="cfSave">💾 Lưu cấu hình</button></div>`; };
function cfRead(){ const g=[]; root.document.querySelectorAll('.gr-min').forEach((e,i)=>{ g.push({min:parseFloat(e.value),label:(root.document.querySelectorAll('.gr-lab')[i]||{}).value||''}); }); return {appName:$('cfName').value.trim(),logo:$('cfLogo').value||'🐰',color:$('cfColor').value,school:$('cfSchool').value.trim(),desc:$('cfDesc').value.trim(),footer:$('cfFoot').value.trim(),levelNames:[0,1,2,3,4].map(i=>$('cfLv'+i).value.trim()),grading:g,sound:$('cfSound').checked,leaderboard:$('cfLeader').checked,enableAdvanced:$('cfAdv').checked,enableFractions:$('cfFrac').checked,selfThink:$('cfThink').checked,aiStudent:$('cfAI').checked,quickPenalty:parseInt($('cfQP').value,10),arena:{rounds:parseInt($('cfAR').value,10),time:parseInt($('cfAT').value,10),penalty:parseInt($('cfAP').value,10)||0,steal:$('cfAS').checked}}; }
A.cfAddGrade=()=>{ const d=Object.assign({},S.cfg,cfRead()); d.grading.push({min:0,label:'Mức mới'}); adm().cfDraft=d; reload(); };
A.cfDelGrade=el=>{ const d=Object.assign({},S.cfg,cfRead()); d.grading.splice(+el.dataset.v,1); adm().cfDraft=d; reload(); };
A.cfSave=()=>{ const m=$('cfMsg'); const show=(t,ok)=>{ m.className='note '+(ok?'ok':'bad'); m.innerHTML=t; };
  const patch=cfRead(); patch.grading.sort((x,y)=>y.min-x.min); const po=$('cfPo').value, pn=$('cfPn').value, pn2=$('cfPn2').value;
  if(po||pn||pn2){ if(T3.pinHash(po)!==S.cfg.pinHash) return show('PIN hiện tại chưa đúng.'); if(!/^\d{4,12}$/.test(pn)) return show('PIN mới cần từ 4 đến 12 chữ số.'); if(pn!==pn2) return show('Hai lần nhập PIN mới chưa giống nhau.'); patch.pinHash=T3.pinHash(pn); patch.pinDefault=false; }
  const r=T3.saveCfg(patch); if(!r.ok) return show('❌ '+r.errors.map(esc).join('<br>')); adm().cfDraft=null; UI.toast(r.warn||'Đã lưu và kiểm tra lại cấu hình','ok'); UI.render(); };

/* ---- Chẩn đoán hệ thống ---- */
AM.diag=()=>{ const rows=adm().diag; return `<div class="card"><h2>🔍 Kiểm tra hệ thống</h2><p class="muted">🟢 OK · 🟡 Cảnh báo · 🔴 Lỗi</p><div class="row"><button class="btn primary" data-a="diagRun">▶ Chạy kiểm tra</button><button class="btn" data-a="selfTest">🧪 Chạy 12 kịch bản kiểm thử</button></div><div id="diagOut" aria-live="polite" style="margin-top:12px">${rows?diagHTML(rows):'<p class="muted">Bấm "Chạy kiểm tra" để bắt đầu.</p>'}</div></div><div class="card"><h3>Nhật ký lỗi kỹ thuật (Technical Details)</h3>${T3.errors.length?`<details><summary>${T3.errors.length} mục</summary><pre class="small" style="white-space:pre-wrap">${esc(T3.errors.slice(-15).map(e=>U.dateTime(e.t)+' ['+e.where+'] '+e.msg+'\n'+e.stack).join('\n---\n'))}</pre></details>`:'<p class="muted">Chưa ghi nhận lỗi nào.</p>'}</div>`; };
const diagHTML=rows=>rows.map(r=>`<div class="diag"><span class="lamp ${r.s}">${r.s==='ok'?'🟢 OK':r.s==='warn'?'🟡 CẢNH BÁO':'🔴 LỖI'}</span><div><b>${esc(r.n)}</b><div class="small muted">${esc(r.m)}</div></div></div>`).join('');
A.diagRun=async()=>{ const rows=[]; const add=(n,s,m)=>{ rows.push({n,s,m}); const o=$('diagOut'); if(o) o.innerHTML=diagHTML(rows); };
  try{ T3.LS.set('diag',{t:1}); const ok=T3.LS.get('diag',null); T3.LS.del('diag'); try{ root.localStorage.setItem('t3:probe','1'); root.localStorage.removeItem('t3:probe'); add('LocalStorage',ok&&ok.t===1?'ok':'warn','Ghi và đọc lại thành công.'); }catch(e){ add('LocalStorage','warn','Trình duyệt chặn lưu trữ: cấu hình và hồ sơ chỉ lưu tạm trong phiên này.'); } }catch(e){ add('LocalStorage','err',e.message); }
  if(T3.DB.mode==='idb'){ try{ await T3.DB.put('meta',{id:'diag',v:42}); const all=await T3.DB.all('meta'); const f=all.find(x=>x.id==='diag'); await T3.DB.del('meta','diag'); add('IndexedDB',f&&f.v===42?'ok':'err',f&&f.v===42?'Ghi, đọc và xóa dữ liệu thử thành công.':'Đọc lại không khớp.'); }catch(e){ add('IndexedDB','err',e.message); } } else add('IndexedDB','warn','Đang dùng bộ nhớ tạm ('+(T3.DB.err||'không rõ lý do')+'). Dữ liệu lớn sẽ mất khi đóng trang; hãy thường xuyên Backup.');
  const bad=S.questions.filter(q=>q.status==='published'&&!Verify.question(q).ok).length, dup=Verify.bank(S.questions).dupIds.length; add('Ngân hàng câu hỏi',bad||dup?'err':'ok',`${S.questions.length} câu (Published: ${S.questions.filter(q=>q.status==='published').length}). Câu Published lỗi: ${bad}. Mã trùng: ${dup}.`);
  try{ const sample=S.questions.slice(0,5); const j=IO.importQuestions(JSON.parse(JSON.stringify(sample))); const c=IO.parseQuestionFile(IO.questionsCSV(sample),'x.csv'); const j2=IO.importQuestions(c); add('Import / Export',j.skipped.length||j2.skipped.length||j.added.length!==5||j2.added.length!==5?'warn':'ok','Vòng JSON và CSV: '+j.added.length+'/5 và '+j2.added.length+'/5 câu.'); }catch(e){ add('Import / Export','err',e.message); }
  add('File API',typeof root.FileReader!=='undefined'&&typeof root.Blob!=='undefined'?'ok':'err','FileReader và Blob '+(typeof root.FileReader!=='undefined'?'có sẵn.':'không có.'));
  try{ T3.Timer.stopAll(); const t=await new Promise(res=>{ let n=0; T3.Timer.start('diag',{ms:300,onTick:()=>{ n++; },onEnd:()=>res(n)}); }); add('Timer',t>=1&&T3.Timer.active()===0?'ok':'err','Timer chạy xong, không còn interval chạy ngầm.'); }catch(e){ add('Timer','err',e.message); }
  try{ let ok=0,tot=0; S.content.topics.forEach(t=>{ for(let d=1;d<=5;d++) for(let i=0;i<6;i++){ tot++; const q=QE.make({topic:t.id,difficulty:d},T3.R); if(q&&Verify.question(q).ok) ok++; } }); add('Random Engine',ok===tot?'ok':'warn',ok+'/'+tot+' câu tự sinh hợp lệ (chuyên đề tự thêm không có bộ sinh sẽ bị bỏ qua).'); }catch(e){ add('Random Engine','err',e.message); }
  try{ const C=T3.Calc; const t=[['35+25×2',85],['(35+25)×2',120],['56:7+3',11],['100-30-20',50],['12+8:4',14]].every(x=>C.eval(x[0])===x[1]); add('Calculation Engine',t&&C.readVN(4305)==='bốn nghìn ba trăm linh năm'?'ok':'err','Thứ tự phép tính và cách đọc số chính xác.'); }catch(e){ add('Calculation Engine','err',e.message); }
  try{ const r=T3.saveCfg({}); add('Cấu hình',r.ok?(r.warn?'warn':'ok'):'err',r.ok?(r.warn||'Quy trình Validate → Save → Đọc lại → Kiểm tra hoạt động.'):r.errors.join('; ')); }catch(e){ add('Cấu hình','err',e.message); }
  add('AI (Claude)',T3.AI.available?'ok':'warn',T3.AI.available?'Khả dụng qua quyền "sample".':'Chưa khả dụng. Hệ thống dùng Question Engine nội bộ.');
  try{ const dl=root.claude&&root.claude.use?await root.claude.use('downloads'):null; add('Tải tệp xuống',dl?'ok':'warn',dl?'Có thể lưu tệp Backup/Export.':'Không có quyền tải tệp: hệ thống sẽ hiện nội dung để sao chép.'); }catch(e){ add('Tải tệp xuống','warn','Không kiểm tra được.'); }
  try{ if(root.navigator.storage&&root.navigator.storage.estimate){ const e=await root.navigator.storage.estimate(); const pct=e.quota?e.usage/e.quota*100:0; add('Dung lượng lưu trữ',pct>80?'warn':'ok','Đã dùng '+(e.usage/1048576).toFixed(1)+' MB ('+pct.toFixed(1)+'%).'); } else add('Dung lượng lưu trữ','warn','Trình duyệt không cho biết dung lượng.'); }catch(e){ add('Dung lượng lưu trữ','warn','Không đọc được.'); }
  adm().diag=rows; };
A.selfTest=async()=>{ const o=$('diagOut'); o.innerHTML='<p>Đang chạy kiểm thử…</p>'; const r=await T3.selftest(); o.innerHTML=`<h3>Kết quả kiểm thử: ${r.filter(x=>x.ok).length}/${r.length} đạt</h3>`+diagHTML(r.map(x=>({n:x.n,s:x.ok?'ok':'err',m:x.m||(x.ok?'Đạt':'Không đạt')}))); };
})(typeof window!=='undefined'?window:globalThis);
/* ===== UI 5: KHỞI ĐỘNG ===== */
(function(root){
'use strict';
const T3=root.T3, UI=T3.UI, $=UI.$;
UI.init=async function(){
  try{
    if(T3.LS.get('big',false)) root.document.documentElement.classList.add('big');
    const info=await T3.boot();
    try{ await Promise.race([T3.AI.init(),new Promise(r=>setTimeout(r,1500))]); }catch(e){}
    UI.loadActive();
    UI.render();
  }catch(e){ T3.logErr(e,'init'); const a=$('app'); if(a) a.innerHTML='<div class="card"><h2>Ôi, ứng dụng chưa khởi động được</h2><p>Em hãy tải lại trang nhé. Nếu vẫn lỗi, nhờ thầy cô vào Admin › Chẩn đoán hệ thống.</p></div>'; }
};
if(root.document&&root.document.getElementById&&root.document.getElementById('app')&&!root.__T3_TEST) UI.init();
})(typeof window!=='undefined'?window:globalThis);
</script>
