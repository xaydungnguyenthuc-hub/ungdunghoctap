<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOÁN LỚP 3 – HỌC VUI – LUYỆN GIỎI – THI TỐT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--brand:#2F5BEA;--brand-ink:#fff;--paper:#F5F9FF;--grid:#D5E4F6;--ink:#1B2A57;--ink2:#46557F;--card:#FFFFFF;--line:#B9CCE6;--pen:#E5484D;--yellow:#FFC83D;--mint:#14916B;--violet:#6D4AEB;--ok:#0F7A55;--okbg:#DDF6EA;--bad:#B3261E;--badbg:#FDE4E2;--shadow:0 3px 0 rgba(27,42,87,.18);--r:18px;
  --f-d:'Baloo 2','Nunito','Segoe UI',ui-rounded,system-ui,sans-serif;--f-b:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121C38;--grid:#1F2F59;--ink:#EAF1FF;--ink2:#B4C3E8;--card:#1B2A52;--line:#3A4D82;--okbg:#0F3A2C;--badbg:#4A1E1E;--ok:#6EE0B2;--bad:#FF9C94;--shadow:0 3px 0 rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--paper:#121C38;--grid:#1F2F59;--ink:#EAF1FF;--ink2:#B4C3E8;--card:#1B2A52;--line:#3A4D82;--okbg:#0F3A2C;--badbg:#4A1E1E;--ok:#6EE0B2;--bad:#FF9C94;--shadow:0 3px 0 rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}html.big{font-size:20px}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--f-b);color:var(--ink);background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;min-height:100vh;line-height:1.5}
body::before{content:"";position:fixed;top:0;bottom:0;left:44px;width:2px;background:var(--pen);opacity:.45;pointer-events:none;z-index:0}
h1,h2,h3{font-family:var(--f-d);line-height:1.15;margin:0 0 .4em}
h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.15rem}
p{margin:.3em 0 .7em}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--yellow);outline-offset:2px;border-radius:10px}
#shell{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 16px 40px 60px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 0 10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0;flex:1 1 260px;background:none;border:0;cursor:pointer;text-align:left;padding:0}
.brand .logo{font-size:2rem;background:var(--yellow);border-radius:14px;width:52px;height:52px;display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.brand b{font-family:var(--f-d);font-size:1.02rem;line-height:1.1;display:block}
.top .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.iconbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;min-width:46px;height:46px;padding:0 12px;cursor:pointer;font-weight:800;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.iconbtn:hover{border-color:var(--brand)}
.who{display:flex;align-items:center;gap:8px}
.who .av{font-size:1.5rem}
.pts{background:var(--yellow);color:#3a2b00;font-weight:900;border-radius:999px;padding:4px 12px;border:2px solid #E0A800}
main{display:block;min-height:60vh}
.foot{margin-top:28px;font-size:.85rem;color:var(--ink2);text-align:center}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin:0 0 16px}
.card.flat{box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.muted{color:var(--ink2)}.small{font-size:.88rem}.center{text-align:center}.right{text-align:right}
.hide{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);border-bottom-width:5px;background:var(--card);color:var(--ink);border-radius:16px;padding:10px 20px;font-weight:900;font-size:1.02rem;cursor:pointer;min-height:50px;text-decoration:none;transition:transform .08s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(2px);border-bottom-width:3px}
.btn.primary{background:var(--brand);color:#fff;border-color:rgba(0,0,0,.45)}
.btn.good{background:var(--mint);color:#fff;border-color:rgba(0,0,0,.4)}
.btn.warn{background:var(--yellow);color:#3a2b00;border-color:#B88600}
.btn.danger{background:var(--pen);color:#fff;border-color:rgba(0,0,0,.4)}
.btn.sm{min-height:38px;padding:5px 12px;font-size:.92rem;border-bottom-width:4px}
.btn.big{min-height:60px;font-size:1.2rem;padding:12px 28px}
.btn[disabled],.btn.off{opacity:.45;cursor:not-allowed;transform:none}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:800;min-height:42px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip[aria-pressed="true"]::before{content:"✓"}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tile{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;border:3px solid rgba(0,0,0,.18);border-bottom-width:7px;border-radius:22px;padding:16px 16px 14px;color:#fff;cursor:pointer;min-height:132px;position:relative;font-family:var(--f-d);transition:transform .1s;width:100%}
.tile:hover{transform:translateY(-3px) rotate(-.6deg)}
.tile:active{transform:translateY(2px)}
.tile .ic{font-size:2.3rem;line-height:1}
.tile .tt{font-size:1.28rem;font-weight:800;line-height:1.1}
.tile .ds{font-family:var(--f-b);font-size:.86rem;font-weight:700;opacity:.95;line-height:1.25}
.tile .bd{position:absolute;top:10px;right:10px;background:#fff;color:var(--pen);border-radius:999px;font-weight:900;padding:2px 10px;font-family:var(--f-b);font-size:.9rem}
.t1{background:#2F5BEA}.t2{background:#14916B}.t3{background:#8A4FD8}.t4{background:#D9480F}.t5{background:#C2255C}.t6{background:#0B7285}.t7{background:#E8590C}.t8{background:#5F3DC4}
.topic{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-left-width:10px;border-radius:16px;padding:12px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow)}
.topic:hover{border-color:var(--brand)}
.topic .ic{font-size:1.9rem}
.topic b{font-family:var(--f-d);font-size:1.1rem;display:block;line-height:1.15}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--c,var(--mint)) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring i{font-style:normal;background:var(--card);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:900}
.bar{height:16px;background:var(--line);border-radius:99px;overflow:hidden;border:2px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .25s}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:900;background:var(--line);color:var(--ink)}
.pill.adv{background:var(--violet);color:#fff}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--yellow);color:#3a2b00}
.crumbs{font-size:.92rem;color:var(--ink2);margin:6px 0 10px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs button{background:none;border:0;color:var(--brand);font-weight:800;cursor:pointer;padding:0;text-decoration:underline}
.hello{font-family:var(--f-d);font-size:1.6rem}
.note{border-left:6px solid var(--yellow);background:var(--card);padding:10px 14px;border-radius:10px;margin:10px 0}
.note.ok{border-color:var(--mint)}.note.bad{border-color:var(--pen)}
/* câu hỏi */
.qhead{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.clock{font-family:var(--f-d);font-size:1.5rem;font-weight:800;background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:2px 14px}
.clock.low{background:var(--pen);color:#fff;border-color:#8c1f23;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.qbox{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:20px;box-shadow:6px 6px 0 rgba(27,42,87,.18)}
.qtext{font-family:var(--f-d);font-size:1.5rem;font-weight:700;line-height:1.35;margin:6px 0 14px;white-space:pre-line}
.fig{display:block;margin:6px auto 14px;max-width:100%;height:auto;background:rgba(127,160,210,.1);border-radius:14px;border:2px dashed var(--line)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--line);border-bottom-width:6px;background:var(--card);border-radius:18px;padding:12px 14px;font-size:1.25rem;font-weight:800;cursor:pointer;min-height:68px;width:100%}
.opt .lt{flex:none;width:40px;height:40px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-family:var(--f-d);font-weight:800}
.opt:hover{border-color:var(--brand)}
.opt[aria-pressed="true"]{border-color:var(--brand);background:rgba(47,91,234,.14)}
.opt[aria-pressed="true"] .lt{background:var(--brand);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .lt{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .lt{background:var(--bad);color:#fff}
.opt .mk{margin-left:auto;font-size:1.3rem}
.opts.tf{grid-template-columns:repeat(2,1fr)}
.fillrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fillrow input{font-family:var(--f-d);font-size:1.8rem;font-weight:800;border:3px solid var(--ink);border-radius:16px;padding:8px 14px;width:min(100%,260px);background:var(--card);text-align:center}
.fillrow .unit{font-weight:900;font-size:1.2rem}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--brand);margin:0 4px;vertical-align:baseline;height:1em}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .15em;font-size:.85em}
.frac>span:first-child{border-bottom:.12em solid currentColor;padding:0 .25em}
.zone{min-height:68px;border:3px dashed var(--line);border-radius:16px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;background:rgba(127,160,210,.08)}
.zone.drop{border-color:var(--brand);background:rgba(47,91,234,.1)}
.sc{border:3px solid var(--ink);border-bottom-width:6px;background:var(--card);border-radius:14px;padding:8px 14px;font-weight:900;font-size:1.15rem;cursor:grab;min-height:48px;max-width:100%}
.sc.in{background:#FFF3C4;color:#3a2b00;border-color:#B88600}
.sc .n{opacity:.6;font-size:.8rem;margin-right:6px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.mitem{display:flex;gap:8px;justify-content:space-between;align-items:center;width:100%;border:3px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:800;background:var(--card);cursor:pointer;margin-bottom:8px;min-height:50px;text-align:left}
.mitem[aria-pressed="true"]{border-color:var(--brand);background:rgba(47,91,234,.14)}
.mitem .as{color:var(--brand);font-weight:900}
.mitem.used{opacity:.5}
.fb{margin-top:14px;border-radius:18px;padding:14px 16px;border:3px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb h3{margin:0 0 6px}
.fb .ex{white-space:pre-line}
.hintbox{background:#FFF3C4;color:#3a2b00;border:2px solid #E0A800;border-radius:14px;padding:8px 12px;margin:8px 0;font-weight:700}
.navrow{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pal button{width:44px;height:44px;border-radius:12px;border:3px solid var(--line);background:var(--card);font-weight:900;cursor:pointer;position:relative}
.pal button.done{background:var(--brand);color:#fff;border-color:var(--brand)}
.pal button.done::after{content:"✓";position:absolute;right:2px;top:-2px;font-size:.7rem}
.pal button.cur{outline:4px solid var(--yellow);outline-offset:1px}
.legend{font-size:.85rem;color:var(--ink2)}
/* kết quả */
.redscore{font-family:var(--f-d);font-weight:800;color:var(--pen);font-size:4.6rem;line-height:1;transform:rotate(-5deg);display:inline-block;border:5px solid var(--pen);border-radius:50%;padding:18px 30px;margin:6px 10px}
.redscore small{font-size:1.6rem}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;text-align:center}
.stat b{display:block;font-family:var(--f-d);font-size:1.7rem;line-height:1.1}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:2px solid var(--line);vertical-align:top}
th{font-family:var(--f-d);font-size:.95rem}
.tw{overflow-x:auto;max-width:100%}
.badge{display:flex;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.badge .ic{font-size:2rem}.badge.lock{opacity:.5;filter:grayscale(1)}
/* form */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field>label{font-weight:900;font-size:.92rem}
.in,.field input,.field select,.field textarea{border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--card);width:100%;min-height:44px}
textarea.in,.field textarea{min-height:90px;resize:vertical}
.avgrid{display:flex;flex-wrap:wrap;gap:8px}
.avgrid button{font-size:1.9rem;width:56px;height:56px;border-radius:16px;border:3px solid var(--line);background:var(--card);cursor:pointer}
.avgrid button[aria-pressed="true"]{border-color:var(--brand);background:rgba(47,91,234,.16)}
/* admin */
.adm{display:grid;grid-template-columns:230px 1fr;gap:16px}
.adm nav{display:flex;flex-direction:column;gap:6px}
.adm nav button{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;font-weight:800;cursor:pointer;min-height:46px}
.adm nav button[aria-current="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.diag{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:2px solid var(--line)}
.lamp{flex:none;width:90px;text-align:center;font-weight:900;border-radius:999px;padding:2px 6px;font-size:.85rem}
.lamp.ok{background:var(--okbg);color:var(--ok)}.lamp.warn{background:#FFF3C4;color:#6b4e00}.lamp.err{background:var(--badbg);color:var(--bad)}
/* hộp thoại, thông báo */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:90;width:min(94vw,460px);pointer-events:none}
.toast{background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 16px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.3);pointer-events:auto}
.toast.ok{background:var(--ok);color:#fff}.toast.bad{background:var(--bad);color:#fff}
#modal{position:fixed;inset:0;background:rgba(10,18,40,.6);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:20px;width:min(100%,640px);max-height:90vh;overflow:auto}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;font-style:normal;font-size:1.6rem;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.qk{font-family:var(--f-d);font-size:clamp(3rem,12vw,6rem);font-weight:800;text-align:center;margin:10px 0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;margin:0 auto}
.pad button{min-height:64px;font-size:1.6rem;font-family:var(--f-d);font-weight:800;border-radius:16px;border:3px solid var(--ink);border-bottom-width:6px;background:var(--card);cursor:pointer}
.arena{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:14px}
.pl{border:3px solid var(--ink);border-radius:20px;padding:12px;background:var(--card);text-align:center}
.pl.on{background:var(--yellow);color:#3a2b00}
.pl .sc2{font-family:var(--f-d);font-size:2.6rem;font-weight:800}
.winner{font-family:var(--f-d);font-size:2.4rem;color:var(--pen)}
@media (max-width:760px){
  body::before{left:12px}
  #shell{padding:0 12px 40px 22px}
  .opts,.opts.tf{grid-template-columns:1fr}
  .adm{grid-template-columns:1fr}.adm nav{flex-direction:row;flex-wrap:wrap}
  .arena{grid-template-columns:1fr}
  .mrow{grid-template-columns:1fr}
  .qtext{font-size:1.25rem}.redscore{font-size:3.4rem}
  .brand b{font-size:.9rem}
}
@media print{body{background:#fff}body::before,.top,.foot{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="shell">
<div id="hdr"></div>
<main id="app" tabindex="-1"><div class="card center"><h2>Đang tải…</h2></div></main>
<div class="foot" id="foot"></div>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" role="presentation"></div>
<script>
/* ===== ENGINE 1: UTIL · STORAGE · CALC · RANDOM · CONTENT · VERIFY ===== */
(function(root){
'use strict';
const T3 = root.T3 = root.T3 || {};
T3.dry = false;
T3.errors = [];
T3.logErr = function(e, where){ try{ T3.errors.push({t:Date.now(), where:where||'', msg:String(e&&e.message||e), stack:String(e&&e.stack||'').split('\n').slice(0,4).join('\n')}); if(T3.errors.length>50) T3.errors.shift(); }catch(_){} };

/* ---------- UTIL ---------- */
const U = T3.U = {
  esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  uid(p){ return (p||'id')+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); },
  clone(o){ return JSON.parse(JSON.stringify(o)); },
  num(n){ n=Number(n); if(!isFinite(n)) return String(n); const neg=n<0; let s=String(Math.abs(Math.round(n))); if(s.length>=4) s=s.replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0'); return (neg?'-':'')+s; },
  score(x){ x=Number(x)||0; return String(Number(x.toFixed(2))).replace('.',','); },
  pct(x){ return Math.round((x||0)*100)+'%'; },
  pad(n){ return String(n).padStart(2,'0'); },
  dayKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+U.pad(d.getMonth()+1)+'-'+U.pad(d.getDate()); },
  dateTime(ts){ const d=new Date(ts); return U.pad(d.getDate())+'/'+U.pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+U.pad(d.getHours())+':'+U.pad(d.getMinutes()); },
  mmss(sec){ sec=Math.max(0,Math.round(sec)); return U.pad(Math.floor(sec/60))+':'+U.pad(sec%60); },
  hash(s){ let h=2166136261; s=String(s); for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(16); },
  norm(s){ return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().trim().replace(/\s+/g,' '); }
};

/* ---------- LocalStorage (có dự phòng bộ nhớ tạm) ---------- */
const K = 't3:';
const LS = T3.LS = { mem:{}, ok:true,

/* ---------- IndexedDB (có dự phòng bộ nhớ tạm) ---------- */
const DB = T3.DB = { mode:'memory', db:null, err:'', mem:{}, stores:['questions','exams','sessions','mistakes','docs','meta'],
  async init(){
    DB.stores.forEach(s=>{ DB.mem[s]=DB.mem[s]||{}; });
    try{
      if(!root.indexedDB) throw new Error('Trình duyệt không có IndexedDB');
      DB.db = await Promise.race([
        new Promise((res,rej)=>{ const rq=root.indexedDB.open('toan-lop-3',1);
          rq.onupgradeneeded=()=>{ const d=rq.result; DB.stores.forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'id'}); }); };
          rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error||new Error('Không mở được IndexedDB')); rq.onblocked=()=>rej(new Error('IndexedDB bị chặn')); }),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error('IndexedDB phản hồi quá chậm')),3000))
      ]);
      DB.mode='idb';
    }catch(e){ DB.mode='memory'; DB.err=String(e&&e.message||e); }
  },
  _r(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  _s(s,m){ return DB.db.transaction(s,m).objectStore(s); },
  async all(s){ if(DB.mode==='idb'){ try{ return await DB._r(DB._s(s,'readonly').getAll()); }catch(e){ DB.err=String(e); } } return Object.values(DB.mem[s]||{}); },
  async put(s,o){ if(T3.dry) return true; if(DB.mode!=='idb'){ DB.mem[s][o.id]=o; return true; } try{ await DB._r(DB._s(s,'readwrite').put(o)); return true; }catch(e){ DB.err=String(e); T3.logErr(e,'db.put'); return false; } },
  async putMany(s,arr){ if(T3.dry||!arr.length) return true; if(DB.mode!=='idb'){ arr.forEach(o=>{ DB.mem[s][o.id]=o; }); return true; }
    try{ await new Promise((res,rej)=>{ const t=DB.db.transaction(s,'readwrite'); const st=t.objectStore(s); arr.forEach(o=>st.put(o)); t.oncomplete=res; t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); return true; }catch(e){ DB.err=String(e); T3.logErr(e,'db.putMany'); return false; } },
  async del(s,id){ if(T3.dry) return true; if(DB.mode!=='idb'){ delete DB.mem[s][id]; return true; } try{ await DB._r(DB._s(s,'readwrite').delete(id)); return true; }catch(e){ DB.err=String(e); return false; } },
  async clear(s){ if(T3.dry) return true; if(DB.mode!=='idb'){ DB.mem[s]={}; return true; } try{ await DB._r(DB._s(s,'readwrite').clear()); return true; }catch(e){ DB.err=String(e); return false; } }
};

/* ---------- RANDOM ENGINE ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
T3.Rand = { make(seed){
  const f=mulberry32(seed==null?((Math.random()*4294967296)>>>0):(seed>>>0));
  const r={ f,
    int(a,b){ return a+Math.floor(f()*(b-a+1)); },
    pick(arr){ return arr[Math.floor(f()*arr.length)]; },
    shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(f()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; },
    chance(p){ return f()<p; },
    weighted(items,w){ let t=0; w.forEach(x=>t+=x); let x=f()*t; for(let i=0;i<items.length;i++){ x-=w[i]; if(x<=0) return items[i]; } return items[items.length-1]; }
  }; return r; } };
T3.R = T3.Rand.make();

/* ---------- CALCULATION ENGINE ---------- */
const D=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
function read3(n,full){ const h=Math.floor(n/100), t=Math.floor(n/10)%10, u=n%10, out=[];
  if(h>0||full) out.push(D[h]+' trăm');
  if(t===0){ if(u>0){ if(h>0||full) out.push('linh'); out.push(D[u]); } }
  else if(t===1){ out.push('mười'); if(u>0) out.push(u===5?'lăm':D[u]); }
  else { out.push(D[t]+' mươi'); if(u>0) out.push(u===1?'mốt':(u===5?'lăm':D[u])); }
  return out.join(' '); }
const Calc = T3.Calc = {
  eval(expr,loose){
    const s=String(expr).replace(/\u00A0/g,'').replace(/[x*]/g,'×').replace(/[\/÷]/g,':').replace(/[−–]/g,'-').replace(/\s+/g,'');
    let i=0;
    const num=()=>{ const j=i; while(i<s.length&&/\d/.test(s[i])) i++; if(j===i) throw new Error('Biểu thức sai cú pháp'); return parseInt(s.slice(j,i),10); };
    const factor=()=>{ if(s[i]==='('){ i++; const v=add(); if(s[i]!==')') throw new Error('Thiếu dấu ngoặc'); i++; return v; } return num(); };
    const term=()=>{ let v=factor(); while(s[i]==='×'||s[i]===':'){ const op=s[i++]; const r=factor(); if(op==='×') v*=r; else { if(r===0) throw new Error('Chia cho 0'); if(!loose&&v%r!==0) throw new Error('Phép chia không chia hết'); v/=r; } } return v; };
    const add=()=>{ let v=term(); while(s[i]==='+'||s[i]==='-'){ const op=s[i++]; const r=term(); v=op==='+'?v+r:v-r; } return v; };
    const v=add(); if(i!==s.length) throw new Error('Biểu thức sai cú pháp'); return v; },
  parseNum(x){ if(typeof x==='number') return x; let s=String(x==null?'':x).replace(/[\u00A0\s]/g,'').trim(); if(!s) return NaN;
    if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,''); else if(/^-?\d{1,3}(,\d{3})+$/.test(s)) s=s.replace(/,/g,''); else s=s.replace(',','.');
    return /^-?\d+(\.\d+)?$/.test(s)?Number(s):NaN; },
  firstNum(x){ const m=String(x==null?'':x).replace(/\u00A0/g,'').match(/-?\d+/); return m?parseInt(m[0],10):NaN; },
  readVN(n){ if(n===0) return 'không'; const th=Math.floor(n/1000), rest=n%1000; if(th>0){ let s=read3(th,false)+' nghìn'; if(rest>0) s+=' '+read3(rest,rest<100); return s; } return read3(rest,false); },
  toRoman(n){ return 'X'.repeat(Math.floor(n/10))+['','I','II','III','IV','V','VI','VII','VIII','IX'][n%10]; },
  readFrac(n,d){ return D[n]+' phần '+(d===4?'tư':D[d]); },
  same(given,expected,alts){ if(typeof expected==='number'){ const g=Calc.parseNum(given); return isFinite(g)&&g===expected; }
    const g=U.norm(given); if(!g) return false; return [expected].concat(alts||[]).some(e=>U.norm(e)===g); }
};

  calc(q,c,E){
    const optNums=()=>q.options.map(x=>Calc.firstNum(x));
    const given=()=>q.type==='mc'?Calc.firstNum(q.options[q.answer]):Calc.parseNum(q.answer);
    const uniqueNum=(v)=>{ if(q.type==='mc'&&optNums().filter(x=>x===v).length!==1) E.push('Có nhiều hơn 1 đáp án đúng hoặc không có đáp án đúng'); };

      const v=Calc.eval(c.expr,c.optIsExpr);

    }
    else if(c.max||c.min){ const arr=c.max||c.min; const v=c.max?Math.max.apply(null,arr):Math.min.apply(null,arr); if(given()!==v) E.push('Đáp án không phải số '+(c.max?'lớn':'bé')+' nhất'); }

    else if(c.cmp){ const [a,b,op]=c.cmp; const t=op==='>'?a>b:op==='<'?a<b:a===b; if((q.answer===0)!==t) E.push('Đáp án Đúng/Sai không khớp phép so sánh'); }

    else if(c.place){ const p=c.place, s=String(p.n); const k=s.length-1-s.indexOf(String(p.digit)); const names=['đơn vị','chục','trăm','nghìn','chục nghìn']; if(s.split(String(p.digit)).length!==2) E.push('Chữ số xuất hiện nhiều lần'); else if(p.kind==='name'){ if(q.options[q.answer]!==names[k]) E.push('Tên hàng chưa đúng'); } else if(Calc.firstNum(q.options[q.answer])!==p.digit*Math.pow(10,k)) E.push('Giá trị chữ số chưa đúng'); }

      if(c.ask!==undefined){ const g=q.type==='mc'?Calc.firstNum(q.options[q.answer]):Calc.parseNum(q.answer); if(g!==s[c.ask]) E.push('Số cần điền chưa đúng'); } }

    else if(c.sortvals){ const v=c.sortvals; if(v.length!==q.items.length) E.push('Số mục không khớp'); for(let i=1;i<v.length;i++){ if(c.dir==='desc'?v[i]>=v[i-1]:v[i]<=v[i-1]) E.push('Thứ tự đáp án chưa đúng'); } }
    else if(c.matchexpr){ q.pairs.forEach(p=>{ if(Calc.eval(p[0])!==Calc.parseNum(p[1])) E.push('Cặp ghép sai: '+p[0]+' ≠ '+p[1]); }); }

    else if(c.order){ /* logic: không tính lại được bằng số */ }
  },

  const p1=r.int(2,9)*1000, p2=r.int(2,9)*1000; if(p1===p2) throw new Error('eq'); const [n1,n2]=r.shuffle([['Bút',''],['Thước',''],['Cục tẩy',''],['Hộp màu','']]).slice(0,2).map(x=>x[0]);

add('HINH_HOC','nhan_dang',[1,5],['mc','tf','fill'],(r,d)=>{ const form=r.int(0,5); const all=['tam_giac','vuong','chu_nhat','tron'];

  return numQ(r,d,{text:txt,ans,wrongs:[3,4,5,2],calc:{fact:true},expl:`Đáp án đúng là ${ans}.`,hint:'Hãy hình dung hoặc vẽ hình đó ra.'}); });
add('HINH_HOC','chu_vi',[1,5],['mc','fill'],(r,d)=>{ const u=d<=3?'cm':'m'; const mx=d<=2?9:d<=3?30:60;
  if(d>=5){ if(r.chance(0.5)){ const s=r.int(3,25); return numQ(r,d,{text:`Hình vuông có chu vi ${s*4} cm. Cạnh của hình vuông dài bao nhiêu xăng-ti-mét?`,ans:s,wrongs:[s*4,s*2,s+4,s-1],calc:{expr:`${s*4}:4`,result:s},expl:`Cạnh hình vuông = chu vi : 4 = ${s*4} : 4 = ${s} cm.`,hint:'Hình vuông có 4 cạnh bằng nhau.',unit:'cm',adv:true}); }
    const a=r.int(8,30), b=r.int(3,a-1); return numQ(r,d,{text:`Hình chữ nhật có chu vi ${(a+b)*2} cm, chiều dài ${a} cm. Chiều rộng là bao nhiêu xăng-ti-mét?`,ans:b,wrongs:[a+b,b+1,b-1,(a+b)*2-a],calc:{expr:`${(a+b)*2}:2-${a}`,result:b},expl:`Nửa chu vi = ${(a+b)*2} : 2 = ${a+b} cm. Chiều rộng = ${a+b} − ${a} = ${b} cm.`,hint:'Nửa chu vi = dài + rộng.',unit:'cm',adv:true}); }

  if(form===2){ const a=r.int(3,mx),b=r.int(3,mx),c=r.int(3,mx); if(!(a+b>c&&a+c>b&&b+c>a)) throw new Error('tri'); const P=a+b+c; return numQ(r,d,{text:`Tính chu vi hình tam giác có độ dài các cạnh là ${a} ${u}, ${b} ${u}, ${c} ${u}.`,ans:P,wrongs:[P+1,P-1,P*2,a*b*c%50],figure:{kind:'tri',a,b,c,unit:u},calc:{expr:`${a}+${b}+${c}`,result:P},expl:`Chu vi = ${a} + ${b} + ${c} = ${P} ${u}.`,hint:'Chu vi là tổng độ dài các cạnh.',unit:u}); }
  const a=r.int(12,60),b=r.int(5,a-1),P=(a+b)*2; return numQ(r,d,{text:`Một mảnh vườn hình chữ nhật có chiều dài ${a} m, chiều rộng ${b} m. Chu vi mảnh vườn là bao nhiêu mét?`,ans:P,wrongs:[a+b,a*b,P+2,P-4],calc:{expr:`(${a}+${b})*2`,result:P},expl:`Chu vi mảnh vườn = (${a} + ${b}) × 2 = ${P} m.`,hint:'Chu vi hình chữ nhật = (dài + rộng) × 2.',unit:'m'}); });
add('HINH_HOC','dien_tich',[1,5],['mc','fill'],(r,d)=>{

add('HINH_HOC','dem_hinh',[1,5],['mc','fill'],(r,d)=>{

add('PHAN_SO','nhan_biet',[1,5],['mc'],(r,d)=>{ const dd=r.int(2,d<=2?6:9), n=r.int(1,dd-1); const kind=r.chance(0.5)?'bar':'pie';

  let g=0; while(w.length<3&&g++<50){ const x=`${r.int(1,6)}/${r.int(3,9)}`; if(!set.has(x)){ set.add(x); w.push(x); } }

add('PHAN_SO','doc_viet_ps',[1,5],['mc','fill'],(r,d)=>{ const dd=r.int(2,9), n=r.int(1,dd-1), form=r.int(0,3);

  if(form===2){ const right=Calc.readFrac(n,dd); const set=new Set([right]),w=[]; [Calc.readFrac(dd,n),Calc.readFrac(n,Math.min(9,dd+1)),Calc.readFrac(Math.max(1,n-1),dd),Calc.readFrac(Math.min(9,n+1),dd)].forEach(x=>{ if(!set.has(x)&&w.length<3){ set.add(x); w.push(x); } }); let g=0; while(w.length<3&&g++<30){ const x=Calc.readFrac(r.int(1,8),r.int(2,9)); if(!set.has(x)){ set.add(x); w.push(x); } }
    const opts=r.shuffle([right].concat(w)); return {type:'mc',question:`Phân số ${n}/${dd} đọc là:`,options:opts,answer:opts.indexOf(right),calc:{fact:true},explanation:`${n}/${dd} đọc là "${right}".`,hint:'Đọc tử số, rồi chữ "phần", rồi mẫu số.'}; }
  const right=`${n}/${dd}`; const set=new Set([right]),w=[]; [`${dd}/${n}`,`${n}/${Math.min(9,dd+1)}`,`${Math.max(1,n-1)}/${dd}`,`${Math.min(8,n+1)}/${dd}`].forEach(x=>{ if(!set.has(x)&&w.length<3){ set.add(x); w.push(x); } }); let g=0; while(w.length<3&&g++<30){ const x=`${r.int(1,8)}/${r.int(2,9)}`; if(!set.has(x)){ set.add(x); w.push(x); } }
  const opts=r.shuffle([right].concat(w)); return {type:'mc',question:`Viết phân số: ${Calc.readFrac(n,dd)}`,options:opts,answer:opts.indexOf(right),calc:{fact:true},explanation:`"${Calc.readFrac(n,dd)}" viết là ${right}: tử số ${n}, mẫu số ${dd}.`,hint:'Số đứng trước chữ "phần" là tử số.'}; });
add('PHAN_SO','mot_phan',[1,5],['mc','fill'],(r,d)=>{ const n=r.int(2,d<=2?5:9), k=r.int(2,d<=2?9:12), p=n*k, word=d>=4&&r.chance(0.6);

/* === 8. TOÁN LỜI VĂN === */
function wp(r,d,o){ const q=numQ(r,d,{text:o.text,ans:o.ans,wrongs:o.wrongs,calc:{expr:o.expr,result:o.ans},expl:o.expl,hint:o.hint,unit:o.unit}); return q; }
add('TOAN_LOI_VAN','mot_buoc',[1,5],['mc','fill'],(r,d)=>{ const [A,B]=names2(r), t=thing(r), [lo,hi]=BIG(d); const a=r.int(lo,hi), b=r.int(lo,Math.min(hi,a)); const form=r.int(0,2);

add('TOAN_TU_DUY','so_bi_an',[1,5],['mc','fill'],(r,d)=>{ const x=r.int(2,d<=2?12:30), a=r.int(2,d<=2?5:9), b=r.int(2,20), form=d<=2?r.int(0,1):r.int(0,3); let text,eq,expl;

function shapeOdd(r,d){ const shp=['circle','square','tri','star']; const base=r.pick(shp), col=r.int(0,3); const diffShape=r.chance(0.5); const idx=r.int(0,3); const items=[]; for(let i=0;i<4;i++) items.push({s:base,c:col});

add('TOAN_LOI_VAN','rut_don_vi',[2,5],['mc','fill'],(r,d)=>{ const th=thing(r); const n=r.int(2,9), per=r.int(3,d<=3?9:15); let m=r.int(2,9); if(m===n) m=n%9+2; const total=n*per, ans=per*m;
  return numQ(r,d,{text:`${n} hộp như nhau đựng tất cả ${fmt(total)} ${th.n}. Hỏi ${m} hộp như vậy đựng bao nhiêu ${th.c}?`,ans,wrongs:[total*m,total+m,total-m,per],calc:{expr:`${total}:${n}*${m}`,result:ans},expl:`Bước 1: Mỗi hộp đựng: ${fmt(total)} : ${n} = ${per} ${th.c}.\nBước 2: ${m} hộp đựng: ${per} × ${m} = ${ans} ${th.c}.\nĐáp số: ${ans} ${th.c}.`,hint:'Tìm số đồ vật trong MỘT hộp trước.',unit:th.c}); });
add('TOAN_TU_DUY','so_bi_an',[1,5],['mc','fill'],(r,d)=>{ const a=r.int(2,5), k=r.int(2,6), x=r.pick([['cam','táo'],['dưa','cà chua'],['bí','củ cà rốt']]); return numQ(r,d,{text:`Cân thăng bằng: ${a} quả ${x[0]} nặng bằng ${a*k} quả ${x[1]}. Vậy 1 quả ${x[0]} nặng bằng mấy quả ${x[1]}?`,ans:k,wrongs:[a,a*k,k+1,k-1],calc:{expr:`${a*k}:${a}`,result:k},expl:`${a} quả ${x[0]} = ${a*k} quả ${x[1]}.\n1 quả ${x[0]} = ${a*k} : ${a} = ${k} quả ${x[1]}.`,hint:'Chia đều để tìm giá trị của một quả.',unit:'quả'}); });
add('TOAN_TU_DUY','nhieu_buoc',[3,5],['mc','fill'],(r,d)=>{ const x=r.int(6,12), p=x+r.int(20,30), y=r.int(3,9); const diff=p-x; return numQ(r,d,{text:`Năm nay An ${x} tuổi, bố của An ${p} tuổi. Hỏi sau ${y} năm nữa, bố hơn An bao nhiêu tuổi?`,ans:diff,wrongs:[diff+y,diff-y,p+y,x+y],calc:{expr:`(${p}+${y})-(${x}+${y})`,result:diff},expl:`Sau ${y} năm, bố ${p+y} tuổi, An ${x+y} tuổi.\nBố hơn An: ${p+y} − ${x+y} = ${diff} tuổi.\nHiệu số tuổi không thay đổi theo thời gian.`,hint:'Hiệu số tuổi giữa hai người không đổi.',unit:'tuổi',adv:d>=5}); },0.8);

const WPL=[]; const wp2=(l,f)=>WPL.push({l,f});
const T_add=(a,b,text,unit,why)=>({text,expr:`${a}+${b}`,unit,simple:[a,b,'+'],expl:`${why||'"Tất cả" nghĩa là gộp lại nên ta cộng.'}\n${fmt(a)} + ${fmt(b)} = ${fmt(a+b)}.\nĐáp số: ${fmt(a+b)} ${unit}.`,hint:'Gộp lại thì dùng phép cộng.'});
const T_sub=(a,b,text,unit,why)=>({text,expr:`${a}-${b}`,unit,simple:[a,b,'-'],expl:`${why||'Bớt đi, còn lại thì ta trừ.'}\n${fmt(a)} − ${fmt(b)} = ${fmt(a-b)}.\nĐáp số: ${fmt(a-b)} ${unit}.`,hint:'Bớt đi, còn lại, hơn kém thì dùng phép trừ.'});
const T_mul=(a,b,text,unit,why)=>({text,expr:`${a}*${b}`,unit,simple:[a,b,'*'],expl:`${why||'Nhiều nhóm bằng nhau thì ta nhân.'}\n${fmt(a)} × ${fmt(b)} = ${fmt(a*b)}.\nĐáp số: ${fmt(a*b)} ${unit}.`,hint:'Nhiều nhóm bằng nhau thì dùng phép nhân.'});

wp2('chia_deu',(r,d)=>{ const cap=r.int(4,9), q=r.int(3,d<=2?9:30), rm=r.int(1,cap-1), tot=cap*q+rm; return {text:`Có ${fmt(tot)} quả cam xếp vào các túi, mỗi túi ${cap} quả. Hỏi xếp được nhiều nhất bao nhiêu túi như vậy?`,ans:q,calc:{div:[tot,cap],part:'q'},unit:'túi',expl:`${fmt(tot)} : ${cap} = ${q} (dư ${rm}).\nXếp được nhiều nhất ${q} túi.`,hint:'Lấy thương của phép chia, bỏ số dư.'}; });

/* ---------- RUN (phiên làm bài) ---------- */
T3.Run={
  create(def){ const qs=def.questions; return {id:U.uid('RUN'),studentId:def.studentId,mode:def.mode,title:def.title,qs,ans:qs.map(()=>({given:null,ok:null,checked:false,hints:0,ms:0})),i:0,startedAt:Date.now(),deadline:def.durationSec?Date.now()+def.durationSec*1000:null,durationSec:def.durationSec||null,feedback:!!def.feedback,meta:def.meta||{},streak:0,best:0,done:false,qStart:Date.now()}; },
  check(ses,i){ const a=ses.ans[i], q=ses.qs[i]; const ok=Check.grade(q,a.given); if(ok===null) return null; a.checked=true; a.ok=ok;
    if(ok){ ses.streak++; ses.best=Math.max(ses.best,ses.streak); if(ses.mode==='mistakes') T3.Mist.fix(ses.studentId,q); } else { ses.streak=0; if(ses.feedback) T3.Mist.record(ses.studentId,q,a.given); }

    const sc=T3.Score.exam(items), st=T3.Student.get(ses.studentId), pt={}; items.forEach(it=>{ const p=pt[it.q.topic]||(pt[it.q.topic]={c:0,w:0}); if(it.ok===true) p.c++; else if(it.ok===false) p.w++; });
    const tps=Object.keys(pt); const rec={id:U.uid('KQ'),studentId:ses.studentId,studentName:st?st.name:'?',ts:Date.now(),mode:ses.mode,title:ses.title,topic:tps.length===1?tps[0]:'mixed',n:sc.n,correct:sc.correct,wrong:sc.wrong,blank:sc.blank,ratio:sc.ratio,score:sc.score,label:sc.label,timeSec:Math.round((Date.now()-ses.startedAt)/1000),points:sc.correct*10,perTopic:pt,items,streak:ses.best,meta:ses.meta,levels:Array.from(new Set(items.map(x=>x.q.difficulty))).sort()};

};

/* ---------- ANALYTICS ENGINE ---------- */
const An=T3.An={
  byTopic(sid,since){ const m={}; S.sessions.forEach(s=>{ if((sid&&s.studentId!==sid)||(since&&s.ts<since)) return; Object.keys(s.perTopic||{}).forEach(t=>{ const o=m[t]||(m[t]={c:0,w:0}); o.c+=s.perTopic[t].c; o.w+=s.perTopic[t].w; }); }); return m; },
  split(bt,min){ min=min||4; const arr=Object.keys(bt).map(t=>({topic:t,c:bt[t].c,w:bt[t].w,n:bt[t].c+bt[t].w,acc:bt[t].c/Math.max(1,bt[t].c+bt[t].w)})).filter(x=>x.n>=min&&Pool.topicOn(x.topic)||x.n>=min);
    return {weak:arr.filter(x=>x.acc<0.7).sort((a,b)=>a.acc-b.acc),strong:arr.filter(x=>x.acc>=0.8).sort((a,b)=>b.acc-a.acc),all:arr}; },
  stats(sid){ const ss=S.sessions.filter(s=>s.studentId===sid); let n=0,c=0; ss.forEach(s=>{ n+=s.n; c+=s.correct; }); const scored=ss.filter(s=>s.mode!=='quick'&&s.mode!=='arena'); const days=new Set(ss.map(s=>U.dayKey(s.ts)));
    const today=U.dayKey(Date.now()), td=ss.filter(s=>U.dayKey(s.ts)===today); let tn=0,tc=0; td.forEach(s=>{ tn+=s.n; tc+=s.correct; });
    return {sessions:ss.length,answered:n,correct:c,avg:scored.length?scored.reduce((a,s)=>a+s.score,0)/scored.length:0,best:scored.reduce((a,s)=>Math.max(a,s.score),0),days:days.size,examsDone:ss.filter(s=>EXAM_MODES.indexOf(s.mode)>=0).length,today:{n:tn,c:tc,acc:tn?tc/tn:0}}; },
  series(sid,days){ const out=[]; const now=new Date(); for(let i=days-1;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i); const k=U.dayKey(d.getTime()); const ss=S.sessions.filter(s=>s.studentId===sid&&U.dayKey(s.ts)===k); let n=0,c=0,sc=0,sn=0; ss.forEach(s=>{ n+=s.n; c+=s.correct; if(s.mode!=='quick'&&s.mode!=='arena'){ sc+=s.score; sn++; } }); out.push({day:k,label:U.pad(d.getDate())+'/'+U.pad(d.getMonth()+1),n,c,acc:n?c/n:null,avg:sn?sc/sn:null}); } return out; },
  recommend(sid){ const bt=An.byTopic(sid), sp=An.split(bt), out=[]; const name=id=>{ const t=S.content.topics.find(x=>x.id===id); return t?t.name:id; };
    const open=T3.Mist.list(sid,true);
    const tbl={}; open.filter(m=>m.topic==='NHAN_CHIA').forEach(m=>{ const x=String(m.q.question).replace(/\u00A0/g,'').match(/(\d+)\s*[×:]\s*(\d+)/); if(x){ const a=+x[1],b=+x[2]; const t=m.q.question.indexOf(':')>=0&&m.q.question.indexOf('×')<0?b:Math.min(a,b); if(t>=2&&t<=9) tbl[t]=(tbl[t]||0)+1; } });
    const topTbl=Object.keys(tbl).sort((a,b)=>tbl[b]-tbl[a])[0];
    sp.weak.forEach(w=>{ const tp=w.topic; if(tp==='NHAN_CHIA'){ out.push({text:topTbl?`Ôn bảng nhân ${topTbl} và phép chia`:'Luyện bảng nhân và bảng chia',topic:tp,lesson:'bang_nhan',acc:w.acc}); }
      else if(tp==='HINH_HOC') out.push({text:'Luyện nhận biết hình, chu vi và diện tích',topic:tp,lesson:'chu_vi',acc:w.acc});
      else if(tp==='TOAN_LOI_VAN') out.push({text:'Luyện bài toán 1 bước, rồi 2 bước',topic:tp,lesson:'mot_buoc',acc:w.acc});
      else out.push({text:'Ôn lại '+name(tp),topic:tp,acc:w.acc}); });
    if(open.length) out.push({text:`Làm lại ${open.length} câu sai chưa khắc phục`,mistakes:true});
    if(!out.length){ const none=S.content.topics.filter(t=>Pool.topicOn(t.id)&&!bt[t.id]); if(none.length) out.push({text:'Thử sức với '+none[0].name,topic:none[0].id}); }
    return out.slice(0,5); },
  rank(period){ const now=Date.now(); const lim=period==='day'?new Date().setHours(0,0,0,0):period==='week'?now-7*864e5:period==='month'?now-30*864e5:0; const m={};
    S.sessions.forEach(s=>{ if(s.ts<lim) return; const o=m[s.studentId]||(m[s.studentId]={sid:s.studentId,points:0,n:0}); o.points+=s.points||0; o.n+=s.n; });
    return Object.values(m).map(o=>{ const st=T3.Student.get(o.sid); return st?Object.assign(o,{name:st.name,avatar:st.avatar,badges:Object.keys(st.badges||{}).length}):null; }).filter(Boolean).sort((a,b)=>b.points-a.points); },
  teacher(){ const bt=An.byTopic(null), rows=Object.keys(bt).map(t=>({topic:t,n:bt[t].c+bt[t].w,wrongRate:bt[t].w/Math.max(1,bt[t].c+bt[t].w)})).filter(x=>x.n>=3).sort((a,b)=>b.wrongRate-a.wrongRate);
    const qw={}; S.sessions.forEach(s=>(s.items||[]).forEach(it=>{ if(it.ok===false){ const k=it.q.id; const o=qw[k]||(qw[k]={q:it.q,w:0}); o.w++; } }));

    return {students:S.students.length,answered:n,avg:sn?sc/sn:0,completion:S.students.length?S.students.filter(st=>S.sessions.some(s=>s.studentId===st.id&&EXAM_MODES.indexOf(s.mode)>=0)).length/S.students.length:0,hardTopics:rows.slice(0,5),hardQuestions:Object.values(qw).sort((a,b)=>b.w-a.w).slice(0,5)}; }
};

/* ---------- ACHIEVEMENT ENGINE ---------- */
T3.BADGES=[{id:'streak10',icon:'🌟',name:'10 câu đúng liên tiếp',desc:'Trả lời đúng liên tiếp 10 câu trong một lần làm bài.'},{id:'exam_done',icon:'🏆',name:'Hoàn thành đề',desc:'Nộp xong một đề thi hoặc kiểm tra.'},{id:'speed',icon:'⚡',name:'Tính nhanh',desc:'Trả lời đúng ít nhất 20 phép tính trong chế độ Tính nhanh.'},{id:'think',icon:'🧠',name:'Toán tư duy',desc:'Làm đúng từ 70% trong một bài Toán tư duy (ít nhất 8 câu đúng).'},{id:'topic_done',icon:'📚',name:'Hoàn thành chuyên đề',desc:'Đạt từ 8 điểm trong một bài thi chuyên đề.'},{id:'days7',icon:'🔥',name:'7 ngày luyện tập',desc:'Luyện tập ở 7 ngày khác nhau.'},{id:'acc90',icon:'🎯',name:'90% chính xác',desc:'Đạt từ 90% đúng trong một bài có ít nhất 10 câu.'},{id:'top',icon:'👑',name:'Top học sinh',desc:'Đứng hạng 1 trên bảng xếp hạng (cần ít nhất 2 bạn).'}];
T3.Ach={ check(st,rec,x){ if(!st) return []; st.badges=st.badges||{}; const got=[]; const give=id=>{ if(!st.badges[id]){ st.badges[id]=Date.now(); got.push(T3.BADGES.find(b=>b.id===id)); } };
  if(x&&x.bestStreak>=10) give('streak10'); if(EXAM_MODES.indexOf(rec.mode)>=0) give('exam_done'); if(rec.mode==='quick'&&rec.correct>=20) give('speed');
  const td=rec.perTopic&&rec.perTopic.TOAN_TU_DUY; if(td&&td.c>=8&&td.c/(td.c+td.w)>=0.7) give('think'); if(rec.mode==='topicexam'&&rec.score>=8) give('topic_done');
  if(new Set(S.sessions.filter(s=>s.studentId===st.id).map(s=>U.dayKey(s.ts))).size>=7) give('days7'); if(rec.n>=10&&rec.ratio>=0.9&&rec.mode!=='quick') give('acc90');
  const rk=An.rank('all'); if(rk.length>=2&&rk[0].sid===st.id&&rk[0].points>0) give('top');
  if(got.length) Data.saveStudents(); return got; } };

/* ---------- IMPORT / EXPORT ---------- */
const IO=T3.IO={
  toCSV(rows){ return rows.map(r=>r.map(v=>{ v=v==null?'':String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\r\n'); },
  parseCSV(text){ const rows=[]; let row=[],cur='',q=false; text=String(text).replace(/^\uFEFF/,''); for(let i=0;i<text.length;i++){ const c=text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; } else if(c==='"') q=true; else if(c===','){ row.push(cur); cur=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); cur=''; if(row.some(x=>x!=='')) rows.push(row); row=[]; } else cur+=c; }
    row.push(cur); if(row.some(x=>x!=='')) rows.push(row); return rows; },
  qHeader:['id','topic','lesson','type','difficulty','question','A','B','C','D','answer','explanation','hint','source','author','status'],
  questionsCSV(list){ return IO.toCSV([IO.qHeader].concat(list.map(q=>[q.id,q.topic,q.lesson||'',q.type,q.difficulty,q.question,...(q.options||['','','','']).concat(['','','','']).slice(0,4),q.type==='mc'||q.type==='tf'?'ABCD'[q.answer]:q.type==='sort'?q.items.join(' | '):q.type==='match'?q.pairs.map(p=>p.join('=')).join(' | '):q.answer,q.explanation,q.hint||'',q.source||'',q.author||'',q.status]))); },
  matchTopic(v){ if(!v) return null; const n=U.norm(v).replace(/_/g,' '); const t=S.content.topics.find(x=>U.norm(x.id).replace(/_/g,' ')===n||U.norm(x.name)===n); return t?t.id:null; },
  normalize(raw){ const q={}; const diffMap={easy:1,basic:2,medium:3,good:4,hard:5,de:1,'co ban':2,'trung binh':3,kha:4,'nang cao':5};
    q.id=String(raw.id||'').trim(); q.grade=3; q.topic=IO.matchTopic(raw.topic)||raw.topic;
    const tp=S.content.topics.find(t=>t.id===q.topic); const ls=raw.lesson?String(raw.lesson):''; const lm=tp?tp.lessons.find(l=>l.id===ls||U.norm(l.name)===U.norm(ls)):null; q.lesson=lm?lm.id:(tp&&tp.lessons[0]?tp.lessons[0].id:'');
    let d=raw.difficulty; if(typeof d==='string'){ const k=U.norm(d); d=diffMap[k]!==undefined?diffMap[k]:parseInt(d,10); } q.difficulty=Number(d);
    const tmap={multiple_choice:'mc',mc:'mc',true_false:'tf',tf:'tf',fill:'fill',fill_blank:'fill',sort:'sort',match:'match'}; q.type=tmap[String(raw.type||'mc').toLowerCase()]||raw.type;
    q.question=String(raw.question==null?'':raw.question).trim();
    if(q.type==='mc'){ q.options=Array.isArray(raw.options)?raw.options.map(String):[raw.A,raw.B,raw.C,raw.D].map(x=>x==null?'':String(x)); let a=raw.answer; if(typeof a==='string'&&/^[A-Da-d]$/.test(a.trim())) a='ABCD'.indexOf(a.trim().toUpperCase()); else if(typeof a==='string'&&/^\d$/.test(a.trim())) a=parseInt(a,10); q.answer=a; }
    else if(q.type==='tf'){ q.options=['Đúng','Sai']; let a=raw.answer; if(typeof a==='string'){ const n=U.norm(a); a=(n==='a'||n==='dung'||n==='true'||n==='0')?0:(n==='b'||n==='sai'||n==='false'||n==='1')?1:a; } else if(typeof a==='boolean') a=a?0:1; q.answer=a; }
    else if(q.type==='fill'){ q.answer=isFinite(Calc.parseNum(raw.answer))&&String(raw.answer).trim()!==''?Calc.parseNum(raw.answer):raw.answer; if(raw.unit) q.unit=String(raw.unit); }
    else if(q.type==='sort'){ q.items=Array.isArray(raw.items)?raw.items.map(String):String(raw.answer||'').split('|').map(x=>x.trim()).filter(Boolean); }
    else if(q.type==='match'){ q.pairs=Array.isArray(raw.pairs)?raw.pairs.map(p=>[String(p[0]),String(p[1])]):String(raw.answer||'').split('|').map(x=>x.split('=').map(y=>y.trim())).filter(p=>p.length===2); }
    q.explanation=String(raw.explanation||'').trim(); q.hint=String(raw.hint||''); q.source=String(raw.source||'Nhập từ tệp'); q.author=String(raw.author||''); q.status=['draft','review','published','archived'].indexOf(String(raw.status||'').toLowerCase())>=0?String(raw.status).toLowerCase():'draft';
    if(raw.figure&&typeof raw.figure==='object') q.figure=raw.figure; if(raw.calc&&typeof raw.calc==='object') q.calc=raw.calc; q.advanced=!!raw.advanced; q.createdAt=raw.createdAt||Date.now(); q.updatedAt=Date.now(); return q; },
  importQuestions(items,o){ o=o||{}; const added=[],skipped=[]; const ids=new Set(S.questions.map(q=>q.id)); const ctx={topicIds:S.content.topics.map(t=>t.id)};
    items.forEach((raw,i)=>{ try{ if(!raw||typeof raw!=='object'){ skipped.push({row:i+1,reasons:['Dòng không đúng cấu trúc']}); return; } const q=IO.normalize(raw);
      if(!q.id||ids.has(q.id)){ q.id=U.uid('IMP'); } ids.add(q.id); const v=Verify.question(q,ctx); if(!v.ok){ if(q.status==='published'){ q.status='draft'; } q.importErrors=v.errors; if(o.strict){ skipped.push({row:i+1,reasons:v.errors}); return; } }
      if(o.forceDraft) q.status='draft'; added.push(q); }catch(e){ skipped.push({row:i+1,reasons:[e.message]}); } }); return {added,skipped}; },
  parseQuestionFile(text,name){ let rows; if(/\.csv$/i.test(name||'')||(!/^\s*[\[{]/.test(text))){ const r=IO.parseCSV(text); if(r.length<2) throw new Error('Tệp CSV chưa có dữ liệu'); const h=r[0].map(x=>x.trim()); rows=r.slice(1).map(c=>{ const o={}; h.forEach((k,i)=>{ o[k]=c[i]; }); return o; }); }
    else { const j=JSON.parse(text); rows=Array.isArray(j)?j:(Array.isArray(j.questions)?j.questions:null); if(!rows) throw new Error('JSON cần là một mảng câu hỏi hoặc có khóa "questions"'); } return rows; }
};

/* ---------- BACKUP / RESTORE / FACTORY RESET ---------- */
T3.Backup={
  make(){ const cfg=U.clone(S.cfg); return {app:'toan-lop-3',version:1,createdAt:new Date().toISOString(),cfg,content:S.content,questions:S.questions,exams:S.exams,students:S.students,sessions:S.sessions,mistakes:S.mistakes,docs:S.docs,cur:S.cur}; },
  filename(){ return 'toan-lop-3-backup-'+U.dayKey(Date.now())+'.json'; },
  validate(o){ const e=[]; if(!o||typeof o!=='object') return ['Tệp không phải JSON hợp lệ']; if(o.app!=='toan-lop-3') e.push('Đây không phải tệp sao lưu của ứng dụng này');
    ['questions','exams','students','sessions','mistakes','docs'].forEach(k=>{ if(!Array.isArray(o[k])) e.push('Thiếu hoặc sai kiểu dữ liệu: '+k); }); if(!o.content||!Array.isArray(o.content.topics)) e.push('Thiếu dữ liệu chuyên đề'); if(!o.cfg||typeof o.cfg!=='object') e.push('Thiếu cấu hình');
    if(!e.length){ const ids=new Set(); o.questions.forEach(q=>{ if(!q||!q.id) e.push('Có câu hỏi thiếu mã'); else { if(ids.has(q.id)) e.push('Mã câu hỏi bị trùng: '+q.id); ids.add(q.id); } }); } return e.slice(0,8); },
  async restore(o){ const err=T3.Backup.validate(o); if(err.length) return {ok:false,errors:err};

    for(const s of ['questions','exams','sessions','mistakes','docs','meta']) await DB.clear(s);

    await DB.putMany('questions',S.questions); await DB.putMany('exams',S.exams); await DB.putMany('sessions',S.sessions); await DB.putMany('mistakes',S.mistakes); await DB.putMany('docs',S.docs); await Data.content(); await DB.put('meta',{id:'seeded',value:true}); await DB.put('meta',{id:'seed2',value:true}); await DB.put('meta',{id:'seed3',value:true});
    S.cfg=cfg; LS.set('cfg',cfg); Data.saveStudents(); Data.saveCur(); return {ok:true,counts:{questions:S.questions.length,students:S.students.length,sessions:S.sessions.length}}; },
  async factory(mode){ for(const s of ['questions','exams','sessions','mistakes','docs','meta']) await DB.clear(s);

/* ---------- AI ENGINE (Claude qua quyền "sample" hoặc bộ sinh nội bộ) ---------- */

  async generate(p){ const count=Math.max(1,Math.min(30,p.count||5)); const tp=S.content.topics.find(t=>t.id===p.topic); const ls=tp&&tp.lessons.find(l=>l.id===p.lesson);
    const dist=T3.Pool.split(count,p.dist||[30,30,25,10,5]); const lv=[];
    dist.forEach((n,i)=>{ for(let k=0;k<n;k++) lv.push(i+1); });

    lines.forEach(l=>{ const m=l.replace(/\u00A0/g,' ').match(/^(\d[\d\s]*)\s*([+\-−×x*:÷\/])\s*(\d[\d\s]*)\s*=\s*(\d[\d\s]*)$/);

      const h=l.match(/^(?:H(?:ỏi)?|Q)\s*[:：]\s*(.+?)\s*[|;]\s*(?:Đ(?:áp)?|A)\s*[:：]\s*(.+)$/i); if(h){ const q={id:U.uid('DOC'),grade:3,topic:'TOAN_LOI_VAN',lesson:'mot_buoc',difficulty:2,type:'fill',question:h[1],answer:isFinite(Calc.parseNum(h[2]))?Calc.parseNum(h[2]):h[2],explanation:'Đáp án: '+h[2]+'. (Giáo viên cần bổ sung lời giải)',hint:'',status:'draft',source:'Tài liệu',author:'Learning Center',createdAt:ts,updatedAt:ts}; qs.push(q); } });

    const s3=T3.Run.create({studentId:S.cur,mode:'mistakes',title:'Làm lại',questions:[wq],feedback:true}); s3.ans[0].given=wq.answer; T3.Run.check(s3,0); ok('Test 04 – Làm lại câu sai thì đánh dấu đã khắc phục',T3.Mist.openCount(S.cur)===0&&S.mistakes[0].fixed===true);

    const bk=JSON.parse(JSON.stringify(T3.Backup.make())); ok('Test 08 – Backup tạo được dữ liệu hợp lệ',T3.Backup.validate(bk).length===0&&/^toan-lop-3-backup-\d{4}-\d{2}-\d{2}\.json$/.test(T3.Backup.filename()));

    const ai=T3.AI.local({topic:'PHEP_TINH',lesson:'cong'},[1,2,3]); ok('Test 10 – AI/bộ sinh tạo câu hỏi phải vào Draft',ai.added.length===3&&ai.added.every(q=>q.status==='draft'));
    const dq=ai.added[0]; const pubBefore=Pool.filter({}).some(q=>q.id===dq.id); S.questions.push(dq); const pubMid=Pool.filter({}).some(q=>q.id===dq.id); dq.status='published'; const pubAfter=Pool.filter({}).some(q=>q.id===dq.id); ok('Test 11 – Admin Publish thì câu mới được dùng',!pubBefore&&!pubMid&&pubAfter);

  case 'tri':{ w=300;h=190; b=`<polygon points="40,160 260,160 120,30" fill="#CFE0FF" stroke="currentColor" stroke-width="4"/><text x="140" y="182" text-anchor="middle" font-size="19" ${TX}>${f.b} ${f.unit}</text><text x="62" y="86" text-anchor="end" font-size="19" ${TX}>${f.a} ${f.unit}</text><text x="214" y="86" font-size="19" ${TX}>${f.c} ${f.unit}</text>`; lab=`Hình tam giác có ba cạnh ${f.a}, ${f.b}, ${f.c} ${f.unit} (hình không đúng tỉ lệ)`; return svg(); }
  case 'gridarea':{ const cs=Math.min(40,Math.floor(280/f.w),Math.floor(170/f.h)); w=f.w*cs+20;h=f.h*cs+20; for(let i=0;i<f.w;i++) for(let j=0;j<f.h;j++) b+=`<rect x="${10+i*cs}" y="${10+j*cs}" width="${cs}" height="${cs}" fill="#CFE0FF" stroke="currentColor" stroke-width="2"/>`; lab=`Lưới ô vuông gồm ${f.h} hàng, mỗi hàng ${f.w} ô`; return svg(); }
  case 'gridsq':{ const cs=56; w=f.n*cs+20;h=f.n*cs+20; for(let i=0;i<f.n;i++) for(let j=0;j<f.n;j++) b+=`<rect x="${10+i*cs}" y="${10+j*cs}" width="${cs}" height="${cs}" fill="#FFF3C4" stroke="currentColor" stroke-width="3"/>`; lab=`Lưới ${f.n} nhân ${f.n} ô vuông`; return svg(); }
  case 'clock':{ w=200;h=200; const cx=100,cy=100; b=`<circle cx="${cx}" cy="${cy}" r="90" fill="#fff" stroke="#1B2A57" stroke-width="6"/>`; for(let i=1;i<=12;i++){ const a=(i*30-90)*Math.PI/180; b+=`<text x="${cx+70*Math.cos(a)}" y="${cy+70*Math.sin(a)+7}" text-anchor="middle" font-size="20" font-family="Baloo 2,sans-serif" font-weight="800" fill="#1B2A57">${i}</text>`; } for(let i=0;i<60;i++){ const a=(i*6-90)*Math.PI/180,r1=i%5?84:80; b+=`<line x1="${cx+r1*Math.cos(a)}" y1="${cy+r1*Math.sin(a)}" x2="${cx+88*Math.cos(a)}" y2="${cy+88*Math.sin(a)}" stroke="#1B2A57" stroke-width="${i%5?1:2}"/>`; }
    const ha=((f.h%12)*30+f.m*0.5-90)*Math.PI/180, ma=(f.m*6-90)*Math.PI/180; b+=`<line x1="${cx}" y1="${cy}" x2="${cx+46*Math.cos(ha)}" y2="${cy+46*Math.sin(ha)}" stroke="#E5484D" stroke-width="8" stroke-linecap="round"/><line x1="${cx}" y1="${cy}" x2="${cx+68*Math.cos(ma)}" y2="${cy+68*Math.sin(ma)}" stroke="#2F5BEA" stroke-width="5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="6" fill="#1B2A57"/>`; lab='Đồng hồ kim: kim ngắn màu đỏ chỉ giờ, kim dài màu xanh chỉ phút'; return svg(); }
  case 'money':{ const per=3, rows=Math.ceil(f.notes.length/per); w=3*110+10; h=rows*64+10; const C={1000:'#C9CFE0',2000:'#BBC9D4',5000:'#9CC3E6',10000:'#C9C98E',20000:'#8EB7E8',50000:'#EBA6C4',100000:'#9ED3A4'}; f.notes.forEach((n,i)=>{ const x=10+(i%per)*110,y=10+Math.floor(i/per)*64; b+=`<rect x="${x}" y="${y}" width="100" height="52" rx="6" fill="${C[n]||'#ddd'}" stroke="#1B2A57" stroke-width="3"/><text x="${x+50}" y="${y+33}" text-anchor="middle" font-size="19" font-family="Baloo 2,sans-serif" font-weight="800" fill="#1B2A57">${U.num(n)}</text>`; }); lab='Các tờ tiền: '+f.notes.map(U.num).join(', ')+' đồng'; return svg(); }
  case 'shape':{ w=300;h=180; const n=f.name; b=n==='tam_giac'?`<polygon points="150,20 250,150 50,150" fill="#CFE0FF" stroke="currentColor" stroke-width="5"/>`:n==='vuong'?`<rect x="95" y="25" width="110" height="110" fill="#CFE0FF" stroke="currentColor" stroke-width="5"/>`:n==='chu_nhat'?`<rect x="55" y="45" width="190" height="85" fill="#CFE0FF" stroke="currentColor" stroke-width="5"/>`:`<circle cx="150" cy="85" r="62" fill="#CFE0FF" stroke="currentColor" stroke-width="5"/>`; lab='Một hình cần nhận dạng'; return svg(); }
  case 'angle':{ w=300;h=170; const ox=60,oy=140,len=150,a=f.deg*Math.PI/180; b=`<line x1="${ox}" y1="${oy}" x2="${ox+len}" y2="${oy}" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><line x1="${ox}" y1="${oy}" x2="${ox+len*Math.cos(a)}" y2="${oy-len*Math.sin(a)}" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>`; b+=f.deg===90?`<path d="M${ox} ${oy-22}h22v22" fill="none" stroke="#E5484D" stroke-width="3"/>`:`<path d="M${ox+30} ${oy} A30 30 0 0 0 ${ox+30*Math.cos(a)} ${oy-30*Math.sin(a)}" fill="none" stroke="#E5484D" stroke-width="3"/>`; b+=`<circle cx="${ox}" cy="${oy}" r="5" fill="currentColor"/><text x="${ox-22}" y="${oy+6}" font-size="20" ${TX}>O</text>`; lab='Một góc có đỉnh O'; return svg(); }
  case 'circle':{ w=300;h=200; const cx=150,cy=100,R=72; b=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="#CFE0FF" stroke="currentColor" stroke-width="5"/><circle cx="${cx}" cy="${cy}" r="5" fill="currentColor"/><text x="${cx-4}" y="${cy-12}" text-anchor="end" font-size="20" ${TX}>O</text>`; if(f.show==='d') b+=`<line x1="${cx-R}" y1="${cy}" x2="${cx+R}" y2="${cy}" stroke="#E5484D" stroke-width="5"/><text x="${cx}" y="${cy+28}" text-anchor="middle" font-size="19" ${TX}>${f.d} ${f.unit}</text>`; else b+=`<line x1="${cx}" y1="${cy}" x2="${cx+R}" y2="${cy}" stroke="#E5484D" stroke-width="5"/><text x="${cx+R/2}" y="${cy+26}" text-anchor="middle" font-size="19" ${TX}>${f.r} ${f.unit}</text>`; lab=f.show==='d'?`Hình tròn tâm O có đường kính ${f.d} ${f.unit}`:`Hình tròn tâm O có bán kính ${f.r} ${f.unit}`; return svg(); }
  case 'segm':{ w=320;h=130; b=`<line x1="40" y1="70" x2="280" y2="70" stroke="currentColor" stroke-width="5"/><circle cx="40" cy="70" r="7" fill="currentColor"/><circle cx="160" cy="70" r="7" fill="#E5484D"/><circle cx="280" cy="70" r="7" fill="currentColor"/><text x="40" y="50" text-anchor="middle" font-size="22" ${TX}>A</text><text x="160" y="50" text-anchor="middle" font-size="22" ${TX}>M</text><text x="280" y="50" text-anchor="middle" font-size="22" ${TX}>B</text><text x="160" y="112" text-anchor="middle" font-size="18" ${TX}>AB = ${f.len} ${f.unit}</text>`; lab=`Đoạn thẳng AB dài ${f.len} ${f.unit}, M là trung điểm`; return svg(); }
  case 'point':{ w=300;h=120; b=`<circle cx="150" cy="60" r="7" fill="currentColor"/><text x="162" y="48" font-size="22" ${TX}>A</text>`; lab='Một điểm A'; return svg(); }
  case 'seg':{ w=300;h=120; b=`<line x1="60" y1="60" x2="240" y2="60" stroke="currentColor" stroke-width="5"/><circle cx="60" cy="60" r="7" fill="currentColor"/><circle cx="240" cy="60" r="7" fill="currentColor"/><text x="52" y="38" font-size="22" ${TX}>A</text><text x="236" y="38" font-size="22" ${TX}>B</text>`; lab='Hình có hai đầu A và B'; return svg(); }
  case 'line':{ w=300;h=120; b=`<line x1="14" y1="60" x2="286" y2="60" stroke="currentColor" stroke-width="5"/><polygon points="4,60 22,50 22,70" fill="currentColor"/><polygon points="296,60 278,50 278,70" fill="currentColor"/><circle cx="110" cy="60" r="6" fill="currentColor"/><circle cx="200" cy="60" r="6" fill="currentColor"/><text x="104" y="38" font-size="22" ${TX}>A</text><text x="194" y="38" font-size="22" ${TX}>B</text>`; lab='Hình kéo dài về hai phía qua hai điểm A và B'; return svg(); }
  case 'count':{ w=300;h=190; const items=[]; Object.keys(f.counts).forEach(k=>{ for(let i=0;i<f.counts[k];i++) items.push(k); }); const rg=T3.Rand.make(f.seed||1); const cells=rg.shuffle(Array.from({length:28},(_,i)=>i)); const ci={star:0,circle:1,square:2,tri:3}; items.forEach((k,i)=>{ const c=cells[i], cx=22+(c%7)*42, cy=24+Math.floor(c/7)*44; b+=shp(k,cx,cy,15,ci[k]); }); lab='Các hình trộn lẫn: '+Object.keys(f.counts).length+' loại hình'; return svg(); }
  case 'odd':{ w=4*70+20;h=110; f.shapes.forEach((s,i)=>{ const cx=45+i*70; b+=shp(s.s,cx,42,24,s.c)+`<text x="${cx}" y="98" text-anchor="middle" font-size="18" ${TX}>${i+1}</text>`; }); lab='Bốn hình đánh số từ 1 đến 4'; return svg(); }
  case 'fraction':{ if(f.shape==='pie'){ w=200;h=200; const cx=100,cy=100,r=84; for(let i=0;i<f.d;i++){ const a0=(i/f.d)*2*Math.PI-Math.PI/2,a1=((i+1)/f.d)*2*Math.PI-Math.PI/2; const lg=(a1-a0)>Math.PI?1:0; b+=f.d===1?'':`<path d="M${cx} ${cy} L${cx+r*Math.cos(a0)} ${cy+r*Math.sin(a0)} A${r} ${r} 0 ${lg} 1 ${cx+r*Math.cos(a1)} ${cy+r*Math.sin(a1)} Z" fill="${i<f.n?'#FFC83D':'#fff'}" stroke="#1B2A57" stroke-width="3"/>`; } }
    else { w=300;h=110; const bw=260/f.d; for(let i=0;i<f.d;i++) b+=`<rect x="${20+i*bw}" y="25" width="${bw}" height="60" fill="${i<f.n?'#FFC83D':'#fff'}" stroke="#1B2A57" stroke-width="3"/>`; } lab=`Hình chia thành ${f.d} phần bằng nhau, tô màu ${f.n} phần`; return svg(); }

/* ---------- thân câu hỏi ---------- */
UI.answered=(q,a)=>{ const g=a.given; if(g==null) return false; if(q.type==='fill') return String(g).trim()!==''; if(q.type==='sort') return Array.isArray(g)&&g.length>0; if(q.type==='match') return Array.isArray(g)&&g.some(x=>x!=null); return true; };
UI.complete=(q,a)=>{ const g=a.given; if(g==null) return false; if(q.type==='fill') return String(g).trim()!==''; if(q.type==='sort') return Array.isArray(g)&&g.length===q.items.length; if(q.type==='match') return Array.isArray(g)&&g.length===q.pairs.length&&g.every(x=>x!=null); return true; };
UI.qBody=(q,a,o)=>{ o=o||{}; const lock=!!o.lock, res=!!o.result, g=a?a.given:null; let h=''; if(q.figure) h+=UI.fig(q.figure);
  h+=`<div class="qtext" id="qtext">${UI.t(q.question)}</div>`;
  if(q.type==='mc'||q.type==='tf'){ h+=`<div class="opts ${q.type==='tf'?'tf':''}" role="group" aria-labelledby="qtext">`+q.options.map((op,k)=>{ let cls='opt',mk=''; if(res){ if(k===q.answer){ cls+=' ok'; mk='✓'; } else if(g===k){ cls+=' bad'; mk='✗'; } }
      return `<button class="${cls}" data-a="pick" data-v="${k}" aria-pressed="${g===k}" ${lock?'disabled':''}><span class="lt" aria-hidden="true">${q.type==='mc'?'ABCD'[k]:(k===0?'Đ':'S')}</span><span>${UI.t(op)}</span><span class="mk" aria-hidden="true">${mk}</span></button>`; }).join('')+'</div>'; }
  else if(q.type==='fill'){ const txt=typeof q.answer==='string'; h+=`<div class="fillrow"><input id="fillIn" data-i="fill" type="text" inputmode="${txt?'text':'numeric'}" autocomplete="off" autocapitalize="off" aria-label="Đáp án của em" placeholder="Nhập đáp án" value="${esc(g==null?'':g)}" ${lock?'readonly':''}>${q.unit?`<span class="unit">${esc(q.unit)}</span>`:''}${res?`<span class="pill ${a&&a.ok?'ok':'bad'}">${a&&a.ok?'✓ Đúng':'✗ Chưa đúng'}</span>`:''}</div>`; }
  else if(q.type==='sort'){ const used=Array.isArray(g)?g:[]; h+=`<p class="muted small">Chạm vào các thẻ (hoặc kéo thả) để xếp theo đúng thứ tự, từ trái sang phải hoặc từ trên xuống.</p><div class="zone" id="ansZone" data-drop="ans" aria-label="Thứ tự em đã xếp">`+(used.length?used.map((t,k)=>`<button class="sc in" draggable="${lock?'false':'true'}" data-drag="ans:${k}" data-drop="before:${k}" data-a="sortDel" data-v="${k}" ${lock?'disabled':''}><span class="n">${k+1}</span>${UI.t(t)}</button>`).join(''):'<span class="muted">Chưa xếp thẻ nào</span>')+`</div><div class="zone" id="poolZone" data-drop="pool" aria-label="Các thẻ còn lại">`+(q._pool||q.items).map((t,k)=>used.indexOf(t)>=0?'':`<button class="sc" draggable="${lock?'false':'true'}" data-drag="pool:${k}" data-a="sortAdd" data-v="${k}" ${lock?'disabled':''}>${UI.t(t)}</button>`).join('')+'</div>'; if(res&&!a.ok) h+=`<p class="muted">Thứ tự đúng: <b>${q.items.map(x=>UI.t(x)).join(' → ')}</b></p>`; }
  else if(q.type==='match'){ const sel=UI.st.mSel, as=Array.isArray(g)?g:[]; h+=`<p class="muted small">Chạm một mục bên trái, rồi chạm mục tương ứng bên phải.</p><div class="mrow"><div>`+q.pairs.map((p,k)=>`<button class="mitem" data-a="mL" data-v="${k}" aria-pressed="${sel===k}" ${lock?'disabled':''}><span>${UI.t(p[0])}</span><span class="as">${as[k]!=null?'↔ '+UI.t(as[k]):''}</span></button>`).join('')+`</div><div>`+(q._rpool||q.pairs.map(p=>p[1])).map((t,k)=>`<button class="mitem ${as.indexOf(t)>=0?'used':''}" data-a="mR" data-v="${k}" ${lock?'disabled':''}>${UI.t(t)}</button>`).join('')+'</div></div>'; }
  return h; };
const HINT2={BIEU_THUC:'Thứ tự: tính trong ngoặc trước, nhân chia rồi mới cộng trừ.',TOAN_LOI_VAN:'Gạch dưới số liệu và câu hỏi. Bài hỏi "tất cả" thường cộng, "còn lại" thường trừ.',NHAN_CHIA:'Nhớ bảng nhân, bảng chia. Em có thể thử lại bằng phép tính ngược.',HINH_HOC:'Nhớ công thức: chu vi là tổng các cạnh, diện tích hình chữ nhật là dài × rộng.',DAI_LUONG:'Đổi về cùng một đơn vị trước khi tính hoặc so sánh.',DAY_SO:'Hãy tìm hiệu giữa hai số liền nhau.',SO_HOC:'Xem từng hàng của số, từ hàng cao đến hàng thấp.',PHAN_SO:'Mẫu số là tổng số phần bằng nhau, tử số là số phần được lấy.',PHEP_TINH:'Đặt tính thẳng cột, nhớ hoặc mượn ở từng hàng.',TOAN_TU_DUY:'Thử làm ngược từ kết quả, hoặc vẽ sơ đồ ra giấy.'};
UI.hint1=q=>q.hint||'Đọc kỹ đề bài và thử làm từng bước nhỏ.';
UI.hint2=q=>HINT2[q.topic]||'Em thử làm từng bước và kiểm tra lại nhé.';
UI.feedback=(q,a,ses)=>{ const ok=a.ok; let h=`<div class="fb ${ok?'ok':'bad'}" role="status" aria-live="polite"><h3>${ok?'✅ Đúng rồi! Giỏi quá!':'❌ Chưa đúng, mình cùng xem nhé'}</h3>`;
  if(!ok){ h+=`<p><b>Em đã chọn:</b> ${UI.t(T3.Check.givenText(q,a.given))}</p><p><b>Đáp án đúng:</b> ${UI.t(T3.Check.answerText(q))}</p><p><b>Vì sao chưa đúng?</b> ${esc(a.revealed?'Em đã xem lời giải. Hãy đọc kỹ cách làm bên dưới rồi thử câu tương tự nhé.':T3.Why.analyze(q,a.given))}</p>`; }
  h+=`<div class="ex"><b>${ok?'Cách làm:':'Cách làm đúng:'}</b>\n${UI.t(q.explanation)}</div>`;
  h+=`<div class="row" style="margin-top:10px"><button class="btn sm warn" data-a="similar">🔁 Làm câu tương tự</button>`+(!ok&&S.cfg.aiStudent&&T3.AI.available?`<button class="btn sm" data-a="aiExplain">🤖 Nhờ trợ lý giải thích</button>`:'')+`</div><div id="aiOut" class="note hide" style="margin-top:10px"></div></div>`; return h; };

/* ---------- phiên làm bài ---------- */
UI.saveActive=()=>{ if(UI.ses&&!UI.ses.done) T3.LS.set('active',UI.ses); };
UI.start=def=>{ const st=T3.Student.current(); if(!st){ UI.go('/welcome'); return; } if(!def.questions||!def.questions.length){ UI.toast('Chưa có câu hỏi phù hợp. Em thử chọn khác nhé.','bad'); return; }
  T3.Timer.stopAll(); const ses=T3.Run.create(Object.assign({studentId:st.id},def)); UI.ses=ses; UI.st.mSel=null; UI.saveActive(); UI.go('/session'); };
UI.loadActive=()=>{ if(UI.ses) return UI.ses; const a=T3.LS.get('active',null); if(a&&Array.isArray(a.qs)&&Array.isArray(a.ans)&&!a.done&&T3.Student.get(a.studentId)){ UI.ses=a; return a; } return null; };
UI.finish=auto=>{ const s=UI.ses; if(!s||s.done) return; T3.Timer.stopAll(); const r=T3.Run.finish(s); T3.LS.del('active'); UI.ses=null;
  if(!r||!r.rec){ UI.toast('Em chưa trả lời câu nào nên chưa có kết quả.'); UI.go('/'); return; }
  UI.st.badges=r.badges||[]; UI.snd('done'); if(r.rec.ratio>=0.8) UI.confetti(); if(auto) UI.toast('⏰ Hết giờ! Bài của em đã được nộp tự động.','ok'); UI.go('/result/'+r.rec.id); };
UI.V.session=()=>{ const s=UI.loadActive(); if(!s) return `<div class="card center"><h2>Chưa có bài đang làm</h2><button class="btn primary" data-go="/">Về trang chủ</button></div>`;
  const q=s.qs[s.i], a=s.ans[s.i], n=s.qs.length, exam=!s.feedback; const doneN=s.ans.filter((x,k)=>exam?UI.answered(s.qs[k],x):x.checked).length; const pct=(s.i+(a.checked?1:0))/n*100;
  const blocks='█'.repeat(Math.round((s.i+1)/n*10))+'░'.repeat(10-Math.round((s.i+1)/n*10));
  let h=`<div class="qhead"><div><span class="pill">${UI.modeName(s.mode)}</span> <b>${esc(s.title)}</b></div>${exam&&s.deadline?`<div class="clock" id="clock" role="timer" aria-label="Thời gian còn lại">--:--</div>`:''}</div>`;
  h+=`<div class="row" style="margin-bottom:8px"><b>Câu ${s.i+1} / ${n}</b><span class="muted" aria-hidden="true" style="font-family:monospace">${blocks}</span><span class="grow">${UI.bar(pct)}</span>${s.feedback?`<span class="pill ok" title="Chuỗi đúng liên tiếp">🔥 ${s.streak}</span>`:''}<span class="pill ${q.advanced?'adv':''}">${q.advanced?'NÂNG CAO · ':''}${esc(UI.lv(q.difficulty))}</span></div>`;
  h+=`<div class="qbox">${UI.qBody(q,a,{lock:s.feedback&&a.checked,result:s.feedback&&a.checked})}`;
  if(s.feedback&&!a.checked&&S.cfg.selfThink){ const hs=a.hints||0; h+=(hs>=1?`<div class="hintbox">💡 Gợi ý 1: ${UI.t(UI.hint1(q))}</div>`:'')+(hs>=2?`<div class="hintbox">💡 Gợi ý 2: ${UI.t(UI.hint2(q))}</div>`:''); h+=`<div class="row" style="margin-top:10px">`+(hs<2?`<button class="btn sm" data-a="hint">💡 Gợi ý ${hs+1}</button>`:`<button class="btn sm" data-a="reveal">📖 Xem lời giải</button>`)+(T3.AI.available&&S.cfg.aiStudent?`<button class="btn sm" data-a="aiHint">🤖 Hỏi trợ lý</button>`:'')+`</div><div id="aiOut" class="note hide" style="margin-top:10px"></div>`; }
  if(s.feedback&&a.checked) h+=UI.feedback(q,a,s);
  h+='</div>';
