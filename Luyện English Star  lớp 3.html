.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}

.opt:hover:not(:disabled){background:#FFF3C4}
.opt.ok{background:#2BB59A;border-color:#2BB59A;color:#fff}.opt.no{background:#FF6B8A;border-color:#FF6B8A;color:#fff}
.res{text-align:center;padding:24px 0}.big{font-size:4rem;font-weight:800}
.stars{font-size:2.6rem;color:var(--y);-webkit-text-stroke:1px var(--ink)}
.res .card{margin:12px auto 0;align-items:center}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.rd{border:3px solid var(--ink);background:#fff;border-radius:14px;padding:8px;font:inherit;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center}
.rd b{font-size:1.4rem}.rd span{color:#d99a00;min-height:1.4em}
.score{display:flex;gap:12px;margin-bottom:8px}.score .card{flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}

.qi{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:10px 14px;margin:8px 0}

const norm=S=>{if(!S||!Array.isArray(S.bank))return null;const seen=new Set();
S.bank=S.bank.filter(q=>q&&typeof q.q=='string'&&Array.isArray(q.o)&&q.o.length>=2&&q.o.every(x=>typeof x=='string')&&Number.isInteger(q.a)&&q.a>=0&&q.a<q.o.length).map(q=>{let id=String(q.id||'').replace(/[^\w-]/g,'');if(!id||seen.has(id))id='q'+Date.now()+Math.random().toString(36).slice(2,6);seen.add(id);return{id,t:String(q.t||'Khác'),q:q.q,o:q.o,a:q.a,s:q.s=='draft'?'draft':'pub'}});

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(a,r=Math.random){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const msg=t=>{A.innerHTML=bar('')+`<p class=sub>${t}</p>`};

function home(){stop();const st=Object.values(S.prog).reduce((a,b)=>a+b,0);

.map(m=>`<button class=card style="--c:${m[3]}" onclick="go('${m[0]}')"><b>${m[1]}</b><span>${m[2]}</span></button>`).join('')}</div>`}
function go(x){({rounds,study,battle,admin,check,

exam:()=>quiz({title:'Thi thử',qs:shuf(pub()).slice(0,20),total:900})}[x])()}

function quiz(o){stop();let i=0,sc=0,left;const N=o.qs.length;
if(!N)return msg('Chưa có câu hỏi phù hợp. Hãy luyện thêm hoặc thêm câu trong phần Quản trị.');
if(o.total){left=o.total;T=setInterval(()=>{left--;const e=$('#tm');if(e)e.textContent=fmt(left);if(left<=0)end()},1000)}
function show(){const q=o.qs[i],ord=shuf(q.o.map((_,k)=>k));let c=o.per||0;
A.innerHTML=`${bar(o.title)}<div class=meta><span>Câu ${i+1}/${N}</span><span>Đúng: ${sc}</span>${o.total?`<span id=tm>${fmt(left)}</span>`:''}${o.per?`<span id=pt>${c}s</span>`:''}</div><div class=q>${E(q.q)}</div><div class=opts>${ord.map(k=>`<button class=opt data-k=${k}>${E(q.o[k])}</button>`).join('')}</div>`;
if(o.per){clearInterval(P);P=setInterval(()=>{c--;$('#pt').textContent=c+'s';if(c<=0){clearInterval(P);pick(-1)}},1000)}
A.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k,b))}
function pick(k,b){clearInterval(P);const q=o.qs[i],ok=k==q.a;
if(ok){sc++;if(o.clear)S.wrong=S.wrong.filter(x=>x!=q.id)}else if(!S.wrong.includes(q.id))S.wrong.push(q.id);save();
if(o.fb){A.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k==q.a)x.classList.add('ok');else if(x===b)x.classList.add('no')});W=setTimeout(nx,ok?700:1500)}else nx()}
const nx=()=>{i++;i<N?show():end()};
function end(){stop();const r=sc/N,st=r>=.9?3:r>=.7?2:r>=.5?1:0;o.done&&o.done(st);
A.innerHTML=`${bar('Kết quả')}<div class=res><div class=big>${sc}/${N}</div><div class=stars>${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><p>${st==3?'Giỏi lắm!':st?'Khá tốt. Thử lại để được nhiều sao hơn.':'Cố lên, ôn lại rồi thử nhé.'}</p><button class=card onclick="home()">Về trang chủ</button></div>`}
show()}

function rounds(){A.innerHTML=bar('Luyện 35 vòng')+`<div class=rg>${[...Array(35)].map((_,i)=>`<button class=rd onclick="round(${i+1})"><b>${i+1}</b><span>${'★'.repeat(S.prog[i+1]||0)||'–'}</span></button>`).join('')}</div>`}
const round=n=>quiz({title:'Vòng '+n,qs:roundQs(n),fb:1,clear:1,done:st=>{S.prog[n]=Math.max(S.prog[n]||0,st);save()}});

function study(){const l=shuf(pub());let i=0;
const f=()=>{if(i>=l.length)return home();const q=l[i];
A.innerHTML=bar('Tự học')+`<div class=meta><span>${E(q.t)}</span><span>${i+1}/${l.length}</span></div><div class=q>${E(q.q)}</div><button class=card id=rv>Xem đáp án</button>`;
$('#rv').onclick=()=>{$('#rv').outerHTML=`<div class="opt ok">${E(q.o[q.a])}</div><br><button class=card id=nx>Câu tiếp</button>`;$('#nx').onclick=()=>{i++;f()}}};f()}

function battle(){stop();const qs=shuf(pub()).slice(0,10);let i=0,sc=[0,0],who=-1;
const buzz=w=>{if(who>=0)return;who=w;document.onkeydown=null;const q=qs[i];
$('#hint').textContent='Đội '+'AL'[w]+' trả lời!';
$('#ops').innerHTML=shuf(q.o.map((_,j)=>j)).map(j=>`<button class=opt data-k=${j}>${E(q.o[j])}</button>`).join('');
$('#ops').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{sc[w]+=+b.dataset.k==q.a?10:-5;i++;f()})};
const f=()=>{if(i>=qs.length)return fin();who=-1;
A.innerHTML=bar('Đối kháng')+`<div class=score><button class=card id=ba style="--c:#2F6FDE"><b>Đội A: ${sc[0]}</b><span>Phím A</span></button><button class=card id=bl style="--c:#E0486C"><b>Đội L: ${sc[1]}</b><span>Phím L</span></button></div><div class=meta><span>Câu ${i+1}/${qs.length}</span></div><div class=q>${E(qs[i].q)}</div><p class=sub id=hint>Đội nào biết trước nhấn phím của đội mình để giành quyền trả lời. Đúng +10, sai -5.</p><div class=opts id=ops></div>`;
$('#ba').onclick=()=>buzz(0);$('#bl').onclick=()=>buzz(1);
document.onkeydown=e=>{const k=e.key.toLowerCase();if(k=='a')buzz(0);if(k=='l')buzz(1)}};
const fin=()=>{document.onkeydown=null;A.innerHTML=bar('Kết quả đối kháng')+`<div class=res><div class=big>${sc[0]} - ${sc[1]}</div><p>${sc[0]==sc[1]?'Hai đội hòa nhau!':'Đội '+(sc[0]>sc[1]?'A':'L')+' thắng!'}</p></div>`};f()}

function admin(){const p=prompt('Nhập PIN quản trị (mặc định 1234)');if(p===null)return;if(p!=S.pin)return alert('Sai PIN.');adm()}
function adm(){A.innerHTML=bar('Quản trị')+`<p class=sub>Câu ở trạng thái Nháp sẽ không xuất hiện trong bài luyện. Đã xuất bản: ${pub().length}/${S.bank.length}</p>
<div class=row><input id=nq placeholder="Câu hỏi"><input id=na placeholder="Đáp án đúng"><input id=nw placeholder="2-3 đáp án sai, cách nhau bằng dấu ;"><input id=nt placeholder="Chủ đề" value="Từ vựng"><button class=card onclick="addQ()"><b>Thêm câu (nháp)</b></button></div>
<div class=row><button class=card onclick="exp()"><b>Sao lưu (tải JSON)</b></button><label class=card style="cursor:pointer"><b>Khôi phục từ file</b><input type=file accept=.json hidden onchange="imp(this)"></label><button class=card onclick="chpin()"><b>Đổi PIN</b></button></div>
${S.bank.map(q=>`<div class=qi><span><b>${E(q.q)}</b><br>${E(q.o[q.a])} · ${E(q.t)}</span><button onclick="tg('${q.id}')">${q.s=='pub'?'Đã xuất bản':'Nháp'}</button><button onclick="del('${q.id}')">Xóa</button></div>`).join('')}`}
function addQ(){const q=$('#nq').value.trim(),a=$('#na').value.trim(),w=$('#nw').value.split(';').map(x=>x.trim()).filter(Boolean);
if(!q||!a||w.length<2)return alert('Cần có câu hỏi, đáp án đúng và ít nhất 2 đáp án sai.');
S.bank.push({id:'q'+Date.now(),t:$('#nt').value||'Khác',q,o:[a,...w.slice(0,3)],a:0,s:'draft'});save();adm()}
const tg=id=>{const q=S.bank.find(x=>x.id==id);q.s=q.s=='pub'?'draft':'pub';save();adm()};
const del=id=>{if(confirm('Xóa câu này?')){S.bank=S.bank.filter(x=>x.id!=id);S.wrong=S.wrong.filter(x=>x!=id);save();adm()}};
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='ioe-lop3-backup.json';a.click()}
function imp(el){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.bank))throw 0;const n=norm({prog:{},wrong:[],pin:'1234',...d});if(!n)throw 0;S=n;S.seedN=S.seedN??(S.bank.length?40:0);save();adm();alert('Đã khôi phục dữ liệu.')}catch(e){alert('File không hợp lệ.')}};r.readAsText(el.files[0])}
const chpin=()=>{const p=prompt('PIN mới (từ 4 ký tự)');if(p&&p.length>=4){S.pin=p;save();alert('Đã đổi PIN.')}};

function check(){const ids=S.bank.map(q=>q.id),ls=(()=>{try{localStorage.setItem('t','1');localStorage.removeItem('t');return 1}catch(e){return 0}})();
const r=[[ls,'Trình duyệt cho phép lưu dữ liệu'],[pub().length>=10,'Có ít nhất 10 câu đã xuất bản ('+pub().length+')'],[new Set(ids).size==ids.length,'Không trùng mã câu hỏi'],[S.bank.every(q=>q.o&&q.o.length>=2&&q.o[q.a]!=null),'Mọi câu đều có đáp án hợp lệ'],[S.wrong.every(w=>ids.includes(w)),'Danh sách câu sai khớp với ngân hàng']];
A.innerHTML=bar('Kiểm tra hệ thống')+r.map(x=>`<div class="qi ${x[0]?'g':'b'}"><span><b>${x[0]?'Đạt':'Lỗi'}</b> ${x[1]}</span></div>`).join('')}
home();
</script></body></html>
