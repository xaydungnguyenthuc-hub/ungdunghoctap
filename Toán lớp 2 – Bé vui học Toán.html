<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Toán lớp 2 – Bé vui học Toán</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--onpen:#fff;--bg:#FBFDFF;--grid:#D3E5F3;--ink:#1B2B4B;--pen:#2B5FD9;--hi:#FFD93D;--ok:#1E9E68;--bad:#D9443D;--card:#fff;--mut:#5C6C88;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12192B;--grid:#1F2B45;--ink:#EAF0FF;--pen:#7FA6FF;--card:#1B2640;--mut:#9FB0D0;--ok:#4CD39B;--bad:#FF7B73;--onpen:#0B1530}}
:root[data-theme=dark]{--bg:#12192B;--grid:#1F2B45;--ink:#EAF0FF;--pen:#7FA6FF;--card:#1B2640;--mut:#9FB0D0;--ok:#4CD39B;--bad:#FF7B73;--onpen:#0B1530}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:500 18px/1.5 "Baloo 2",system-ui,sans-serif;color:var(--ink);background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 30px;min-height:100vh}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:3px solid var(--pen);flex-wrap:wrap}
header h1{margin:0;font-size:1.15rem;font-weight:800;color:var(--pen);cursor:pointer}header small{display:block;color:var(--mut);font-size:.8rem;font-weight:500}
main{max-width:860px;margin:0 auto;padding:16px}
h2{font-size:1.4rem;margin:.3em 0 .5em}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{font:inherit;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:14px;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
.tile:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}.tile b{display:block;font-size:1.1rem}.tile span{font-size:2rem}.tile.hl{background:var(--hi);color:#1B2B4B}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--pen);color:var(--onpen);border-radius:12px;padding:10px 18px;cursor:pointer;margin:4px 4px 4px 0;min-height:44px}
.btn:disabled,.opt:disabled:not(.ok):not(.bad){opacity:.5;cursor:default}.btn.alt{background:var(--card);color:var(--ink)}.btn.red{background:var(--bad)}
.btn:focus-visible,.tile:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--hi);outline-offset:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.opt{font:inherit;font-size:1.3rem;font-weight:700;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:14px;cursor:pointer;min-height:56px}
.opt.ok{background:var(--ok);color:var(--onpen)}.opt.bad{background:var(--bad);color:var(--onpen)}.opt.sel{background:var(--hi);color:#1B2B4B}
.q h2{font-size:1.5rem}.bar{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;align-items:center}.tm{background:var(--hi);color:#1B2B4B;border-radius:10px;padding:2px 12px}
.fb{padding:10px;border-radius:10px;background:var(--grid)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.nav button{width:40px;height:40px;border-radius:10px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}.nav .d{background:var(--pen);color:var(--onpen)}.nav .c{outline:3px solid var(--hi)}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--grid);padding:6px;text-align:left}
input,select{font:inherit;padding:8px 10px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);max-width:100%}
.big{font-size:3rem;font-weight:800;color:var(--pen)}.mut{color:var(--mut);font-size:.9rem}.badge{display:inline-block;padding:6px 12px;border-radius:20px;border:2px solid var(--ink);margin:4px;background:var(--hi);color:#1B2B4B}.badge.off{background:var(--card);color:var(--mut);border-style:dashed}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}#modal .card{max-width:420px;width:100%}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;display:none;z-index:10}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div><h1 id="ttl" role="button" tabindex="0" onkeydown="if(event.key=='Enter')go('home')" onclick="go('home')"></h1><small id="slg"></small></div><div id="who"></div></header>
<main id="app"></main><div id="modal"><div class="card"><p id="mm"></p><input id="mi" style="display:none;width:100%" type="password" inputmode="numeric"><div style="margin-top:10px"><button class="btn" id="mok">OK</button><button class="btn alt" id="mno">Hủy</button></div></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),sh=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const TOP={so:'Số và cấu tạo số',cong:'Phép cộng',tru:'Phép trừ',nhan:'Nhân, chia nhập môn',bt:'Tìm số chưa biết',do:'Đo lường',hh:'Hình học',lv:'Toán có lời văn',ds:'Dãy số',td:'Toán tư duy'};
const ICO={so:'🔢',cong:'➕',tru:'➖',nhan:'✖️',bt:'❓',do:'📏',hh:'🔺',lv:'📖',ds:'🪜',td:'🧩'};
const LES={so:['Đọc, viết, so sánh số','Số có hai chữ số gồm hàng chục và hàng đơn vị. Ví dụ: 47 gồm 4 chục và 7 đơn vị. Số liền sau hơn 1, số liền trước kém 1.'],cong:['Cộng là gộp lại','23 + 5: đếm thêm 5 từ 23 được 28. Cộng có nhớ: 8 + 7 = 15, viết 5 nhớ 1.'],tru:['Trừ là bớt đi','15 − 6: lấy 15 − 5 = 10, rồi 10 − 1 = 9. Thử lại bằng phép cộng: 9 + 6 = 15.'],nhan:['Nhân và chia làm quen','Nhân là cộng các nhóm bằng nhau: 5 × 3 = 5 + 5 + 5 = 15. Chia đều: 15 : 5 = 3. (Giáo viên chọn các bảng nhân đã học trong Quản trị.)'],bt:['Tìm số còn thiếu','7 + ? = 12 thì lấy 12 − 7 = 5. ? − 4 = 6 thì lấy 6 + 4 = 10.'],do:['Đo lường','1 dm = 10 cm, 1 m = 100 cm. Kim phút chỉ số 12 là đúng giờ. Tính tiền: cộng các khoản lại.'],hh:['Hình học','Đường gấp khúc gồm các đoạn thẳng nối nhau; độ dài bằng tổng các đoạn. Hình tam giác có 3 cạnh, hình tứ giác có 4 cạnh.'],lv:['Giải bài toán có lời văn','Đọc kỹ đề: bài cho gì? hỏi gì? "Thêm, gộp" thì cộng; "bớt, còn lại" thì trừ.'],ds:['Dãy số theo quy luật','Tìm xem mỗi số hơn số trước bao nhiêu. 2, 4, 6, __: mỗi số hơn 2, số tiếp theo là 8.'],td:['Toán tư duy','Đọc kỹ, thử từng cách và kiểm tra lại. Số bí ẩn: đặt phép tính ngược để tìm.']};
function mk(t,q,a,ex,u='',st=1){let s=new Set([a]),n=0;while(s.size<4&&n++<60){let v=a+[1,2,3,-1,-2,10,-10][R(0,6)]*st;if(v>=0)s.add(v)}return{t,q,o:sh([...s].map(x=>x+u)),a:a+u,ex}}
const GEN={
cong(){let l=R(1,3),a,b;if(l==1){a=R(1,9);b=R(1,10)}else if(l==2){a=R(10,60);b=R(1,9)}else{a=R(11,69);b=R(11,99-a)}return mk('cong',`${a} + ${b} = ?`,a+b,`${a} + ${b} = ${a+b}`)},
tru(){let l=R(1,3),a,b;if(l==1){a=R(5,20);b=R(1,a)}else if(l==2){a=R(20,99);b=R(1,9)}else{a=R(30,99);b=R(11,a-1)}return mk('tru',`${a} − ${b} = ?`,a-b,`${a} − ${b} = ${a-b}`)},
so(){let k=R(0,3),n=R(10,98);if(k==0)return mk('so',`Số liền sau của ${n} là số nào?`,n+1,`${n} + 1 = ${n+1}`);if(k==1)return mk('so',`Số liền trước của ${n} là số nào?`,n-1,`${n} − 1 = ${n-1}`);if(k==2)return mk('so',`Số ${n} gồm mấy chục?`,Math.floor(n/10),`Số ${n} có ${Math.floor(n/10)} chục và ${n%10} đơn vị`,' chục');let s=new Set();while(s.size<3)s.add(R(10,99));let v=[...s],a=Math.max(...v);return{t:'so',q:`Số nào lớn nhất: ${v.join(', ')}?`,o:sh(v.map(String)),a:String(a),ex:`Số ${a} lớn nhất`}},
nhan(){let m=pk(DB.set.tb),k=R(1,10),x=R(0,2);if(x==0)return mk('nhan',`${m} × ${k} = ?`,m*k,`${m} × ${k} = ${m*k}`);if(x==1)return mk('nhan',`${m*k} : ${m} = ?`,k,`${m} × ${k} = ${m*k} nên ${m*k} : ${m} = ${k}`);return mk('nhan',`Có ${k} nhóm, mỗi nhóm ${m} quả cam. Có tất cả bao nhiêu quả cam?`,m*k,`${m} × ${k} = ${m*k}`,' quả')},
bt(){let a=R(1,40),x=R(1,40),k=R(0,2);if(k==0)return mk('bt',`${a} + ? = ${a+x}`,x,`${a+x} − ${a} = ${x}`);if(k==1)return mk('bt',`? − ${a} = ${x}`,x+a,`${x} + ${a} = ${x+a}`);return mk('bt',`${a+x} − ? = ${a}`,x,`${a+x} − ${a} = ${x}`)},
do(){let k=R(0,3);if(k==0){let p=R(1,9)*1000,q=R(1,9)*1000;return mk('do',`Mua bút ${p} đồng và vở ${q} đồng. Hết tất cả bao nhiêu tiền?`,p+q,`${p} + ${q} = ${p+q}`,' đồng',1000)}if(k==1)return R(0,1)?mk('do','1 dm = ? cm',10,'1 dm = 10 cm',' cm'):mk('do','1 m = ? cm',100,'1 m = 100 cm',' cm',10);if(k==2){let h=R(1,12),s=new Set([h]);while(s.size<4)s.add(R(1,12));return{t:'do',q:`Kim giờ chỉ số ${h}, kim phút chỉ số 12. Đồng hồ chỉ mấy giờ?`,o:sh([...s].map(x=>x+' giờ')),a:h+' giờ',ex:`Kim phút chỉ số 12 là đúng giờ: ${h} giờ`}}let a=R(5,40),b=R(5,40);return mk('do',`Bao gạo nặng ${a} kg, bao đường nặng ${b} kg. Hai bao nặng bao nhiêu ki-lô-gam?`,a+b,`${a} + ${b} = ${a+b}`,' kg')},
hh(){let k=R(0,2);if(k==0){let a=R(2,9),b=R(2,9);return mk('hh',`Đường gấp khúc ABC có AB = ${a} cm, BC = ${b} cm. Đường gấp khúc dài bao nhiêu xăng-ti-mét?`,a+b,`${a} + ${b} = ${a+b} (cm)`,' cm')}if(k==1){let a=R(2,9),b=R(2,9),c=R(2,9);return mk('hh',`Đường gấp khúc ABCD có AB = ${a} cm, BC = ${b} cm, CD = ${c} cm. Độ dài đường gấp khúc là?`,a+b+c,`${a} + ${b} + ${c} = ${a+b+c} (cm)`,' cm')}let f=[['tam giác',3],['tứ giác',4],['vuông',4],['chữ nhật',4]][R(0,3)];return{t:'hh',q:`Hình ${f[0]} có mấy cạnh?`,o:sh(['3 cạnh','4 cạnh','5 cạnh','6 cạnh']),a:f[1]+' cạnh',ex:`Hình ${f[0]} có ${f[1]} cạnh`}},
lv(){let k=R(0,3),a=R(5,50),b=R(2,40);if(k==0)return mk('lv',`Lan có ${a} quả cam, mẹ cho thêm ${b} quả. Lan có tất cả bao nhiêu quả cam?`,a+b,`${a} + ${b} = ${a+b}`,' quả');if(k==1)return mk('lv',`Nam có ${a+b} cái kẹo, Nam cho bạn ${b} cái. Nam còn lại bao nhiêu cái kẹo?`,a,`${a+b} − ${b} = ${a}`,' cái');if(k==2)return mk('lv',`Lớp 2A có ${a} bạn nữ và ${b} bạn nam. Lớp có tất cả bao nhiêu bạn?`,a+b,`${a} + ${b} = ${a+b}`,' bạn');return mk('lv',`An có ${a+b} viên bi, Bình có ${a} viên bi. An nhiều hơn Bình bao nhiêu viên bi?`,b,`${a+b} − ${a} = ${b}`,' viên')},
ds(){let s=R(1,20),d=[2,3,5,10][R(0,3)],h=R(2,4),v=[0,1,2,3,4].map(i=>s+i*d);return mk('ds',`Điền số còn thiếu: ${v.map((x,i)=>i==h?'__':x).join(', ')}`,v[h],`Mỗi số hơn số trước ${d}, nên số cần tìm là ${v[h]}`)},
td(){let k=R(0,2),a=R(3,30),c=R(a+1,60);if(k==0)return mk('td',`Số nào cộng với ${a} bằng ${c}?`,c-a,`${c} − ${a} = ${c-a}`);if(k==1)return mk('td',`Số bí ẩn trừ đi ${a} thì bằng ${c}. Số bí ẩn là số nào?`,c+a,`${c} + ${a} = ${c+a}`);let n=R(2,9);return mk('td',`Mỗi con gà có 2 chân. ${n} con gà có bao nhiêu chân?`,2*n,`2 × ${n} = ${2*n}`,' chân')}};
function gen0(t,n){let out=[],seen=new Set(),g=0;while(out.length<n&&g++<n*20){let k=t=='all'?Object.keys(GEN)[R(0,9)]:t,q=GEN[k]();if(!seen.has(q.q)){seen.add(q.q);out.push(q)}}return out}
function nq(){let k=R(0,3),a,b;if(k==0){a=R(1,9);b=R(1,10);return{q:`${a} + ${b}`,a:a+b}}if(k==1){a=R(5,20);b=R(1,a);return{q:`${a} − ${b}`,a:a-b}}if(k==2){a=R(10,60);b=R(1,9);return{q:`${a} + ${b}`,a:a+b}}a=pk(DB.set.tb);b=R(1,10);return{q:`${a} × ${b}`,a:a*b}}
// storage
let DB,S=null,A=false;
function load(){try{DB=JSON.parse(localStorage.getItem('t2'))}catch(e){DB=null}if(!DB||!Array.isArray(DB.profiles))DB={profiles:[],cur:null,hist:[],wrong:[],learned:{},set:{name:'TOÁN LỚP 2 – BÉ VUI HỌC TOÁN',slogan:'Mỗi ngày một chút – Toán học tiến bộ hơn!',pin:'1234'}};fix()}
function save(){try{localStorage.setItem('t2',JSON.stringify(DB))}catch(e){toast('Không lưu được dữ liệu trên thiết bị này')}}
const me=()=>DB.profiles.find(p=>p.id===DB.cur);
function toast(m){let t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function ask(msg,cb,inp){$('#mm').textContent=msg;let i=$('#mi');i.style.display=inp?'block':'none';i.value='';$('#modal').style.display='flex';if(inp){i.focus();i.onkeydown=e=>{if(e.key=='Enter')$('#mok').click()}}$('#mok').onclick=()=>{$('#modal').style.display='none';cb(i.value)};$('#mno').onclick=()=>$('#modal').style.display='none'}
const T={id:null,stop(){clearInterval(this.id);this.id=null},start(sec,tick,done){this.stop();let end=Date.now()+sec*1000,f=()=>{let l=Math.max(0,Math.round((end-Date.now())/1000));tick(l);if(l<=0){this.stop();done()}};f();this.id=setInterval(f,250)}};
function go(v,a){if(S&&S.live){ask('Thoát bài làm? Kết quả bài này sẽ không được lưu.',()=>{S.live=false;go(v,a)});return}T.stop();S=null;if(!['adm','bank','xm','imp','cur'].includes(v))A=false;if(!me()&&v!='prof'){v='prof'}VIEW[v](a);scrollTo(0,0);hdr()}
function hdr(){$('#ttl').textContent=DB.set.name;$('#slg').textContent=DB.set.slogan;let p=me();$('#who').innerHTML=p?`<button class="btn alt" onclick="go('prof')">${esc(p.av)} ${esc(p.name)} · ${esc(p.cls)}</button>`:''}
const P=h=>$('#app').innerHTML=h;
const stOf=p=>p.st||(p.st={tot:0,ok:0,best:0,nham:0,tp:{}});
function tally(q,ok){let s=stOf(me());s.tot++;if(ok)s.ok++;let t=s.tp[q.t]=s.tp[q.t]||[0,0];t[1]++;if(ok)t[0]++}
function rec(q,ok,mode){let p=DB.cur,w=DB.wrong.find(x=>x.pid==p&&x.q==q.q&&x.svg==q.svg);if(!ok){if(w){w.n++;w.fixed=false}else DB.wrong.push({pid:p,t:q.t,q:q.q,o:q.o,a:q.a,ex:q.ex,type:q.type,svg:q.svg,n:1,fixed:false})}else if(w&&mode=='wrong')w.fixed=true}
function ttable(bt){let r=Object.keys(bt).map(k=>{let[o,t]=bt[k];return`<tr><td>${TOP[k]}</td><td>${o}</td><td>${t-o}</td><td>${Math.round(o/t*100)}%${t<3?' <span class="mut">(còn ít dữ liệu)</span>':''}</td></tr>`}).join('');return`<table><tr><th>Chủ đề</th><th>Đúng</th><th>Sai</th><th>Tỷ lệ</th></tr>${r}</table>`}
function weak(tp){return Object.keys(tp).filter(k=>tp[k][1]>=5&&tp[k][0]/tp[k][1]<.6)}
const VIEW={
prof(){let h=`<div class="card"><h2>Hồ sơ của em</h2>`+DB.profiles.map(p=>`<button class="btn ${p.id==DB.cur?'':'alt'}" onclick="DB.cur='${p.id}';save();go('home')">${esc(p.av)} ${esc(p.name)} · ${esc(p.cls)}</button>`).join('')+`${me()?'<p><button class="btn red" onclick="delP()">Xóa hồ sơ đang chọn</button></p>':''}</div><div class="card"><h2>Tạo hồ sơ mới</h2><p><input id="pn" placeholder="Tên hoặc biệt danh" maxlength="30"> <input id="pc" value="2A" size="4" maxlength="6"></p><p>Chọn hình: <select id="pa">${['🐱','🐶','🐰','🐼','🦊','🐯','🐸','🦄'].map(a=>`<option>${a}</option>`).join('')}</select></p><button class="btn" onclick="addP()">Tạo hồ sơ</button><p class="mut">Dữ liệu chỉ lưu trên thiết bị này, không tự đồng bộ sang thiết bị khác.</p></div>`;P(h)},
home(){let t=[['learn','📚','Học Toán'],['prac','✏️','Luyện tập'],['nham','⚡','Tính nhẩm nhanh'],['td','🧩','Toán tư duy'],['exam','📝','Kiểm tra – Thi thử'],['wrong','🔁','Câu sai của em'],['ach','🏅','Thành tích'],['par','👪','Góc phụ huynh'],['adm','🛠️','Quản trị giáo viên']];P(`<div class="grid">${t.map((x,i)=>`<button class="tile ${i==0?'hl':''}" onclick="go('${x[0]}')"><span>${x[1]}</span><b>${x[2]}</b></button>`).join('')}</div>`)},

function ordq(){let s=new Set();while(s.size<4)s.add(R(10,99));let v=[...s],up=R(0,1),a=[...v].sort((x,y)=>up?x-y:y-x);return{t:'so',type:'order',q:`Sắp xếp các số ${up?'từ bé đến lớn':'từ lớn đến bé'}: ${v.join(', ')}`,o:sh(v.map(String)),a:a.join(','),ex:`Thứ tự đúng: ${a.join(', ')}`}}

function draw(){draw0();let q=S.qs[S.i],a=S.ans[S.i],fb=S.fb[S.i],o=$('.opts'),dis=!S.exam&&fb;if(q.svg)$('.q h2').insertAdjacentHTML('afterend',q.svg);

// nhập tệp / AI
VIEW.imp=()=>{if(!A)return VIEW.adm();P(admNav()+`<div class="card"><h2>Nhập câu hỏi / tài liệu</h2><p>Chọn tệp .json, .csv, .txt, .md hoặc dán nội dung. Mỗi dòng (CSV hoặc dấu |):<br><code>chủ đề|mức 1-5|mc/num/order|câu hỏi|lựa chọn1;lựa chọn2;lựa chọn3|đáp án|lời giải</code><br>Mã chủ đề: ${Object.keys(TOP).join(', ')}. Mọi câu nhập vào đều ở trạng thái Nháp để giáo viên duyệt.</p><input type="file" accept=".json,.csv,.txt,.md" onchange="impFile(this.files[0])"><textarea id="it" rows="6" style="width:100%" placeholder="Dán nội dung tại đây"></textarea><button class="btn" onclick="impGo($('#it').value)">Kiểm tra</button><div id="ip"></div><p class="mut">PDF, DOCX, ảnh: chưa hỗ trợ (cần công cụ đọc tệp hoặc OCR).</p></div><div class="card"><h2>Nhờ AI soạn câu hỏi</h2><p>Chưa kết nối AI trực tiếp vì cần máy chủ để giấu API key. Tạo câu lệnh, dán vào một AI bất kỳ, rồi dán kết quả JSON vào ô nhập ở trên.</p><p><select id="at">${tops('')}</select> <select id="al">${lvo(2)}</select> <input id="ac" type="number" value="10" min="1" max="30" style="width:5em"></p><button class="btn alt" onclick="aip()">Tạo câu lệnh</button><textarea id="ao" rows="5" style="width:100%"></textarea></div>`)};
function aip(){let t=$('#at').value;$('#ao').value=`Hãy tạo ${$('#ac').value} câu Toán lớp 2, chủ đề "${TOP[t]}", mức độ ${$('#al').value}/5. Chỉ trả về một mảng JSON, mỗi phần tử có: t:"${t}", lv:${$('#al').value}, type:"mc", q (đề bài), o (3–4 lựa chọn dạng chuỗi), a (trùng đúng một lựa chọn), ex (lời giải ngắn). Không viết thêm chữ nào ngoài JSON.`}
function impFile(f){if(!f)return;let r=new FileReader();r.onload=()=>{$('#it').value=r.result;impGo(r.result)};r.readAsText(f)}
function impGo(s){let rows=[];try{s=s.trim();if(s[0]=='['||s[0]=='{'){let d=JSON.parse(s);rows=Array.isArray(d)?d:(d.bank||[])}else s.split(/\r?\n/).forEach(l=>{l=l.trim();if(!l||/^(chủ đề|topic)/i.test(l))return;let c=l.includes('|')?l.split('|'):l.split(',');rows.push({t:c[0],lv:c[1],type:c[2],q:c[3],o:(c[4]||'').split(';'),a:c[5],ex:c[6]})})}catch(e){return $('#ip').innerHTML='<p>❌ Không đọc được nội dung: '+esc(e.message)+'</p>'}
IMP=[];let bad=[],dup=0;rows.forEach((r,i)=>{let k=TOP[r.t]?r.t:Object.keys(TOP).find(x=>TOP[x].toLowerCase()==String(r.t||'').trim().toLowerCase()),ty=['num','order'].includes(r.type)?r.type:'mc',o=ty=='num'?[]:(r.o||[]).map(x=>String(x).trim()).filter(Boolean),a=String(r.a==null?'':r.a).trim();if(ty=='order'&&!a&&!o.some(isNaN))a=[...o].sort((x,y)=>x-y).join(',');let q={id:nid()+i,st:'draft',src:'Nhập tệp',t:k,type:ty,lv:Math.min(5,Math.max(1,+r.lv||2)),q:String(r.q||'').trim(),o,a,ex:String(r.ex||'').trim(),ts:Date.now()},e=vq(q);if(DB.bank.some(x=>x.q==q.q)||IMP.some(x=>x.q==q.q)){dup++;return}if(e.length)bad.push(`Dòng ${i+1}: ${e.join(', ')}`);else IMP.push(q)});
$('#ip').innerHTML=`<p>✅ Hợp lệ: ${IMP.length} · ❌ Lỗi: ${bad.length} · Trùng đã bỏ qua: ${dup}</p>${bad.slice(0,5).map(b=>`<div class="mut">${esc(b)}</div>`).join('')}${IMP.length?`<p><b>Xem trước:</b> ${esc(IMP[0].q)} → ${esc(IMP[0].a)}</p><button class="btn" onclick="DB.bank.push(...IMP);save();toast('Đã nhập '+IMP.length+' câu vào Nháp');IMP=[];go('bank')">Nhập ${IMP.length} câu vào Nháp</button>`:''}`}
// đề thi theo ma trận
VIEW.xm=()=>{if(!A)return VIEW.adm();XR=[{t:'cong',lv:0,n:5},{t:'tru',lv:0,n:5}];P(admNav()+`<div class="card"><h2>Tạo đề theo ma trận</h2><p><input id="xn" placeholder="Tên đề" style="width:100%"></p><p>Thời gian (phút, 0 = không giới hạn): <input id="xt" type="number" value="25" min="0" style="width:5em"></p><div id="xr"></div><button class="btn alt" onclick="XR.push({t:'cong',lv:0,n:5});xrd()">+ Thêm dòng</button><p id="xs" class="mut"></p><button class="btn alt" onclick="xsave('draft')">Lưu nháp</button><button class="btn" onclick="xsave('pub')">Xuất bản</button><p class="mut">Mỗi lần học sinh làm, đề lấy câu mới theo ma trận (ưu tiên câu đã xuất bản trong ngân hàng).</p></div>`+DB.exams.map(e=>`<div class="card"><b>${esc(e.name)}</b> · ${e.rows.reduce((s,r)=>s+r.n,0)} câu · ${e.min?e.min+' phút':'không giới hạn'} · ${e.st=='pub'?'Đã xuất bản':'Nháp'}<br><span class="mut">${e.rows.map(r=>`${TOP[r.t]}${r.lv?' mức '+r.lv:''} ×${r.n}`).join(', ')}</span><br><button class="btn alt" onclick="runX('${e.id}')">Làm thử</button><button class="btn alt" onclick="xact('${e.id}','tog')">${e.st=='pub'?'Gỡ xuất bản':'Xuất bản'}</button><button class="btn alt" onclick="xact('${e.id}','dup')">Sao chép</button><button class="btn red" onclick="xact('${e.id}','del')">Xóa</button></div>`).join(''));xrd()};
function xrd(){$('#xr').innerHTML=XR.map((r,i)=>`<p><select onchange="XR[${i}].t=this.value">${tops(r.t)}</select> <select onchange="XR[${i}].lv=+this.value"><option value="0">Mọi mức</option>${lvo(r.lv)}</select> <input type="number" min="1" max="30" value="${r.n}" style="width:4.5em" onchange="XR[${i}].n=Math.max(1,+this.value||1);xrd()"> câu <button class="btn alt" onclick="XR.splice(${i},1);xrd()">Xóa</button></p>`).join('');$('#xs').textContent='Tổng: '+XR.reduce((s,r)=>s+r.n,0)+' câu'}
function xsave(st){let n=$('#xn').value.trim();if(!n||!XR.length)return toast('Cần tên đề và ít nhất một dòng');DB.exams.push({id:nid(),name:n,min:+$('#xt').value||0,rows:XR.map(r=>({...r})),st,ts:Date.now()});save();VIEW.xm()}
function xact(id,a){let e=DB.exams.find(x=>x.id==id);if(a=='tog')e.st=e.st=='pub'?'draft':'pub';else if(a=='dup')DB.exams.push({...e,id:nid(),name:e.name+' (bản sao)',st:'draft'});else return ask('Xóa đề này?',()=>{DB.exams=DB.exams.filter(x=>x.id!=id);save();VIEW.xm()});save();VIEW.xm()}
function runX(id){let e=DB.exams.find(x=>x.id==id),qs=[];e.rows.forEach(r=>{let a=gen(r.t,r.n,r.lv);if(a.length<r.n)a=a.concat(gen(r.t,r.n-a.length));qs.push(...a)});run(qs,{mode:'exam',title:e.name,exam:true,sec:e.min*60})}
const ex0=VIEW.exam;VIEW.exam=()=>{ex0();let l=DB.exams.filter(e=>e.st=='pub');if(l.length)$('#app').insertAdjacentHTML('beforeend',`<div class="card"><h2>Đề của giáo viên</h2>${l.map(e=>`<button class="btn" onclick="runX('${e.id}')">${esc(e.name)}</button>`).join('')}</div>`)};
// chương trình
VIEW.cur=()=>{if(!A)return VIEW.adm();P(admNav()+`<div class="card"><h2>Chương trình học</h2><p>Bảng nhân/chia đã học:</p>${[2,3,4,5,6,7,8,9,10].map(n=>`<label style="margin-right:10px"><input type="checkbox" class="ct" value="${n}" ${DB.set.tb.includes(n)?'checked':''}> ${n}</label>`).join('')}<p>Chủ đề dùng khi luyện tập và thi:</p>${Object.keys(TOP).map(k=>`<label style="display:block"><input type="checkbox" class="co" value="${k}" ${DB.set.off.includes(k)?'':'checked'}> ${TOP[k]}</label>`).join('')}<button class="btn" onclick="DB.set.tb=[...document.querySelectorAll('.ct:checked')].map(x=>+x.value);if(!DB.set.tb.length)DB.set.tb=[2,5];DB.set.off=[...document.querySelectorAll('.co:not(:checked)')].map(x=>x.value);if(DB.set.off.length>=10)DB.set.off=[];save();toast('Đã lưu')">Lưu</button></div>`)};
function delP(){let p=me();ask('Xóa hồ sơ "'+p.name+'" cùng toàn bộ lịch sử, câu sai, thành tích? Không thể hoàn tác.',()=>{DB.profiles=DB.profiles.filter(x=>x.id!=p.id);DB.hist=DB.hist.filter(x=>x.pid!=p.id);DB.wrong=DB.wrong.filter(x=>x.pid!=p.id);delete DB.learned[p.id];DB.cur=DB.profiles.length?DB.profiles[0].id:null;save();go('prof')})}
function addP(){let n=$('#pn').value.trim();if(!n)return toast('Em hãy nhập tên nhé');let p={id:'p'+Date.now(),name:n,cls:$('#pc').value||'2A',av:$('#pa').value,created:Date.now(),st:{tot:0,ok:0,best:0,nham:0,tp:{}}};DB.profiles.push(p);DB.cur=p.id;save();go('home')}
function learned(k){let l=DB.learned[DB.cur]=DB.learned[DB.cur]||[];if(!l.includes(k))l.push(k);save();run(gen(k,5),{mode:'prac',title:'Luyện: '+TOP[k]})}
function o2q(){return DB.wrong.filter(w=>w.pid==DB.cur&&!w.fixed).slice(0,10).map(w=>({t:w.t,q:w.q,o:sh(w.o),a:w.a,ex:w.ex,type:w.type,svg:w.svg}))}
function run(qs,o){if(!qs.length)return toast('Chưa có câu hỏi phù hợp');T.stop();S={qs,i:0,ans:qs.map(()=>null),fb:qs.map(()=>false),mode:o.mode,title:o.title,exam:!!o.exam,sec:o.sec||0,left:o.sec||0,live:true,done:false,t0:Date.now(),streak:0};if(S.exam&&S.sec)T.start(S.sec,l=>{S.left=l;let e=$('#tm');if(e)e.textContent=fmt(l)},finish);draw()}
function draw0(){let q=S.qs[S.i],a=S.ans[S.i],fb=S.fb[S.i],n=S.qs.length,last=S.i==n-1;let h=`<div class="bar"><b>Câu ${S.i+1}/${n}</b><span>${esc(S.title)}</span>${S.exam&&S.sec?`<b id="tm" class="tm">${fmt(S.left)}</b>`:''}</div><div class="card q"><h2>${esc(q.q)}</h2><div class="opts">`+q.o.map((x,j)=>{let c='';if(!S.exam&&fb){if(x==q.a)c=' ok';else if(x==a)c=' bad'}else if(S.exam&&x==a)c=' sel';return`<button class="opt${c}" ${!S.exam&&fb?'disabled':''} onclick="pick(${j})">${esc(x)}</button>`}).join('')+'</div>';if(!S.exam&&fb)h+=`<p class="fb">${a==q.a?'🎉 Đúng rồi, giỏi quá!':'💪 Chưa đúng, không sao nhé! Đáp án là <b>'+esc(q.a)+'</b>.'} ${esc(q.ex)}</p><button class="btn" onclick="${last?'finish()':'S.i++;draw()'}">${last?'Xem kết quả':'Câu tiếp'}</button>`;if(S.exam)h+=`<div class="nav">${S.qs.map((_,i)=>`<button class="${S.ans[i]!=null?'d':''} ${i==S.i?'c':''}" onclick="S.i=${i};draw()">${i+1}</button>`).join('')}</div><button class="btn alt" ${S.i?'':'disabled'} onclick="S.i--;draw()">Câu trước</button><button class="btn alt" ${last?'disabled':''} onclick="S.i++;draw()">Câu sau</button><button class="btn red" onclick="submit()">Nộp bài</button>`;$('#app').innerHTML=h+'</div>'}
function pick(j){let q=S.qs[S.i],x=q.o[j];if(S.exam){S.ans[S.i]=x;return draw()}if(S.fb[S.i])return;S.ans[S.i]=x;S.fb[S.i]=true;let ok=x==q.a;tally(q,ok);rec(q,ok,S.mode);S.streak=ok?S.streak+1:0;let s=stOf(me());s.best=Math.max(s.best,S.streak);save();draw()}
function submit(){let b=S.ans.filter(x=>x==null).length;ask(b?`Còn ${b} câu chưa làm. Em vẫn muốn nộp bài?`:'Nộp bài ngay bây giờ?',finish)}
function score(qs,ans){let r=0,w=0,b=0,bt={};qs.forEach((q,i)=>{let a=ans[i],ok=a==q.a;(bt[q.t]=bt[q.t]||[0,0])[1]++;if(ok){r++;bt[q.t][0]++}else if(a==null)b++;else w++});return{r,w,b,bt,sc:Math.round(r/qs.length*100)/10}}
function finish(){if(!S||S.done)return;$('#modal').style.display='none';S.done=true;S.live=false;T.stop();let c=score(S.qs,S.ans),n=S.qs.length;if(S.exam)S.qs.forEach((q,i)=>{let ok=S.ans[i]==q.a;tally(q,ok);rec(q,ok,S.mode)});let secs=Math.round((Date.now()-S.t0)/1000);DB.hist.push({id:'h'+Date.now(),pid:DB.cur,ts:Date.now(),mode:S.mode,title:S.title,n,r:c.r,w:c.w,b:c.b,sc:c.sc,secs,bt:c.bt});save();let ws=weak(stOf(me()).tp);P(`<div class="card"><h2>Kết quả: ${esc(S.title)}</h2><div class="big">${c.sc} điểm</div><p>Đúng ${c.r} · Sai ${c.w} · Bỏ trống ${c.b} · Chính xác ${Math.round(c.r/n*100)}% · Thời gian ${fmt(secs)}</p><p>${c.sc>=8?'Em làm rất tốt! Hãy thử một bài mới nhé!':'Em đã cố gắng rồi! Mình luyện thêm những câu chưa chắc nhé.'}</p>${ttable(c.bt)}${ws.length?`<p>Gợi ý ôn: ${ws.map(k=>`<button class="btn alt" onclick="go('prac','${k}')">${TOP[k]}</button>`).join('')}</p>`:''}<button class="btn" onclick="go('home')">Về trang chủ</button><button class="btn alt" onclick="go('wrong')">Câu sai của em</button></div>`);S=null}
function nstart(sec){T.stop();let sc=0,st=0,ok=0,tot=0,cur=nq(),left=sec;S={live:true,done:false};const dr=()=>{$('#app').innerHTML=`<div class="bar"><b>Điểm: <span id="ns">${sc}</span></b><b>Chuỗi đúng: ${st}</b><b id="tm" class="tm">${fmt(left)}</b></div><div class="card q"><div class="big" style="text-align:center">${cur.q} = ?</div><p style="text-align:center"><input id="na" type="number" inputmode="numeric" style="font-size:2rem;width:7em"></p><p style="text-align:center"><button class="btn" id="nb">Trả lời</button></p></div>`;let i=$('#na');i.focus();let f=()=>{if(i.value==='')return;tot++;let g=+i.value==cur.a;if(g){ok++;st++;sc+=10+(st>=5?5:0)}else st=0;cur=nq();dr()};$('#nb').onclick=f;i.onkeydown=e=>{if(e.key=='Enter')f()}};
let end=()=>{if(!S||S.done)return;S.done=true;S.live=false;T.stop();let p=stOf(me());p.nham=Math.max(p.nham,sc);DB.hist.push({id:'h'+Date.now(),pid:DB.cur,ts:Date.now(),mode:'nham',title:'Tính nhẩm '+sec+'s',n:tot,r:ok,w:tot-ok,b:0,sc:Math.round(ok/Math.max(tot,1)*100)/10,secs:sec,bt:{}});save();P(`<div class="card"><h2>Hết giờ!</h2><div class="big">${sc} điểm</div><p>Đúng ${ok}/${tot} câu. Nhanh mà vẫn chính xác là tuyệt nhất!</p><button class="btn" onclick="go('nham')">Chơi lại</button><button class="btn alt" onclick="go('home')">Về trang chủ</button></div>`);S=null};dr();T.start(sec,l=>{left=l;let e=$('#tm');if(e)e.textContent=fmt(l)},end)}
function dl(name,txt,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function bk(){dl(`toan-lop-2-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({...DB,set:{...DB.set,pin:undefined}}),'application/json')}
function csv(all){let r=[['Học sinh','Thời gian','Chế độ','Tên bài','Số câu','Đúng','Sai','Bỏ trống','Điểm','Giây']].concat(DB.hist.filter(x=>x.pid==DB.cur||(all&&A)).map(x=>[(DB.profiles.find(p=>p.id==x.pid)||{}).name||'',new Date(x.ts).toLocaleString('vi-VN'),x.mode,x.title,x.n,x.r,x.w,x.b,x.sc,x.secs]));dl('lich-su.csv','\ufeff'+r.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function rs(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.profiles)||!Array.isArray(d.hist)||!Array.isArray(d.wrong)||!d.set)throw 0;ask(`Tệp hợp lệ: ${d.profiles.length} hồ sơ, ${d.hist.length} lần làm bài. Khôi phục sẽ thay dữ liệu hiện tại. Tiếp tục?`,()=>{bk();let pin=DB.set.pin;DB=d;DB.set.pin=pin;DB.learned=DB.learned||{};fix();save();toast('Đã khôi phục');hdr();go('adm')})}catch(e){toast('Tệp không hợp lệ, dữ liệu cũ được giữ nguyên')}};r.readAsText(f)}
function diag(){let o=[];const t=(n,f)=>{let m;try{m=f()}catch(e){m='LỖI: '+e.message}o.push(`<div>${m===true?'✅':'❌'} ${n}${m===true?'':' – '+m}</div>`)};t('LocalStorage',()=>{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true});t('Sinh câu hỏi (1000 câu: đáp án nằm trong lựa chọn, không trùng)',()=>{for(let k in GEN)for(let i=0;i<100;i++){let q=GEN[k]();if(q.type=='num')continue;if(q.type=='order'?q.a.split(',').length!=q.o.length:(!q.o.includes(q.a)||new Set(q.o).size!=q.o.length||q.o.length<3))return k+': '+q.q}return true});t('Chấm điểm',()=>{let c=score([{t:'cong',a:'2'},{t:'cong',a:'3'},{t:'tru',a:'1'}],['2','4',null]);return c.r==1&&c.w==1&&c.b==1&&c.sc==3.3||JSON.stringify(c)});t('Timer dừng sạch',()=>{T.start(5,()=>{},()=>{});T.stop();return T.id===null});t('Dữ liệu',()=>DB.profiles.every(p=>p.id&&p.name)||'hồ sơ thiếu thông tin');$('#dg').innerHTML=o.join('')}
load();hdr();go(DB.profiles.length?'home':'prof');
</script></body></html>
