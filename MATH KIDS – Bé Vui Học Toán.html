<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MATH KIDS – Bé Vui Học Toán</title>
<style>
:root{--bg:#fff7e0;--card:#fff;--ink:#3b2f5e;--mut:#7a6d99;--pri:#7c5cff;--ok:#2fb86b;--bad:#ff8a5c;--line:#e4d6ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1833;--card:#2a2348;--ink:#f4efff;--mut:#bdb2e0;--line:#453b73}}
:root[data-theme="dark"]{--bg:#1d1833;--card:#2a2348;--ink:#f4efff;--mut:#bdb2e0;--line:#453b73}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;font-size:18px}
#app{max-width:900px;margin:auto;padding:14px}
h1,h2{margin:0}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar h2{flex:1;font-size:22px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:700}
.ib,.btn{font:inherit;border:0;border-radius:18px;cursor:pointer;color:#fff;background:var(--pri);padding:12px 22px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.ib{padding:8px 14px;font-size:22px;background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.sel{background:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{font:inherit;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:24px;padding:18px 8px;cursor:pointer;text-align:center;font-weight:700;min-height:130px}
.tile i{display:block;font-style:normal;font-size:52px;margin-bottom:6px}
.tile:active,.opt:active{transform:scale(.97)}
.card{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:16px;text-align:center;margin-bottom:12px}
.q{font-size:24px;font-weight:700;margin-bottom:8px}
.big{font-size:44px;line-height:1.3;text-align:center}
.its{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.it{font-size:46px;cursor:pointer;position:relative;user-select:none}
.it[data-n]::after{content:attr(data-n);position:absolute;right:-4px;top:-6px;background:var(--pri);color:#fff;font-size:15px;border-radius:99px;min-width:22px;padding:0 5px}
.g{display:inline-block;font-size:30px;line-height:1.2}
.gone{opacity:.25;filter:grayscale(1)}
.bx{display:inline-block;border:4px dashed var(--pri);border-radius:16px;padding:8px 14px}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.opt{font:inherit;font-size:30px;min-width:100px;min-height:84px;padding:10px 16px;border-radius:22px;border:3px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:700}
.opt.good{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad);opacity:.6}
.fb{margin:12px 0;font-size:21px;font-weight:700;padding:10px;border-radius:18px}
.fb.good{color:var(--ok)}.fb.hint{color:var(--bad)}
.prog{color:var(--mut);margin-bottom:6px;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.bd{opacity:.35;filter:grayscale(1)}.bd.on{opacity:1;filter:none}
small,.mut{color:var(--mut);font-size:14px}
input{font:inherit;font-size:22px;padding:10px 14px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);width:100%;max-width:340px;text-align:center}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[R(0,a.length-1)],shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={p:null,stage:'B',stars:0,badges:[],st:{},sess:0,days:[],sound:true};
try{const d=JSON.parse(localStorage.getItem('mk1'));if(d)S=Object.assign(S,d)}catch(e){}
const save=()=>{try{localStorage.setItem('mk1',JSON.stringify(S))}catch(e){}};
const V=h=>{$('#app').innerHTML=h;window.scrollTo(0,0)};
const W=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín','mười','mười một','mười hai','mười ba','mười bốn','mười lăm','mười sáu','mười bảy','mười tám','mười chín','hai mươi'];
function say(t){if(!S.sound)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,'').replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu,''));u.lang='vi-VN';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const NM={'🍎':'quả táo','🐱':'con mèo','🌸':'bông hoa','🚗':'chiếc ô tô','⭐':'ngôi sao','🐥':'chú gà con','🍌':'quả chuối','🧸':'chú gấu bông','🥕':'củ cà rốt'};
const ES=Object.keys(NM).filter(x=>x!='🥕'),MX={A:6,B:10,C:20},mx=()=>MX[S.stage];
const grp=(n,e)=>`<span class="g">${Array(n).fill(e).join('')}</span>`;
function nums(n,hi,k=3){const s=new Set([n]);let g=0;while(s.size<k&&g++<60)s.add(R(Math.max(1,n-3),Math.min(hi,n+3)));return shuf([...s]).map(x=>({h:x,v:x}))}
/* ===== Bộ tạo hoạt động ===== */
function count(e,q){e=e||pick(ES);const n=R(1,Math.min(mx(),12));return{m:'count',q:q||`Con hãy đếm xem có bao nhiêu ${NM[e]} nhé!`,vis:`<div class="its">${Array(n).fill(`<span class="it" onclick="tap(this)">${e}</span>`).join('')}</div>`,o:nums(n,12),a:n,hint:`Mình cùng đếm lại nhé! Chạm vào từng ${NM[e]} để đếm.`,ex:`Có ${n} ${NM[e]}!`}}
function number(mode){const M=mx();if(S.stage=='A'&&mode!='miss'){const n=R(1,M);return{m:'number',q:`Số ${W[n]} là chữ số nào?`,vis:`<div class="big">${W[n].toUpperCase()}</div>`,o:nums(n,M),a:n,hint:'Nghe lại tên số rồi chọn chữ số nhé!',ex:`Đây là số ${n}!`}}
const a=R(1,M-2);return{m:'number',q:'Số nào còn thiếu?',vis:`<div class="big">${a} , ❓ , ${a+2}</div>`,o:nums(a+1,M),a:a+1,hint:`Đếm cùng mình: ${a}, ... , ${a+2}.`,ex:`Số ${a+1} đứng giữa ${a} và ${a+2}!`}}
function compare(){const e=pick(ES),M=Math.min(mx(),10),eq=S.stage!='A'&&Math.random()<.2;let a=R(1,M),b=eq?a:R(1,M);if(!eq)while(b==a)b=R(1,M);const more=Math.random()<.5,o=[{h:grp(a,e),v:'L'},{h:grp(b,e),v:'R'}];if(S.stage!='A')o.push({h:'Bằng nhau',v:'E'});
return{m:'compare',q:`Bên nào có ${more?'nhiều':'ít'} ${NM[e]} hơn?`,vis:'',o,a:a==b?'E':((a>b)==more?'L':'R'),hint:'Đếm từng bên rồi so sánh nhé!',ex:`Bên trái có ${a}, bên phải có ${b}.`}}
const C=['#ff6b6b','#4dabf7','#ffd43b','#51cf66'];
const SH={'tròn':c=>`<circle cx="30" cy="30" r="24" fill="${c}"/>`,'vuông':c=>`<rect x="8" y="8" width="44" height="44" fill="${c}"/>`,'tam giác':c=>`<polygon points="30,6 55,52 5,52" fill="${c}"/>`,'chữ nhật':c=>`<rect x="3" y="14" width="54" height="32" fill="${c}"/>`};
const sv=(k,c,z=70)=>`<svg viewBox="0 0 60 60" width="${z}" height="${z}">${SH[k](c)}</svg>`;
function shape(){const K=Object.keys(SH),k=pick(K);if(S.stage!='A'&&Math.random()<.5){const n=R(1,5),ot=K.filter(x=>x!=k),L=shuf([...Array(n).fill(k),...Array(R(2,4)).fill(0).map(()=>pick(ot))]);return{m:'shape',q:`Có bao nhiêu hình ${k}?`,vis:`<div class="its">${L.map(x=>sv(x,pick(C),56)).join('')}</div>`,o:nums(n,9),a:n,hint:`Tìm các hình ${k} rồi đếm nhé!`,ex:`Có ${n} hình ${k}!`}}
const o=shuf([k,...shuf(K.filter(x=>x!=k)).slice(0,2)]).map(x=>({h:sv(x,pick(C)),v:x}));return{m:'shape',q:`Đâu là hình ${k}?`,vis:'',o,a:k,hint:`Hình ${k} trông thế này nhé!`,ex:`Đây là hình ${k}!`}}
const PG=[['above','below'],['in','out'],['left','right']],PL={above:'Trên hộp',below:'Dưới hộp',in:'Trong hộp',out:'Ngoài hộp',left:'Bên trái hộp',right:'Bên phải hộp'},PN={'🐱':'Con mèo','🐶':'Con chó','🐰':'Con thỏ'};
function position(){const g=pick(PG),k=pick(g),c=pick(Object.keys(PN)),Vs={above:`${c}<br>📦`,below:`📦<br>${c}`,in:`<span class="bx">${c}</span>`,out:`<span class="bx">📦</span> ${c}`,left:`${c} 📦`,right:`📦 ${c}`};
return{m:'position',q:`${PN[c]} đang ở đâu?`,vis:`<div class="big">${Vs[k]}</div>`,o:g.map(x=>({h:PL[x],v:x})),a:k,hint:'Nhìn kỹ con vật và chiếc hộp nhé!',ex:`${PN[c]} đang ở ${PL[k].toLowerCase()}!`}}
function pattern(){const U=S.stage=='A'?['AB']:['AB','AAB','ABC'].concat(S.stage=='C'?['ABB','AABB']:[]),u=pick(U),cs=shuf(['🔴','🔵','🟡','🟢','🟣']),mp={};[...new Set(u)].forEach((l,i)=>mp[l]=cs[i]);
const L=u.length*2+1,seq=[...Array(L)].map((_,i)=>mp[u[i%u.length]]),a=mp[u[L%u.length]],o=shuf([a,...cs.filter(x=>x!=a)].slice(0,3)).map(x=>({h:x,v:x}));
return{m:'pattern',q:'Hình nào đi tiếp theo quy luật?',vis:`<div class="big">${seq.join(' ')} ❓</div>`,o,a,hint:'Nhìn xem các hình lặp lại thế nào nhé!',ex:'Các hình lặp lại theo quy luật, nên hình này đi tiếp!'}}
function odd(){const [x,y]=shuf(ES),n=R(4,6),i=R(0,n-1),L=[...Array(n)].map((_,j)=>j==i?y:x);return{m:'pattern',q:'Bạn nào khác các bạn còn lại?',vis:'',o:L.map((h,j)=>({h,v:j})),a:i,hint:'Tìm bạn không giống các bạn khác nhé!',ex:'Bạn này khác các bạn còn lại!'}}
function addsub(){const M=mx(),add=Math.random()<.5,e=pick(ES);let a,b,r;if(add){a=R(1,M-1);b=R(1,M-a);r=a+b}else{a=R(2,M);b=R(1,a-1);r=a-b}
const eq=`<div class="big">${a} ${add?'+':'−'} ${b} = ❓</div>`;let vis=eq;if(add?r<=10:a<=10)vis=(add?`<div class="its">${grp(a,e)} ➕ ${grp(b,e)}</div>`:`<div class="its">${grp(a-b,e)}<span class="gone">${grp(b,e)}</span></div>`)+eq;
return{m:'addsub',q:add?`Có ${a} ${NM[e]}, thêm ${b} ${NM[e]}. Có tất cả bao nhiêu?`:`Có ${a} ${NM[e]}, bớt đi ${b}. Còn lại bao nhiêu?`,vis,o:nums(r,M),a:r,hint:add?'Gộp lại rồi đếm tất cả nhé!':'Bớt đi rồi đếm những cái còn lại nhé!',ex:`${a} ${add?'+':'−'} ${b} = ${r}`}}
function match(){const e=pick(ES),n=R(1,Math.min(mx(),8));return{m:'number',q:'Tìm nhóm có số lượng giống chữ số này nhé!',vis:`<div class="big">${n}</div>`,o:nums(n,8).map(x=>({h:grp(x.v,e),v:x.v})),a:n,hint:`Đếm từng nhóm xem có ${n} không nhé!`,ex:`Nhóm này có ${n}!`}}
function flower(){const n=R(1,mx());return{m:'number',q:`Giúp ong 🐝 bay đến bông hoa số ${n}!`,vis:'',o:nums(n,mx()).map(x=>({h:`🌼<br>${x.v}`,v:x.v})),a:n,hint:`Tìm bông hoa mang số ${n} nhé!`,ex:`Ong đã đến hoa số ${n}!`}}
const MOD={count,number,compare,shape,position,pattern,odd,addsub};
const AR={fam:{t:'Bé làm quen với Toán',i:'🌈',g:['compare','position','shape']},cnt:{t:'Bé học đếm',i:'🔢',g:['count','number']},shp:{t:'Thế giới hình dạng',i:'🔷',g:['shape']},smt:{t:'Bé thông minh',i:'🧩',g:['pattern','position','odd']},add:{t:'Bé tập cộng trừ',i:'🍎',g:['addsub']}};
const GM=[{t:'Cho thỏ ăn',i:'🐰',f:()=>count('🥕','Đếm cà rốt để cho thỏ 🐰 ăn nhé!')},{t:'Tàu số',i:'🚂',f:()=>number('miss')},{t:'Tìm cặp đôi',i:'🃏',f:match},{t:'Ong tìm hoa',i:'🐝',f:flower},{t:'Đoàn tàu quy luật',i:'🚃',f:pattern},{t:'Ai khác biệt?',i:'🔍',f:odd},{t:'Bé giúp bạn',i:'🤝',f:()=>S.stage=='A'?count():addsub()}];
const ML={count:'Đếm',number:'Nhận biết số',compare:'So sánh',shape:'Hình học',position:'Vị trí',pattern:'Quy luật',addsub:'Cộng và trừ'};
const SL={A:'Bé 4–5 tuổi',B:'Bé 5–6 tuổi',C:'Lớp 1'};
const tot=m=>(S.st[m]||{}).tot||0;
const BD=[{n:'Bé biết đếm',i:'🍎',f:()=>tot('count')>=10},{n:'Bé nhận biết số',i:'🔢',f:()=>tot('number')>=10},{n:'Bé giỏi hình học',i:'🔷',f:()=>tot('shape')>=10},{n:'Bé tìm quy luật',i:'🧩',f:()=>tot('pattern')>=10},{n:'Bé tập cộng',i:'➕',f:()=>tot('addsub')>=10},{n:'Bé kiên trì',i:'💪',f:()=>S.sess>=5},{n:'Bé hoàn thành tuần học',i:'🌟',f:()=>S.days.length>=7}];
/* ===== Màn hình ===== */
const bar=t=>`<div class="bar"><button class="ib" onclick="home()" aria-label="Về trang chủ">🏠</button><h2>${t}</h2><span class="pill">⭐ ${S.stars}</span></div>`;
function setup(){V(`<div class="card"><h1>🧮 MATH KIDS</h1><p class="q">Bé vui học Toán</p><p>Bé tên gì nhỉ?</p><input id="nm" maxlength="20" placeholder="Tên gọi của bé" value="${esc(S.p||'')}"><p>Bé học ở giai đoạn nào?</p><div class="row">${Object.keys(SL).map(k=>`<button class="btn alt ${S.stage==k?'sel':''}" onclick="S.stage='${k}';setup2()">${SL[k]}</button>`).join('')}</div><button class="btn" onclick="go()">Bắt đầu thôi! 🚀</button><p class="mut">Chỉ cần tên gọi thân mật. Dữ liệu chỉ lưu trên thiết bị này.</p></div>`)}
function setup2(){const v=$('#nm').value;setup();$('#nm').value=v}
function go(){S.p=($('#nm').value.trim()||'Bé').slice(0,20);save();home()}
function home(){Q=null;if(!S.p)return setup();const t=Object.entries(AR).filter(([k])=>!(k=='add'&&S.stage=='A')).map(([k,a])=>`<button class="tile" onclick="area('${k}')"><i>${a.i}</i>${a.t}</button>`).join('');
V(`<div class="bar"><h2>Chào ${esc(S.p)}! 👋</h2><span class="pill">⭐ ${S.stars}</span></div><div class="grid">${t}<button class="tile" onclick="games()"><i>🎮</i>Trò chơi Toán vui</button><button class="tile" onclick="chal()"><i>⭐</i>Thử thách của bé</button><button class="tile" onclick="badges()"><i>🏆</i>Bộ sưu tập huy hiệu</button><button class="tile" onclick="parents()"><i>👨‍👩‍👧</i>Góc cha mẹ</button><button class="tile" onclick="pin()"><i>⚙️</i>Góc giáo viên</button>${pubs().length?'<button class="tile" onclick="start(\'Bài của cô giáo\',[bank],5)"><i>📚</i>Bài của cô giáo</button>':''}</div><p class="mut" style="text-align:center;margin-top:18px">${SL[S.stage]} · Học qua chơi, không áp lực. Ứng dụng độc lập, không thay thế chương trình chính thức. Không quảng cáo.</p>`)}
function area(k){const a=AR[k];start(a.t,a.g.map(x=>MOD[x]),5)}
function games(){V(bar('Trò chơi Toán vui')+`<div class="grid">${GM.map((g,i)=>`<button class="tile" onclick="start(GM[${i}].t,[GM[${i}].f],5)"><i>${g.i}</i>${g.t}</button>`).join('')}</div>`)}
function chal(){V(bar('Thử thách của bé')+`<div class="card"><p class="q">Bé muốn làm mấy câu? Không cần vội, không tính giờ!</p><div class="row">${[5,10,15].map(n=>`<button class="btn" onclick="startC(${n})">${n} câu</button>`).join('')}</div></div>`)}
function startC(n){const k=['compare','position','shape','count','number','pattern','odd'];if(S.stage!='A')k.push('addsub');if(pubs().length)k.push('bank');start('Thử thách của bé',k.map(x=>MOD[x]),n)}
let Q,cnt=0;
function start(t,fs,n,pv){Q={t,fs,n,pv,i:0,ok:0,r:{}};nextQ()}
function nextQ(){if(Q.i>=Q.n)return fin();Q.q=pick(Q.fs)();Q.tr=0;Q.lock=false;cnt=0;SEL=-1;draw()}
function draw(){const q=Q.q;V(bar(Q.t)+`<div class="prog">Câu ${Q.i+1} / ${Q.n}</div><div class="card"><div class="q">${q.q} <button class="ib" onclick="playQ(Q.q)" aria-label="Nghe lại">🔊</button></div>${q.vis}</div>${q.mt?`<div class="opts" style="margin-bottom:10px">${q.mt.T.map((t,j)=>`<button class="opt tgt" onclick="mTap(${j})">${esc(t)}</button>`).join('')}</div>`:''}<div class="opts">${q.o.map((o,i)=>`<button class="opt" onclick="ans(${i})">${o.h}</button>`).join('')}</div><div id="fb"></div>`);playQ(q)}
function tap(el){if(el.dataset.n)return;el.dataset.n=++cnt;say(W[cnt]||cnt)}
function fb(h,c,next){$('#fb').innerHTML=`<div class="fb ${c}">${h}</div>${next?'<div class="row"><button class="btn" onclick="nxt()">Tiếp ➜</button></div>':''}`}
function rec(m,first){if(Q.pv)return;const s=S.st[m]=S.st[m]||{ok:0,tot:0},r=Q.r[m]=Q.r[m]||[0,0];s.tot++;r[1]++;if(first){s.ok++;r[0]++;Q.ok++}S.stars+=first?2:1;save()}
function ans(i){if(Q.lock)return;if(Q.q.ord)return oTap(i);if(Q.q.mt)return mSel(i);const q=Q.q,B=document.querySelectorAll('.opt');
if(q.o[i].v===q.a){Q.lock=true;B[i].classList.add('good');rec(q.m,Q.tr==0);const t=pick(['Giỏi lắm!','Tuyệt vời!','Bé làm đúng rồi!','Hoan hô!']);fb(`🎉 ${t} ${q.ex}`,'good',1);say(t+' '+q.ex)}
else{Q.tr++;B[i].classList.add('bad');B[i].disabled=true;if(Q.tr>=2){Q.lock=true;q.o.forEach((o,j)=>{if(o.v===q.a)B[j].classList.add('good')});rec(q.m,false);fb(`Không sao đâu! ${q.ex} Mình thử câu khác nhé.`,'hint',1);say(q.ex)}else{fb('💛 '+q.hint,'hint');say(q.hint)}}}
function nxt(){Q.i++;nextQ()}
